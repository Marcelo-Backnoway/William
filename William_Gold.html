<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }

.topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 12px; color: #c8a96e; letter-spacing: 1px; font-weight: 700; }

.server-bar { display: flex; background: #0d0d1a; border-bottom: 1px solid #2a2a3a; position: sticky; top: 37px; z-index: 99; }
.srv-btn { flex: 1; padding: 8px 4px; text-align: center; font-size: 11px; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; color: #555; transition: all 0.2s; }
.srv-btn.active-eu       { color: #90EE90; border-color: #90EE90; background: #0f1a0f; }
.srv-btn.active-america  { color: #87CEFA; border-color: #87CEFA; background: #0f141a; }
.srv-btn.active-murica   { color: #ff9944; border-color: #ff9944; background: #1a120a; }

.container { padding: 10px; max-width: 480px; margin: 0 auto; }

.card { background: #141424; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.card-title { font-size: 11px; font-weight: 700; color: #c8a96e; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.backup-row{ display:flex; gap:8px; padding:10px 10px 4px; max-width:480px; margin:0 auto; }

.backup-hint{ text-align:center; font-size:10px; color:#666; padding:0 10px 6px; max-width:480px; margin:0 auto; }
input[type=file]{ display:none; }
#syncDot{
  position: fixed; bottom: 14px; right: 14px; z-index: 998;
  width: 10px; height: 10px; border-radius: 50%; background: #555;

}
@keyframes pulsoCriticoGrande {

}
#syncDot.dot-critico {
  position: fixed; top: 50%; left: 50%; right: auto; bottom: auto;
  transform: translate(-50%, -50%);

  line-height: 1.3; white-space: normal;
  animation: pulsoCriticoGrande 1s ease-in-out infinite;
}
#syncDot.dot-perto-laranja {
  box-shadow: 0 0 0 4px rgba(255,153,68,0.65);
}
#syncDot.dot-perto-amarelo {
  box-shadow: 0 0 0 4px rgba(232,197,71,0.6);
}
#syncDot.dot-adiado {
  box-shadow: 0 0 0 4px rgba(150,150,190,0.55);
}
</style>

<script>
// ══════════════════════════════════════════════════════
// PERSONAGENS PADRÃO (usados só pro seletor "farmando")
// ══════════════════════════════════════════════════════
var EU_CHARS_DEFAULT = [
  {nome:'Archlord',  cat:'Principal'},
  {nome:'Baygon',    cat:'Principal'},
  {nome:'Maditau',   cat:'Principal'},
  {nome:'Varian',    cat:'Principal'},
  {nome:'Mxyzptlk',  cat:'Intermediário'},
];

var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — dados ficam sincronizados
var server = 'eu';
var goldCharSelecionado = '';

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function saveState(s) { try { s.lastModified = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }
function pertenceAoGold(k){ return /_gold$/.test(k); }

function getChars() {
  var s = loadState(), k = server+'_chars';
  if (!s[k]) { s[k] = server==='eu' ? JSON.parse(JSON.stringify(EU_CHARS_DEFAULT)) : []; saveState(s); }
  return s[k];
}

function parsePtBrDate(str){
  var p=String(str).split('/');
  return new Date(Number(p[2]),Number(p[1])-1,Number(p[0]));
}

function getGoldState() {
  var s = loadState(), k = server+'_gold';
  var hoje = new Date().toLocaleDateString('pt-BR');
  var mudou = false;
  if (!s[k]) { s[k] = { total:0, historico:[], data: hoje, diario: [], acumulado:0, diasContados:0 }; mudou = true; }
  if (!s[k].diario) { s[k].diario = []; mudou = true; }
  if (s[k].acumulado === undefined) { s[k].acumulado = 0; mudou = true; }
  if (s[k].diasContados === undefined) { s[k].diasContados = 0; mudou = true; }
  if (s[k].data !== hoje && parsePtBrDate(s[k].data) < parsePtBrDate(hoje)) {
    // O dia realmente já passou (data guardada é anterior à de hoje) — fecha e começa do zero.
    // Se a data guardada for FUTURA (ex: simulação de teste), não mexe em nada.
    syncDiario(s[k]);
    s[k].acumulado = (s[k].acumulado||0) + s[k].total;
    s[k].diasContados = (s[k].diasContados||0) + 1;
    s[k].total = 0;
    s[k].historico = [];
    s[k].data = hoje;
    syncDiario(s[k]);
    mudou = true;
  }
  if (mudou) saveState(s); // só grava (e sincroniza) quando algo de fato mudou
  return s[k];
}
function setGoldState(data) { var s=loadState(); s[server+'_gold']=data; saveState(s); }

// Mantém o histórico dos últimos 7 dias sempre sincronizado com o total do dia atual.
// Enquanto o dia não vira, essa entrada "hoje" acompanha ao vivo qualquer depósito, desfazer ou zerar.
function syncDiario(gs){
  if(!gs.diario) gs.diario=[];
  var idx=gs.diario.findIndex(function(d){return d.data===gs.data;});
  if(idx>=0) gs.diario[idx].total=gs.total;
  else gs.diario.unshift({data:gs.data,total:gs.total});
  gs.diario=gs.diario.slice(0,7);
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function el(tag,cls,txt){var e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

function setServer(sv) {
  server = sv;
  document.querySelectorAll('.srv-btn').forEach(function(b){ b.className='srv-btn'; });
  document.getElementById('srv-'+sv).className='srv-btn active-'+sv;
  render();
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  var main = document.getElementById('main');
  main.innerHTML = '';
  renderGold(main);
}

function renderGold(main) {
  var gs = getGoldState();
  var hoje = new Date().toLocaleDateString('pt-BR');

  if (gs.data !== hoje) {
    var warn=document.createElement('div');
    warn.style.cssText='background:#2a1a0a;border:1px solid #ff9944;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#ffb066;';
    warn.innerHTML='⚠️ O contador está registrando em <b>'+gs.data+'</b>, mas hoje é <b>'+hoje+'</b>.';
    var fixBtn=document.createElement('button');
    fixBtn.textContent='Corrigir pra data de hoje';
    fixBtn.style.cssText='width:100%;margin-top:8px;padding:8px;background:#1a1a2a;border:1px solid #ff9944;border-radius:8px;color:#ffb066;font-size:12px;font-weight:700;cursor:pointer;';
    fixBtn.onclick=function(){ var gs2=getGoldState(); gs2.data=hoje; setGoldState(gs2); render(); };
    warn.appendChild(fixBtn);
    main.appendChild(warn);
  }

  var card = document.createElement('div'); card.className='card';

  var title = el('div','card-title','💰 CONTADOR DE GOLD — '+hoje);
  card.appendChild(title);

  var totalBox = document.createElement('div');
  totalBox.style.cssText = 'background:#1a2a0a;border:2px solid #c8a96e;border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;';
  var totalLabel = el('div','',  'Total do dia');
  totalLabel.style.cssText = 'font-size:11px;color:#888;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;';
  var totalVal = el('div','', formatGold(gs.total));
  totalVal.style.cssText = 'font-size:36px;font-weight:800;color:#FFD700;letter-spacing:1px;';
  totalBox.appendChild(totalLabel); totalBox.appendChild(totalVal);
  card.appendChild(totalBox);

  var acumBox = document.createElement('div');
  acumBox.style.cssText = 'background:#141414;border:1px solid #444;border-radius:14px;padding:14px;text-align:center;margin-bottom:14px;';
  var acumLabel = el('div','', '📊 Valor geral acumulado');
  acumLabel.style.cssText = 'font-size:11px;color:#888;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;';
  var acumDiasTotal = (gs.diasContados||0) + 1;
  var acumValorTotal = (gs.acumulado||0) + gs.total;
  var acumVal = el('div','', formatGold(acumValorTotal) + ' — ' + acumDiasTotal + (acumDiasTotal===1 ? ' dia' : ' dias'));
  acumVal.style.cssText = 'font-size:20px;font-weight:700;color:#c8a96e;letter-spacing:0.5px;';
  acumBox.appendChild(acumLabel); acumBox.appendChild(acumVal);
  card.appendChild(acumBox);

  var chars = getChars();
  var charLabel = el('div','','👤 Personagem farmando:');
  charLabel.style.cssText = 'font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;';
  card.appendChild(charLabel);

  var sel = document.createElement('select');
  sel.id = 'goldChar';
  sel.style.cssText = 'width:100%;background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px 12px;font-size:14px;color:#e8e8e8;outline:none;font-family:inherit;margin-bottom:10px;';
  var defOpt = document.createElement('option'); defOpt.value=''; defOpt.textContent='Selecione...';
  sel.appendChild(defOpt);
  chars.forEach(function(c){
    var opt = document.createElement('option'); opt.value=c.nome; opt.textContent=c.nome;
    if(c.nome===goldCharSelecionado) opt.selected=true;
    sel.appendChild(opt);
  });
  if(chars.length===0){
    var opt2=document.createElement('option'); opt2.value='Manual'; opt2.textContent='Digitar manualmente'; sel.appendChild(opt2);
  }
  sel.onchange=function(){ goldCharSelecionado = this.value; };
  card.appendChild(sel);

  var addLabel = el('div','','💎 Valor depositado:');
  addLabel.style.cssText = 'font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;';
  card.appendChild(addLabel);

  var inputRow = document.createElement('div');
  inputRow.style.cssText = 'display:flex;gap:8px;margin-bottom:10px;';
  var goldInput = document.createElement('input');
  goldInput.id='goldInput'; goldInput.type='text'; goldInput.inputMode='numeric'; goldInput.placeholder='Ex: 90.000.000';
  goldInput.style.cssText='flex:1;background:#1a1a2e;border:1px solid #c8a96e;border-radius:10px;padding:12px;font-size:16px;color:#FFD700;outline:none;font-family:inherit;text-align:center;';
  goldInput.addEventListener('keydown',function(e){if(e.key==='Enter')addGold();});
  goldInput.addEventListener('input',function(){
    var cursorNoFinal = (this.selectionStart === this.value.length);
    var apenasDigitos = this.value.replace(/\D/g,'');
    if(!apenasDigitos){ this.value=''; return; }
    var comPontos = parseInt(apenasDigitos,10).toLocaleString('pt-BR');
    this.value = comPontos;
    if(cursorNoFinal){ this.setSelectionRange(this.value.length,this.value.length); }
  });
  var addBtn = document.createElement('button');
  addBtn.textContent='＋'; addBtn.style.cssText='background:#c8a96e;color:#111;border:none;border-radius:10px;padding:12px 20px;font-size:22px;font-weight:700;cursor:pointer;';
  addBtn.onclick=addGold;
  inputRow.appendChild(goldInput); inputRow.appendChild(addBtn);
  card.appendChild(inputRow);

  var resetRow = document.createElement('div');
  resetRow.style.cssText='display:flex;gap:8px;margin-bottom:14px;';
  var resetBtn=document.createElement('button');
  resetBtn.textContent='↺ Zerar dia'; resetBtn.style.cssText='flex:1;padding:10px;background:#1a0f0f;border:1px solid #aa3333;border-radius:10px;color:#ff6666;font-size:13px;font-weight:600;cursor:pointer;';
  resetBtn.onclick=function(){ if(confirm('Zerar o contador de gold de hoje?')){ var gs2=getGoldState(); gs2.total=0; gs2.historico=[]; syncDiario(gs2); setGoldState(gs2); render(); } };
  var undoBtn=document.createElement('button');
  undoBtn.textContent='↩ Desfazer'; undoBtn.style.cssText='flex:1;padding:10px;background:#1a1a2a;border:1px solid #555;border-radius:10px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;';
  undoBtn.onclick=function(){
    var gs2=getGoldState();
    if(gs2.historico.length===0){alert('Nada pra desfazer!');return;}
    var last=gs2.historico.pop(); gs2.total-=last.valor;
    if(gs2.total<0)gs2.total=0;
    syncDiario(gs2);
    setGoldState(gs2); render();
  };
  resetRow.appendChild(undoBtn); resetRow.appendChild(resetBtn);
  card.appendChild(resetRow);

  if(gs.historico.length>0){
    var hTitle=el('div','card-title','📋 Depósitos de hoje');
    card.appendChild(hTitle);
    var hList=document.createElement('div');
    var rev=[].concat(gs.historico).reverse().slice(0,10);
    rev.forEach(function(h,i){
      var origIdx=gs.historico.length-1-i;
      var hRow=document.createElement('div');
      hRow.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#0f0f1e;border-radius:8px;margin-bottom:5px;border:1px solid #2a2a3a;gap:8px;';
      var left=document.createElement('div');
      left.style.cssText='flex:1;';
      left.innerHTML='<div style="font-size:12px;font-weight:600;color:#c8a96e;">'+h.char+'</div><div style="font-size:10px;color:#555;">'+h.hora+'</div>';
      var right=el('div','','+ '+formatGold(h.valor));
      right.style.cssText='font-size:14px;font-weight:700;color:#FFD700;';
      var delBtn=document.createElement('button');
      delBtn.textContent='✕';
      delBtn.title='Apagar esse depósito';
      delBtn.style.cssText='background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0;';
      delBtn.onclick=(function(idx){ return function(){
        var gs2=getGoldState();
        var item=gs2.historico[idx];
        if(!item) return;
        if(!confirm('Apagar o depósito de '+item.char+' ('+formatGold(item.valor)+')?')) return;
        gs2.historico.splice(idx,1);
        gs2.total-=item.valor;
        if(gs2.total<0) gs2.total=0;
        syncDiario(gs2);
        setGoldState(gs2); render();
      };})(origIdx);
      hRow.appendChild(left); hRow.appendChild(right); hRow.appendChild(delBtn); hList.appendChild(hRow);
    });
    card.appendChild(hList);
  } else {
    var empty=el('div','','Nenhum depósito ainda hoje. Bora farmar! ⚔️');
    empty.style.cssText='text-align:center;color:#555;font-size:13px;padding:16px;';
    card.appendChild(empty);
  }

  main.appendChild(card);

  // Histórico dos últimos 7 dias
  var diario=gs.diario||[];
  if(diario.length>0){
    var dCard=document.createElement('div'); dCard.className='card';
    dCard.appendChild(el('div','card-title','📅 HISTÓRICO — ÚLTIMOS 7 DIAS'));
    diario.forEach(function(d,i){
      var isHoje=(d.data===hoje);
      var dRow=document.createElement('div');
      dRow.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:'+(isHoje?'#1a1608':'#0f0f1e')+';border-radius:8px;margin-bottom:5px;border:1px solid '+(isHoje?'#c8a96e':'#2a2a3a')+';gap:8px;';
      var left=el('div','',(isHoje?'🟢 Hoje — ':'')+d.data);
      left.style.cssText='font-size:12px;font-weight:600;color:'+(isHoje?'#c8a96e':'#aaa')+';flex:1;';
      var right=el('div','',formatGold(d.total));
      right.style.cssText='font-size:15px;font-weight:800;color:#FFD700;';
      var delBtn=document.createElement('button');
      delBtn.textContent='✕';
      delBtn.title='Apagar essa linha do histórico';
      delBtn.style.cssText='background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0;';
      delBtn.onclick=(function(dataAlvo){ return function(){
        if(!confirm('Apagar o histórico de '+dataAlvo+'?')) return;
        var gs2=getGoldState();
        gs2.diario=(gs2.diario||[]).filter(function(x){return x.data!==dataAlvo;});
        setGoldState(gs2); render();
      };})(d.data);
      dRow.appendChild(left); dRow.appendChild(right); dRow.appendChild(delBtn); dCard.appendChild(dRow);
    });
    main.appendChild(dCard);
  }
}

function parseGoldInput(str){
  if(!str) return 0;
  var s=String(str).trim().replace(/[^\d.,]/g,'');
  if(!s) return 0;
  var decimals='';
  var m=s.match(/,(\d{1,2})$/);
  if(m){ decimals='.'+m[1]; s=s.slice(0,m.index); }
  s=s.replace(/[.,]/g,'');
  var n=parseFloat(s+decimals);
  return isNaN(n)?0:n;
}

function addGold(){
  var val=parseGoldInput(document.getElementById('goldInput').value);
  var charName=document.getElementById('goldChar').value||'Personagem';
  if(!val||val<=0){alert('Digite um valor válido!');return;}
  var gs=getGoldState();
  var hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  gs.total+=val;
  gs.historico.push({char:charName,valor:val,hora:hora});
  syncDiario(gs);
  setGoldState(gs);
  vibe([30]);
  render();
}

function formatGold(n){
  return Math.round(n).toLocaleString('pt-BR');
}

// INIT
document.getElementById('srv-eu').className='srv-btn active-eu';
render();
</script>

// ALERTA DE DATA CRÍTICA NA BOLINHA DE SYNC — componente
// reutilizável (mesmo padrão em todo app do ecossistema).
// Busca o documento "william/datas_data" direto no Firebase
// (esse app não tem essa informação por conta própria). Se
// alguma data importante estiver a 0 ou 1 dia, a bolinha de
// sincronização vira uma barra vermelha grande, pulsando,
// com o texto escrito dentro — sem precisar passar o mouse.
// Aniversário (tem "ano" preenchido) usa 🎂; data comum usa 📌.
// ══════════════════════════════════════════════════════
function proximaOcorrenciaDiasGlobal(dia, mes){
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes - 1, dia);
  data.setHours(0, 0, 0, 0);
  if (data < hoje) {
    data = new Date(anoAtual + 1, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
  }
  return Math.round((data - hoje) / 86400000);
}

// ---------- Mega-Sena / Loterias da Caixa — mesma lógica de contagem do Agenda ----------
function loteriaEhDiaSorteioGlobal(date){ var dow=date.getDay(); return dow===0||dow===2||dow===4; }
function loteriaHoraSorteioGlobal(date){ return date.getDay()===0 ? 11 : 21; }
function loteriaContagemGlobal(inicio){
  if(!inicio) return 0;
  var d=new Date(inicio+'T00:00:00');
  var agora=new Date();
  var count=0, safety=0;
  while(d<=agora && count<12 && safety<120){
    if(loteriaEhDiaSorteioGlobal(d)){
      var dtSorteio=new Date(d); dtSorteio.setHours(loteriaHoraSorteioGlobal(d),0,0,0);
      if(dtSorteio<=agora) count++;
    }
    d.setDate(d.getDate()+1); safety++;
  }
  return count;
}

// ---------- Gás — lê o campo único (sem separação por servidor) do doc remoto do Agenda ----------
function diasEntreGlobal(dataIni, dataFim){ return Math.floor((new Date(dataFim+'T00:00:00') - new Date(dataIni+'T00:00:00')) / 86400000); }
function gasDiasUsoRemoto(dadosAgenda){
  var g = dadosAgenda.gas || [];
  if (!g.length) return null;
  var x = g[0];
  var data = x.data !== undefined ? x.data : (x.inicio || x.compra);
  var duracao = x.data !== undefined ? x.duracao : (x.acabou ? diasEntreGlobal(data, x.acabou) : null);
  if (duracao !== null && duracao !== undefined) return null;
  return diasEntreGlobal(data, new Date().toISOString().split('T')[0]);
}

// ---------- Moto — km rodados desde a última troca, registrados manualmente no odômetro (Agenda) ----------
var KM_INTERVALO_MOTO = 2800;
function motoKmStatusRemoto(dadosAgenda){
  var atual = dadosAgenda.motoKmAtual;
  var historico = dadosAgenda.moto_oleo || [];
  if (!atual || !historico.length) return null;
  return { diff: atual.km - historico[0].km };
}

// ---------- Ciclo de textos na barra crítica (alterna quando há mais de um alerta) ----------
var _criticoTextos = [];
var _criticoIdx = 0;
setInterval(function(){
  var dot = document.getElementById('syncDot');
  if (!dot || !dot.classList.contains('dot-critico') || _criticoTextos.length < 2) return;
  _criticoIdx = (_criticoIdx + 1) % _criticoTextos.length;
  dot.textContent = _criticoTextos[_criticoIdx];
}, 3000);

// ---------- Adiar alerta crítico (toque na barra vermelha soneca por 30min, só neste aparelho) ----------
var ALERTA_SNOOZE_KEY = 'william_alerta_critico_snooze_ate';
function getAdiamentoInfo(){
  try{
    var raw = localStorage.getItem(ALERTA_SNOOZE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || Date.now() >= obj.ate) return null;
    return obj;
  }catch(e){ return null; }
}
// Só considera "adiado" se o CONJUNTO de alertas críticos de agora for exatamente
// igual ao que estava ativo quando você tocou pra adiar. Qualquer alerta novo ou
// diferente (mesmo dentro dos 30min) ignora o adiamento e aparece na hora.
function alertaEstaAdiadoPara(textosCriticos){
  var info = getAdiamentoInfo();
  if(!info) return false;
  var atual = textosCriticos.slice().sort();
  var adiado = info.textos.slice().sort();
  if(atual.length !== adiado.length) return false;
  for(var i=0;i<atual.length;i++){ if(atual[i]!==adiado[i]) return false; }
  return true;
}
function adiarAlertaCritico(textosCriticos){
  localStorage.setItem(ALERTA_SNOOZE_KEY, JSON.stringify({ ate: Date.now()+30*60*1000, textos: textosCriticos||[] }));
}
function limparAdiamento(){
  localStorage.removeItem(ALERTA_SNOOZE_KEY);
}

async function verificarDataCriticaGlobal(){
  var dot = document.getElementById('syncDot');
  if (!dot) return;
  try {
    var comDias = [];
    try {
      var snap = await getDoc(doc(db, "william", "datas_data"));
      if (snap.exists()) {
        var lista = snap.data().datas_importantes || [];
        comDias = lista.map(function(d){ return { nome: d.nome, ano: d.ano, dias: proximaOcorrenciaDiasGlobal(d.dia, d.mes) }; });
      }
    } catch(e) {}

    var loteriaCount = 0;
    var gasDias = null;
    var motoStatus = null;
    try {
      var snapAg = await getDoc(doc(db, "william", "agenda_data"));
      if (snapAg.exists()) {
        var dadosAg = snapAg.data();
        loteriaCount = loteriaContagemGlobal(dadosAg.loteria_inicio || null);
        gasDias = gasDiasUsoRemoto(dadosAg);
        motoStatus = motoKmStatusRemoto(dadosAg);
      }
    } catch(e) {}

    dot.classList.remove('dot-critico', 'dot-adiado', 'dot-perto-laranja', 'dot-perto-amarelo');
    dot.textContent = '';

    var criticos = comDias.filter(function(item){ return item.dias <= 1; }).sort(function(a,b){ return a.dias - b.dias; });
    var laranjas = comDias.filter(function(item){ return item.dias > 1 && item.dias <= 3; }).sort(function(a,b){ return a.dias - b.dias; });
    var amarelos = comDias.filter(function(item){ return item.dias > 3 && item.dias <= 10; }).sort(function(a,b){ return a.dias - b.dias; });

    var textosCriticos = criticos.map(function(item){
      var prefixo = item.ano ? '🎂 ' : '📌 ';
      return prefixo + item.nome + (item.dias === 0 ? ' é HOJE!' : ' é amanhã!');
    });
    var textosAmarelos = amarelos.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });

    // Mega-Sena: 12/12 é crítico (barra vermelha), 11/12 é aviso fraco (bolinha amarela)
    if (loteriaCount >= 12) {
      textosCriticos.push('🎰 Renovar Megasena!');
    } else if (loteriaCount === 11) {
      textosAmarelos.push('🎰 Megasena: falta 1 concurso, renove em breve');
    }

    // Gás: 90 dias de uso é crítico, 80 dias é aviso fraco
    if (gasDias !== null) {
      if (gasDias >= 90) {
        textosCriticos.push('🔥 Gás: ' + gasDias + ' dias de uso, hora de trocar!');
      } else if (gasDias >= 80) {
        textosAmarelos.push('🔥 Gás: ' + gasDias + ' dias de uso, perto da troca');
      }
    }

    // Moto: 2.800 km rodados é crítico, 2.600 km é aviso fraco
    if (motoStatus) {
      if (motoStatus.diff >= KM_INTERVALO_MOTO) {
        textosCriticos.push('🏍️ Moto: ' + motoStatus.diff.toLocaleString('pt-BR') + ' km rodados, hora de trocar o óleo!');
      } else if (motoStatus.diff >= KM_INTERVALO_MOTO - 200) {
        textosAmarelos.push('🏍️ Moto: ' + motoStatus.diff.toLocaleString('pt-BR') + ' km rodados, troca em breve');
      }
    }


    if (textosCriticos.length && !alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-critico');
      dot.title = textosCriticos.join(' • ') + ' (toque para adiar 30min)';
      _criticoTextos = textosCriticos;
      _criticoIdx = 0;
      dot.textContent = textosCriticos[0];
    } else if (textosCriticos.length && alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-adiado');
      dot.title = 'Adiado — ainda ativo: ' + textosCriticos.join(' • ') + ' (toque para reativar agora)';
      _criticoTextos = [];
    } else if (laranjas.length){
      var textosL = laranjas.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });
      dot.classList.add('dot-perto-laranja');
      dot.title = textosL.join(' • ');
      _criticoTextos = [];
    } else if (textosAmarelos.length){
      dot.classList.add('dot-perto-amarelo');
      dot.title = textosAmarelos.join(' • ');
      _criticoTextos = [];
    } else {
      dot.title = 'Sincronizado';
      _criticoTextos = [];
    }
  } catch (e) { /* silencioso — não atrapalha o app se essa checagem falhar */ }
}

function iniciarChecagemDataCritica(){
  var dot = document.getElementById('syncDot');
  if (dot) {
    dot.addEventListener('click', function(){
      if (dot.classList.contains('dot-critico')){
        adiarAlertaCritico(_criticoTextos);
        verificarDataCriticaGlobal();
      } else if (dot.classList.contains('dot-adiado')){
        limparAdiamento();
        verificarDataCriticaGlobal();
      }
    });
  }
  verificarDataCriticaGlobal();
  setInterval(verificarDataCriticaGlobal, 30000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) verificarDataCriticaGlobal();
  });
}

const docNovo   = doc(db, "william", "gold_data");    // documento próprio do Gold (novo)
const docAntigo = doc(db, "william", "state");         // documento compartilhado antigo (só leitura, pra migração)

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function abrirRetratoDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('william_retratos', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('retratos'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
async function salvarRetratoLocal(fatia){
  try{
    var db2 = await abrirRetratoDB();
    var hoje = new Date().toISOString().slice(0,10);
    var chave = 'gold_' + hoje;
    var tx = db2.transaction('retratos','readwrite');
    tx.objectStore('retratos').put({ data: hoje, savedAt: new Date().toISOString(), conteudo: fatia }, chave);
    var getAllReq = tx.objectStore('retratos').getAllKeys();
    getAllReq.onsuccess = function(){
      var limite = new Date(); limite.setDate(limite.getDate()-30);
      getAllReq.result.forEach(function(k){
        if(typeof k==='string' && k.indexOf('gold_')===0){
          var dataK = new Date(k.replace('gold_',''));
          if(dataK < limite) tx.objectStore('retratos').delete(k);
        }
      });
    };
  }catch(e){ console.warn('Retrato local falhou (não crítico):', e); }
}

function fatiaGoldAtual(){
  var s = loadState();
  var fatia = {};
  Object.keys(s).forEach(function(k){ if(pertenceAoGold(k)) fatia[k]=s[k]; });
  return fatia;
}

function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var fatia = fatiaGoldAtual();
      fatia.lastModified = new Date().toISOString();
      await setDoc(docNovo, fatia);
      await salvarRetratoLocal(fatia);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Gold:', e);
      setDot('#c94f4f');
    }
  }, 800);
}

function iniciarEscuta(){
  onSnapshot(docNovo, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    var mudou = false;
    Object.keys(remoto).forEach(function(k){
      if(pertenceAoGold(k) && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      aplicandoRemoto = true;
      saveState(local);
      salvarRetratoLocal(fatiaGoldAtual());
      if(typeof render === 'function') render();
      aplicandoRemoto = false;
      setDot('#3fae5c');
    }
  }, function(err){
    console.error('Erro de sincronização (Gold):', err);
    setDot('#c94f4f');
  });
}

// ---------- Personagens (lê ao vivo do app Personagens — mesmos nomes disponíveis pra farmar) ----------
function iniciarEscutaPersonagens(){
  onSnapshot(doc(db, "william", "personagens_data"), function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    var mudou = false;
    ['eu','america','murica'].forEach(function(sv){
      var k = sv+'_chars';
      if(remoto[k] !== undefined && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      saveStateOriginal(local);
      if(typeof render === 'function') render();
    }
  }, function(err){ console.error('Erro ao sincronizar personagens (Gold):', err); });
}

async function migrarSeNecessario(){
  var snapNovo = await getDoc(docNovo);
  if(snapNovo.exists()) return;
  try{
    var snapAntigo = await getDoc(docAntigo);
    var fatia = {};
    if(snapAntigo.exists()){
      var dadosAntigos = snapAntigo.data();
      Object.keys(dadosAntigos).forEach(function(k){ if(pertenceAoGold(k)) fatia[k]=dadosAntigos[k]; });
    }
    fatia.lastModified = new Date().toISOString();
    await setDoc(docNovo, fatia);
  }catch(e){ console.error('Erro na migração inicial do Gold:', e); }
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('loginPass').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });

onAuthStateChanged(auth, async function(user){
  if(user && user.email === ALLOWED_EMAIL){
    esconderLogin();
    if(!jaMigrou){
      jaMigrou = true;
      await migrarSeNecessario();
      iniciarEscuta();
      iniciarEscutaPersonagens();
      iniciarChecagemDataCritica();
    }
  } else {
    mostrarLogin();
  }
});

var saveStateOriginal = window.saveState;
window.saveState = function(s){
  saveStateOriginal(s);
  agendarPush();
};
</script>



<!-- 💾 BACKUP LOCAL (Exportar / Importar) -->
<script>
(function(){
  function exportar(){
    var s = loadState();
    var payload = JSON.stringify(s, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Gold_backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importar(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var novo;
      try{ novo = JSON.parse(e.target.result); }
      catch(err){ alert('Arquivo inválido.'); return; }

      if(!novo || typeof novo !== 'object'){
        alert('Arquivo não parece ser um backup válido.');
        return;
      }

      var atual = loadState();
      var atualTs = atual.lastModified ? new Date(atual.lastModified).getTime() : 0;
      var novoTs = novo.lastModified ? new Date(novo.lastModified).getTime() : 0;

      if(atualTs && novoTs && novoTs < atualTs){
        if(!confirm('Este backup é MAIS ANTIGO que os dados atuais deste aparelho.\n\nImportar mesmo assim vai sobrescrever o que está aqui. Tem certeza?')) return;
      } else {
        if(!confirm('Importar este backup e substituir os dados atuais?')) return;
      }

      // Mescla só as chaves do Gold (<servidor>_gold) — preserva Ilhas, Personagens, Agenda,
      // Nomes, Notas e Datas que moram na mesma gaveta.
      var mesclado = Object.assign({}, atual);
      Object.keys(novo).forEach(function(k){
        if(pertenceAoGold(k)) mesclado[k] = novo[k];
      });
      saveState(mesclado);
      render();
      alert('Backup importado com sucesso!');
    };
    reader.readAsText(file);
  }

  document.getElementById('btnExport').addEventListener('click', exportar);
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileImport').click();
  });
  document.getElementById('fileImport').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      importar(e.target.files[0]);
      e.target.value = '';
    }
  });
})();
</script>
