<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📝 William Nomes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }

.topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }

.btn-reset { width: 100%; padding: 10px; background: none; border: 1px solid #444; border-radius: 10px; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; }

.btn-export{ flex:1; padding:11px 0; background:#1a2a1a; border:1px solid #2d6a4f; border-radius:10px; color:#74c69d; font-size:13px; font-weight:700; cursor:pointer; }
.btn-import{ flex:1; padding:11px 0; background:#1a1a2e; border:1px solid #444; border-radius:10px; color:#aaa; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚔ WILLIAM — NOMES</h1>
</div>

<div class="container" id="main"></div>

<script>
// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — os nomes ficam sincronizados
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }
function pertenceAoNomes(k){ return k === 'nomes_rascunho' || k === 'nomes_savedAt' || k === 'nomes_dic_voz'; }

function getNomes() {
  var s = loadState();
  return s.nomes_rascunho || [];
}
function setNomes(data) {
  var s = loadState(); s.nomes_rascunho = data; s.nomes_savedAt = new Date().toISOString(); saveState(s);
}
function getNomesSavedAt() {
  var s = loadState();
  return s.nomes_savedAt || null;
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function el(tag,cls,txt){var e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- MICROFONE REUTILIZÁVEL ---------- */
/* ---------- DICIONÁRIO DE CORREÇÕES APRENDIDAS ---------- */
function normalizaTexto(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function diceCoefficient(a, b){
  a = normalizaTexto(a); b = normalizaTexto(b);
  if(a === b) return 1;
  function bigramas(s){ var r=[]; for(var i=0;i<s.length-1;i++) r.push(s.substring(i,i+2)); return r; }
  var bgA = bigramas(a), bgB = bigramas(b);
  if(bgA.length===0 || bgB.length===0) return 0;
  var bgBrestante = bgB.slice(), inter = 0;
  for(var i=0;i<bgA.length;i++){
    var idx = bgBrestante.indexOf(bgA[i]);
    if(idx !== -1){ inter++; bgBrestante.splice(idx,1); }
  }
  return (2*inter) / (bgA.length + bgB.length);
}
function getDicionarioVoz(){ var s=loadState(); return s.nomes_dic_voz || {}; }
function setDicionarioVoz(d){ var s=loadState(); s.nomes_dic_voz=d; saveState(s); }
function corrigirComDicionario(texto){
  var dic = getDicionarioVoz();
  var chaves = Object.keys(dic);
  if(!chaves.length) return texto;
  var melhor=null, melhorScore=0;
  chaves.forEach(function(chave){
    var score = diceCoefficient(texto, chave);
    if(score > melhorScore){ melhorScore=score; melhor=chave; }
  });
  return (melhor && melhorScore >= 0.55) ? dic[melhor] : texto;
}
function aprenderCorrecao(ouvido, corrigido){
  ouvido = normalizaTexto(ouvido); corrigido = String(corrigido||'').trim();
  if(!ouvido || !corrigido || ouvido === normalizaTexto(corrigido)) return;
  var dic = getDicionarioVoz(); dic[ouvido]=corrigido; setDicionarioVoz(dic);
}

function anexarMicrofone(inputEl, opts){
  opts = opts || {};
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '🎤';
  btn.title = 'Falar';
  btn.style.cssText = 'flex:0 0 44px;width:44px;height:44px;border-radius:10px;border:1px solid #333;background:#1a1a2e;color:#e8e8e8;font-size:18px;cursor:pointer;';
  inputEl.parentNode.appendChild(btn);
  if(!Rec){ btn.style.display='none'; return btn; }
  var rec = new Rec();
  rec.lang = 'pt-BR'; rec.continuous = false; rec.interimResults = false;
  btn.addEventListener('click', function(){
    btn.style.background = '#c8a96e'; btn.style.color = '#111'; btn.textContent = '●';
    try{ rec.start(); }catch(e){}
  });
  rec.onresult = function(e){
    var textoOriginal = e.results[0][0].transcript;
    var texto = corrigirComDicionario(textoOriginal);
    inputEl.value = texto;
    inputEl.dataset.vozOriginal = textoOriginal;
    inputEl.dispatchEvent(new Event('input', {bubbles:true}));
    inputEl.dispatchEvent(new Event('change', {bubbles:true}));
    if(opts.onDone) opts.onDone();
  };
  if(opts.aprenderCorrecoes){
    inputEl.addEventListener('blur', function(){
      var ouvido = inputEl.dataset.vozOriginal;
      if(ouvido && inputEl.value && normalizaTexto(inputEl.value) !== normalizaTexto(ouvido)){
        aprenderCorrecao(ouvido, inputEl.value);
      }
      delete inputEl.dataset.vozOriginal;
    });
  }
  rec.onend = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  rec.onerror = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  return btn;
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  var main = document.getElementById('main');
  main.innerHTML = '';
  renderNomes(main);
  renderBackup(main);
}

function renderNomes(main) {
  var nomes = getNomes();

  var card = document.createElement('div'); card.className='card';
  card.appendChild(el('div','card-title','📝 BANCO DE NOMES — '+nomes.length+' anotados'));

  var hint = el('p','','Viu um nome legal? Anota aqui antes de esquecer! 💡');
  hint.style.cssText='font-size:12px;color:#555;margin-bottom:12px;';
  card.appendChild(hint);

  var addRow = document.createElement('div');
  addRow.style.cssText='display:flex;gap:8px;margin-bottom:16px;';
  var inp = document.createElement('input');
  inp.id='nomeInput'; inp.type='text'; inp.placeholder='Ex: Lautaro, Xevious, Salsaparrilha...';
  inp.style.cssText='flex:1;background:#1a1a2e;border:1px solid #c8a96e;border-radius:10px;padding:11px 12px;font-size:14px;color:#e8e8e8;outline:none;font-family:inherit;';
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') addNome(); });
  var addBtn = document.createElement('button');
  addBtn.textContent='＋'; addBtn.style.cssText='background:#c8a96e;color:#111;border:none;border-radius:10px;padding:11px 18px;font-size:20px;font-weight:700;cursor:pointer;';
  addBtn.onclick = addNome;
  addRow.appendChild(inp);
  anexarMicrofone(inp, {aprenderCorrecoes: true, onDone: function(){ inp.focus(); }});
  addRow.appendChild(addBtn);
  card.appendChild(addRow);

  if (nomes.length === 0) {
    var empty = el('div','','Nenhum nome ainda. Quando ver um nome incrível, anota aqui! ⚔️');
    empty.style.cssText='text-align:center;color:#555;font-size:13px;padding:24px 0;';
    card.appendChild(empty);
  } else {
    nomes.forEach(function(n, i) {
      var row = document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f0f1e;border-radius:10px;margin-bottom:7px;border:1px solid '+(n.usado?'#2d6a4f':'#2a2a3a')+';';

      var nomeEl = el('div','', (n.usado?'✅ ':'')+n.nome);
      nomeEl.style.cssText='flex:1;font-size:15px;font-weight:700;color:'+(n.usado?'#74c69d':'#e8e8e8')+';'+(n.usado?'text-decoration:line-through;opacity:0.6;':'');

      var dataEl = el('div','',n.data);
      dataEl.style.cssText='font-size:10px;color:#555;white-space:nowrap;';

      var usarBtn = document.createElement('button');
      usarBtn.textContent = n.usado ? '↩' : '✅';
      usarBtn.title = n.usado ? 'Desmarcar' : 'Marcar como usado';
      usarBtn.style.cssText='background:'+(n.usado?'#2a2a3a':'#1a2a1a')+';border:1px solid '+(n.usado?'#444':'#2d6a4f')+';color:'+(n.usado?'#aaa':'#74c69d')+';border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;';
      usarBtn.onclick=(function(idx){ return function(){ var ns=getNomes(); ns[idx].usado=!ns[idx].usado; setNomes(ns); render(); }; })(i);

      var delBtn = document.createElement('button');
      delBtn.textContent='🗑️';
      delBtn.style.cssText='background:none;border:none;font-size:16px;cursor:pointer;padding:4px;opacity:0.5;';
      delBtn.onclick=(function(idx){ return function(){ if(!confirm('Remover "'+getNomes()[idx].nome+'"?')) return; var ns=getNomes(); ns.splice(idx,1); setNomes(ns); render(); }; })(i);

      row.appendChild(nomeEl); row.appendChild(dataEl); row.appendChild(usarBtn); row.appendChild(delBtn);
      card.appendChild(row);
    });

    var usados = nomes.filter(function(n){ return n.usado; }).length;
    if (usados > 0) {
      var limparBtn = document.createElement('button');
      limparBtn.className='btn-reset';
      limparBtn.textContent='🗑️ Limpar '+usados+' nome'+(usados>1?'s':'')+' já usado'+(usados>1?'s':'');
      limparBtn.style.cssText='margin-top:8px;color:#aa3333;border-color:#aa3333;';
      limparBtn.onclick=function(){
        if(confirm('Remover todos os nomes marcados como usados?')){
          setNomes(getNomes().filter(function(n){return !n.usado;}));
          render();
        }
      };
      card.appendChild(limparBtn);
    }
  }

  main.appendChild(card);
}

function addNome() {
  var inp = document.getElementById('nomeInput');
  if (!inp || !inp.value.trim()) return;
  var ns = getNomes();
  var hoje = new Date().toLocaleDateString('pt-BR');
  ns.unshift({ nome: inp.value.trim(), data: hoje, usado: false });
  setNomes(ns);
  vibe([30]);
  render();
}

// ══════════════════════════════════════════════════════
// BACKUP — Exportar / Importar com proteção de timestamp
// Obs: esse app usa a MESMA chave de armazenamento de outros
// apps do William (Datas, Personagens, Ilhas, Agenda, Gold).
// Por isso o backup mexe só na fatia "nomes_rascunho", sem
// tocar no resto do estado compartilhado.
// ══════════════════════════════════════════════════════
function formatDataHora(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function renderBackup(main) {
  var card = document.createElement('div'); card.className = 'card';
  card.appendChild(el('div', 'card-title', '💾 BACKUP'));

  var savedAt = getNomesSavedAt();
  var info = el('p', '', savedAt ? ('Última alteração: ' + formatDataHora(savedAt)) : 'Ainda sem registro de data');
  info.style.cssText = 'font-size:12px;color:#555;margin-bottom:12px;';
  card.appendChild(info);

  var row = document.createElement('div'); row.className = 'backup-row';

  var expBtn = document.createElement('button');
  expBtn.className = 'btn-export'; expBtn.textContent = '📤 Exportar';
  expBtn.onclick = exportBackup;
  row.appendChild(expBtn);

  var impBtn = document.createElement('button');
  impBtn.className = 'btn-import'; impBtn.textContent = '📥 Importar';
  impBtn.onclick = function(){ document.getElementById('importFileInput').click(); };
  row.appendChild(impBtn);

  card.appendChild(row);

  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.id = 'importFileInput'; fileInput.accept = 'application/json';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', handleImportFile);
  card.appendChild(fileInput);

  main.appendChild(card);
}

function exportBackup() {
  var backup = { nomes_rascunho: getNomes(), savedAt: getNomesSavedAt() || new Date().toISOString() };
  var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'william-nomes-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var incoming;
    try { incoming = JSON.parse(ev.target.result); }
    catch(err){ alert('Arquivo inválido. Escolha um backup exportado por este app.'); e.target.value=''; return; }

    if (!incoming || typeof incoming !== 'object' || !('nomes_rascunho' in incoming)) {
      alert('Esse arquivo não parece ser um backup do Nomes.');
      e.target.value = '';
      return;
    }

    var localSavedAt = getNomesSavedAt();
    var localTime = localSavedAt ? new Date(localSavedAt).getTime() : 0;
    var incomingTime = incoming.savedAt ? new Date(incoming.savedAt).getTime() : 0;

    if (localTime && incomingTime && incomingTime < localTime) {
      var msg = 'Esse backup é de ' + formatDataHora(incoming.savedAt) + ', mas os nomes atuais no aparelho são mais recentes (' + formatDataHora(localSavedAt) + ').\n\nImportar mesmo assim vai substituir os nomes atuais pelos mais antigos. Continuar?';
      if (!confirm(msg)) { e.target.value = ''; return; }
    }

    // Mescla só a fatia de Nomes no estado compartilhado — preserva dados de outros apps
    var s = loadState();
    s.nomes_rascunho = incoming.nomes_rascunho || [];
    s.nomes_savedAt = incoming.savedAt || new Date().toISOString();
    saveState(s);

    e.target.value = '';
    render();
    alert('✅ Backup importado com sucesso.');
  };
  reader.readAsText(file);
}

// INIT
render();
</script>

<div id="loginOverlay" style="display:none;position:fixed;inset:0;background:#0a0a14;z-index:999;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:320px;text-align:center;">
    <h2 style="font-size:16px;color:#c8a96e;letter-spacing:1px;margin-bottom:6px;">⚔ WILLIAM</h2>
    <p style="font-size:12px;color:#666;margin-bottom:18px;">Entrar neste aparelho (só uma vez)</p>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="text" id="codigoAcesso" name="entrada_codigo" placeholder="Código de acesso" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        style="flex:1;background:#141424;border:1px solid #333;border-radius:10px;padding:12px;font-size:14px;color:#e8e8e8;outline:none;font-family:inherit;-webkit-text-security:disc;text-security:disc;">
    </div>
    <button id="loginBtn" style="width:100%;background:#c8a96e;color:#111;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;">Entrar</button>
    <div id="loginErr" style="font-size:11px;color:#ff6666;margin-top:10px;min-height:14px;"></div>
  </div>
</div>

<div id="syncDot" title="Sincronizado" style="position:fixed;bottom:14px;right:14px;width:10px;height:10px;border-radius:50%;background:#555;z-index:998;transition:background 0.3s;"></div>

<script type="module">
// ══════════════════════════════════════════════════════
// SINCRONIZAÇÃO — Firebase, documento próprio do Nomes
// (não mais o "state" compartilhado antigo), tempo real,
// login persistente (sem PIN), e retrato local de segurança.
// ══════════════════════════════════════════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNKjp7hLNK6mzAX2GK49WEZq-NKgQ9o5Y",
  authDomain: "williamapp-31dff.firebaseapp.com",
  projectId: "williamapp-31dff",
  storageBucket: "williamapp-31dff.firebasestorage.app",
  messagingSenderId: "171912065024",
  appId: "1:171912065024:web:9c47f66f4b8e7fc727a8e5"
};
const ALLOWED_EMAIL = "marcelodossantosfc@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

const docNovo   = doc(db, "william", "nomes_data");   // documento próprio do Nomes (novo)
const docAntigo = doc(db, "william", "state");         // documento compartilhado antigo (só leitura, pra migração)

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function abrirRetratoDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('william_retratos', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('retratos'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
async function salvarRetratoLocal(fatia){
  try{
    var db2 = await abrirRetratoDB();
    var hoje = new Date().toISOString().slice(0,10);
    var chave = 'nomes_' + hoje;
    var tx = db2.transaction('retratos','readwrite');
    tx.objectStore('retratos').put({ data: hoje, savedAt: new Date().toISOString(), conteudo: fatia }, chave);
    var getAllReq = tx.objectStore('retratos').getAllKeys();
    getAllReq.onsuccess = function(){
      var limite = new Date(); limite.setDate(limite.getDate()-30);
      getAllReq.result.forEach(function(k){
        if(typeof k==='string' && k.indexOf('nomes_')===0){
          var dataK = new Date(k.replace('nomes_',''));
          if(dataK < limite) tx.objectStore('retratos').delete(k);
        }
      });
    };
  }catch(e){ console.warn('Retrato local falhou (não crítico):', e); }
}

function fatiaNomesAtual(){
  var s = loadState();
  var fatia = {};
  Object.keys(s).forEach(function(k){ if(pertenceAoNomes(k)) fatia[k]=s[k]; });
  return fatia;
}

function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var fatia = fatiaNomesAtual();
      fatia.lastModified = new Date().toISOString();
      await setDoc(docNovo, fatia);
      await salvarRetratoLocal(fatia);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Nomes:', e);
      setDot('#c94f4f');
    }
  }, 800);
}

function iniciarEscuta(){
  onSnapshot(docNovo, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    var mudou = false;
    Object.keys(remoto).forEach(function(k){
      if(pertenceAoNomes(k) && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      aplicandoRemoto = true;
      saveState(local);
      salvarRetratoLocal(fatiaNomesAtual());
      if(typeof render === 'function') render();
      aplicandoRemoto = false;
      setDot('#3fae5c');
    }
  }, function(err){
    console.error('Erro de sincronização (Nomes):', err);
    setDot('#c94f4f');
  });
}

async function migrarSeNecessario(){
  var snapNovo = await getDoc(docNovo);
  if(snapNovo.exists()) return;
  try{
    var snapAntigo = await getDoc(docAntigo);
    var fatia = {};
    if(snapAntigo.exists()){
      var dadosAntigos = snapAntigo.data();
      Object.keys(dadosAntigos).forEach(function(k){ if(pertenceAoNomes(k)) fatia[k]=dadosAntigos[k]; });
    }
    fatia.lastModified = new Date().toISOString();
    await setDoc(docNovo, fatia);
  }catch(e){ console.error('Erro na migração inicial do Nomes:', e); }
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('codigoAcesso').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('codigoAcesso').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });

<script>
// ══════════════════════════════════════════════════════
// AVISO DE DATAS IMPORTANTES — cantinho colorido
// Inclua este arquivo em qualquer app com:
// Não precisa mexer em mais nada — ele se conecta sozinho.
// ══════════════════════════════════════════════════════
(function () {
  var MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function proximaOcorrenciaDias(dia, mes) {
    var hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    var anoAtual = hoje.getFullYear();
    var data = new Date(anoAtual, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
    if (data < hoje) {
      data = new Date(anoAtual + 1, mes - 1, dia);
      data.setHours(0, 0, 0, 0);
    }
    return Math.round((data - hoje) / 86400000);
  }

  function corPorDias(dias) {
    if (dias <= 1) return { cor: '#ff5555', nivel: 3 };
    if (dias <= 3) return { cor: '#ff9944', nivel: 2 };
    if (dias <= 10) return { cor: '#e8c547', nivel: 1 };
    return null;
  }

  function criarBadge() {
    var badge = document.createElement('div');
    badge.id = 'aviso-datas-badge';
    badge.style.cssText =
      'position:fixed;top:8px;right:8px;width:16px;height:16px;border-radius:50%;' +
      'z-index:99999;cursor:pointer;display:none;' +
      'box-shadow:0 0 8px rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.25);';
    badge.title = 'Toque para ver as datas importantes';
    badge.onclick = function () {
      window.location.href = 'William_Datas.html';
    };
    document.body.appendChild(badge);
    return badge;
  }

  function atualizarBadge(badge) {
    var estado = {};
    try { estado = JSON.parse(localStorage.getItem('william_superapp_v1')) || {}; } catch (e) {}
    var lista = estado.datas_importantes || [];
    if (!lista.length) { badge.style.display = 'none'; return; }

    var piorNivel = null;
    var piorCor = null;
    lista.forEach(function (d) {
      var dias = proximaOcorrenciaDias(d.dia, d.mes);
      var info = corPorDias(dias);
      if (info && (piorNivel === null || info.nivel > piorNivel)) {
        piorNivel = info.nivel;
        piorCor = info.cor;
      }
    });

    if (piorCor) {
      badge.style.background = piorCor;
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  }

  function iniciar() {
    var badge = criarBadge();
    atualizarBadge(badge);
    // Reconfere periodicamente (o localStorage é atualizado pelo próprio app quando sincroniza)
    setInterval(function () { atualizarBadge(badge); }, 30000);
    // Também reconfere quando a aba volta a ficar visível
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) atualizarBadge(badge);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>
</body>
