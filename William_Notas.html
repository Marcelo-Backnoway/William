<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📓 William Notas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }

.topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 12px; color: #c8a96e; letter-spacing: 1px; font-weight: 700; }

.container { padding: 10px; max-width: 480px; margin: 0 auto; }

.card { background: #141424; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.card-title { font-size: 11px; font-weight: 700; color: #c8a96e; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }

.btn-reset { width: 100%; padding: 10px; background: none; border: 1px solid #444; border-radius: 10px; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; }
.backup-row{ display:flex; gap:8px; }
.btn-export{ flex:1; padding:11px 0; background:#1a2a1a; border:1px solid #2d6a4f; border-radius:10px; color:#74c69d; font-size:13px; font-weight:700; cursor:pointer; }
.btn-import{ flex:1; padding:11px 0; background:#1a1a2e; border:1px solid #444; border-radius:10px; color:#aaa; font-size:13px; font-weight:700; cursor:pointer; }

/* SYNC DOT + PULSO (padrão do ecossistema) */
@keyframes pulsoCriticoGrande {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,34,34,0.85), 0 0 22px 6px rgba(255,34,34,0.9); transform: translate(-50%, -50%) scale(1); }
  50% { box-shadow: 0 0 0 18px rgba(255,34,34,0), 0 0 32px 10px rgba(255,34,34,0.55); transform: translate(-50%, -50%) scale(1.035); }
}
#syncDot.dot-critico {
  position: fixed !important; top: 50%; left: 50%; right: auto; bottom: auto;
  transform: translate(-50%, -50%);
  width: auto !important; height: auto !important; min-width: 260px; max-width: calc(100vw - 40px);
  border-radius: 16px; background: #ff2222 !important;
  padding: 18px 26px; z-index: 9999; margin: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: #fff; text-align: center;
  line-height: 1.3; white-space: normal; cursor: pointer;
  animation: pulsoCriticoGrande 1s ease-in-out infinite;
}
#syncDot.dot-perto-laranja { box-shadow: 0 0 0 4px rgba(255,153,68,0.65); }
#syncDot.dot-perto-amarelo { box-shadow: 0 0 0 4px rgba(232,197,71,0.6); }
#syncDot.dot-adiado { box-shadow: 0 0 0 4px rgba(150,150,190,0.55); }
</style>
</head>
<body>
<div class="topbar">
  <h1>⚔ WILLIAM — NOTAS</h1>
</div>

<div class="container" id="main"></div>

<script>
// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — dados ficam sincronizados
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }
function pertenceAoNotas(k){ return k === 'notas_diarias' || k === 'notas_savedAt'; }

function getNotas() { var s=loadState(); return s.notas_diarias||[]; }
function setNotas(d) { var s=loadState(); s.notas_diarias=d; s.notas_savedAt=new Date().toISOString(); saveState(s); }
function getNotasSavedAt() { var s=loadState(); return s.notas_savedAt||null; }

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function el(tag,cls,txt){var e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- MICROFONE REUTILIZÁVEL ---------- */
function anexarMicrofone(inputEl, opts){
  opts = opts || {};
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '🎤';
  btn.title = 'Falar';
  btn.style.cssText = 'flex:0 0 40px;width:40px;height:40px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#e8e8e8;font-size:16px;cursor:pointer;';
  inputEl.parentNode.appendChild(btn);
  if(!Rec){ btn.style.display='none'; return btn; }
  var rec = new Rec();
  rec.lang = 'pt-BR'; rec.continuous = false; rec.interimResults = false;
  btn.addEventListener('click', function(){
    btn.style.background = '#c8a96e'; btn.style.color = '#111'; btn.textContent = '●';
    try{ rec.start(); }catch(e){}
  });
  rec.onresult = function(e){
    var texto = e.results[0][0].transcript;
    if(opts.append && inputEl.value.trim()){
      inputEl.value = inputEl.value.trim() + ' ' + texto;
    } else {
      inputEl.value = texto;
    }
    inputEl.dispatchEvent(new Event('input', {bubbles:true}));
    inputEl.dispatchEvent(new Event('change', {bubbles:true}));
    if(opts.onDone) opts.onDone();
  };
  rec.onend = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  rec.onerror = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  return btn;
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  var main = document.getElementById('main');
  main.innerHTML = '';
  renderNotas(main);
  renderBackup(main);
}

function renderNotas(main) {
  var notas = getNotas();
  var aberto = window._notaAberta !== undefined ? window._notaAberta : null;

  var card = document.createElement('div'); card.className='card';
  card.appendChild(el('div','card-title','📓 NOTAS & IDEIAS — '+notas.length+' registradas'));

  // Campos: Título + Texto
  var tituloRow = document.createElement('div'); tituloRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;';
  var fTitulo = document.createElement('input');
  fTitulo.id='notaTitulo'; fTitulo.type='text'; fTitulo.placeholder='Título da nota...';
  fTitulo.style.cssText='flex:1;background:#1a1a2e;border:1px solid #c8a96e;border-radius:10px;padding:10px 12px;font-size:15px;color:#c8a96e;font-weight:700;outline:none;font-family:inherit;';
  tituloRow.appendChild(fTitulo); card.appendChild(tituloRow);
  anexarMicrofone(fTitulo);

  var textoRow = document.createElement('div'); textoRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;';
  var ta = document.createElement('textarea');
  ta.id='notaInput'; ta.placeholder='Escreva sua nota aqui...';
  ta.style.cssText='flex:1;background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px 12px;font-size:14px;color:#e8e8e8;outline:none;font-family:inherit;resize:vertical;min-height:80px;';
  textoRow.appendChild(ta); card.appendChild(textoRow);
  anexarMicrofone(ta, {append: true});

  var addBtn = document.createElement('button');
  addBtn.textContent='💾 Salvar nota';
  addBtn.style.cssText='width:100%;background:#c8a96e;color:#111;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;';
  addBtn.onclick = function(){
    var titulo=document.getElementById('notaTitulo').value.trim();
    var texto=document.getElementById('notaInput').value.trim();
    if(!titulo){alert('Digite um título!');return;}
    if(!texto){alert('Digite o texto da nota!');return;}
    var now=new Date();
    var ns=getNotas();
    ns.unshift({titulo:titulo, texto:texto, data:now.toLocaleDateString('pt-BR'), hora:now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
    setNotas(ns); vibe([30]); window._notaAberta=0; render();
  };
  card.appendChild(addBtn);

  // Barra de busca
  var buscaRow = document.createElement('div'); buscaRow.style.cssText='display:flex;gap:8px;margin-bottom:10px;';
  var buscaIn = document.createElement('input');
  buscaIn.id='notaBusca'; buscaIn.type='text'; buscaIn.placeholder='🔎 Buscar por título ou texto...';
  buscaIn.value = window._notaBusca || '';
  buscaIn.style.cssText='flex:1;background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px 12px;font-size:13px;color:#e8e8e8;outline:none;font-family:inherit;';
  buscaIn.oninput = function(){
    window._notaBusca = this.value;
    var pos = this.selectionStart;
    render();
    var novo = document.getElementById('notaBusca');
    if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); }
  };
  buscaRow.appendChild(buscaIn);
  card.appendChild(buscaRow);

  var termoBusca = (window._notaBusca||'').trim().toLowerCase();
  var indicesVisiveis = notas.map(function(n,i){return i;}).filter(function(i){
    if(!termoBusca) return true;
    var n = notas[i];
    return (n.titulo||'').toLowerCase().indexOf(termoBusca)>=0 || (n.texto||'').toLowerCase().indexOf(termoBusca)>=0;
  });

  // Lista de títulos
  if(notas.length===0){
    var empty=el('div','','Nenhuma nota ainda. 💡');
    empty.style.cssText='text-align:center;color:#555;font-size:13px;padding:16px 0;';
    card.appendChild(empty);
  } else if(indicesVisiveis.length===0){
    var semResultado=el('div','','Nenhuma nota encontrada pra "'+window._notaBusca+'".');
    semResultado.style.cssText='text-align:center;color:#555;font-size:13px;padding:16px 0;';
    card.appendChild(semResultado);
  } else {
    indicesVisiveis.forEach(function(i){
      var n = notas[i];
      var isOpen = (aberto===i);
      var isEditando = (window._notaEditando===i);

      var row = document.createElement('div');
      row.style.cssText='background:#0f0f1e;border:1px solid '+(isOpen?'#c8a96e':'#2a2a3a')+';border-radius:10px;margin-bottom:7px;overflow:hidden;';

      // Cabeçalho clicável
      var hdr = document.createElement('div');
      hdr.style.cssText='display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;';
      hdr.onclick=(function(idx){ return function(){
        window._notaAberta = (window._notaAberta===idx) ? null : idx;
        render();
      };})(i);

      var arrow = el('span','', isOpen?'▼':'▶');
      arrow.style.cssText='font-size:10px;color:#c8a96e;flex-shrink:0;';
      var titulo = el('div','', n.titulo||(n.texto||'').substring(0,30)+'...');
      titulo.style.cssText='flex:1;font-size:14px;font-weight:700;color:#e8e8e8;';
      var stamp = el('div','', n.data);
      stamp.style.cssText='font-size:10px;color:#555;white-space:nowrap;';
      var edit = document.createElement('button');
      edit.textContent='✏️';
      edit.style.cssText='background:none;border:none;font-size:15px;cursor:pointer;color:#555;padding:2px 4px;flex-shrink:0;';
      edit.onclick=(function(idx){ return function(e){
        e.stopPropagation();
        window._notaAberta = idx;
        window._notaEditando = idx;
        render();
      };})(i);
      var del = document.createElement('button');
      del.textContent='🗑️';
      del.style.cssText='background:none;border:none;font-size:15px;cursor:pointer;color:#555;padding:2px 4px;flex-shrink:0;';
      del.onclick=(function(idx){ return function(e){
        e.stopPropagation();
        if(confirm('Deletar "'+notas[idx].titulo+'"?')){
          var ns=getNotas(); ns.splice(idx,1); setNotas(ns);
          if(window._notaAberta===idx) window._notaAberta=null;
          if(window._notaEditando===idx) window._notaEditando=null;
          render();
        }
      };})(i);

      hdr.appendChild(arrow); hdr.appendChild(titulo); hdr.appendChild(stamp); hdr.appendChild(edit); hdr.appendChild(del);
      row.appendChild(hdr);

      // Texto expandido — modo edição ou leitura
      if(isOpen && isEditando){
        var editBody = document.createElement('div');
        editBody.style.cssText='padding:0 12px 12px;border-top:1px solid #2a2a3a;';

        var editTituloRow = document.createElement('div'); editTituloRow.style.cssText='display:flex;gap:8px;margin:10px 0 8px;';
        var editTitulo = document.createElement('input');
        editTitulo.type='text'; editTitulo.value=n.titulo;
        editTitulo.style.cssText='flex:1;background:#1a1a2e;border:1px solid #c8a96e;border-radius:10px;padding:9px 11px;font-size:14px;color:#c8a96e;font-weight:700;outline:none;font-family:inherit;';
        editTituloRow.appendChild(editTitulo); anexarMicrofone(editTitulo);
        editBody.appendChild(editTituloRow);

        var editTextoRow = document.createElement('div'); editTextoRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;';
        var editTexto = document.createElement('textarea');
        editTexto.value=n.texto;
        editTexto.style.cssText='flex:1;background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:9px 11px;font-size:13px;color:#e8e8e8;outline:none;font-family:inherit;resize:vertical;min-height:80px;';
        editTextoRow.appendChild(editTexto); anexarMicrofone(editTexto, {append:true});
        editBody.appendChild(editTextoRow);

        var editBtnRow = document.createElement('div'); editBtnRow.style.cssText='display:flex;gap:8px;';
        var salvarBtn = document.createElement('button');
        salvarBtn.textContent='💾 Salvar edição';
        salvarBtn.style.cssText='flex:1;background:#c8a96e;color:#111;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;';
        salvarBtn.onclick=(function(idx){ return function(){
          var novoTitulo = editTitulo.value.trim();
          var novoTexto = editTexto.value.trim();
          if(!novoTitulo){ alert('Digite um título!'); return; }
          if(!novoTexto){ alert('Digite o texto da nota!'); return; }
          var ns=getNotas();
          ns[idx].titulo = novoTitulo;
          ns[idx].texto = novoTexto;
          setNotas(ns);
          window._notaEditando = null;
          vibe([30]); render();
        };})(i);
        var cancelarBtn = document.createElement('button');
        cancelarBtn.textContent='Cancelar';
        cancelarBtn.style.cssText='flex:1;background:#1a1a2e;color:#aaa;border:1px solid #444;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;';
        cancelarBtn.onclick=function(){ window._notaEditando=null; render(); };
        editBtnRow.appendChild(salvarBtn); editBtnRow.appendChild(cancelarBtn);
        editBody.appendChild(editBtnRow);

        row.appendChild(editBody);
      } else if(isOpen){
        var body = document.createElement('div');
        body.style.cssText='padding:0 12px 12px;border-top:1px solid #2a2a3a;';
        var stamp2 = el('div','','📅 '+n.data+' às '+n.hora);
        stamp2.style.cssText='font-size:10px;color:#555;padding:8px 0 6px;';
        var txt = el('div','',n.texto);
        txt.style.cssText='font-size:13px;color:#e8e8e8;line-height:1.7;white-space:pre-wrap;';
        body.appendChild(stamp2); body.appendChild(txt);
        row.appendChild(body);
      }
      card.appendChild(row);
    });

    var limpar=document.createElement('button');
    limpar.className='btn-reset';
    limpar.textContent='🗑️ Apagar todas as notas';
    limpar.style.cssText='margin-top:4px;color:#aa3333;border-color:#aa3333;';
    limpar.onclick=function(){
      if(confirm('Apagar TODAS as notas?')){ setNotas([]); window._notaAberta=null; render(); }
    };
    card.appendChild(limpar);
  }
  main.appendChild(card);
}

// ══════════════════════════════════════════════════════
// BACKUP — Exportar / Importar com proteção de timestamp
// Obs: esse app usa a MESMA chave de armazenamento de outros
// apps do William (Datas, Nomes, Personagens, Ilhas, Agenda, Gold).
// O backup mexe só na fatia "notas_diarias", sem tocar no
// resto do estado compartilhado.
// ══════════════════════════════════════════════════════
function formatDataHora(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function renderBackup(main) {
  var card = document.createElement('div'); card.className = 'card';
  card.appendChild(el('div', 'card-title', '💾 BACKUP'));

  var savedAt = getNotasSavedAt();
  var info = el('p', '', savedAt ? ('Última alteração: ' + formatDataHora(savedAt)) : 'Ainda sem registro de data');
  info.style.cssText = 'font-size:12px;color:#555;margin-bottom:12px;';
  card.appendChild(info);

  var row = document.createElement('div'); row.className = 'backup-row';

  var expBtn = document.createElement('button');
  expBtn.className = 'btn-export'; expBtn.textContent = '📤 Exportar';
  expBtn.onclick = exportBackup;
  row.appendChild(expBtn);

  var impBtn = document.createElement('button');
  impBtn.className = 'btn-import'; impBtn.textContent = '📥 Importar';
  impBtn.onclick = function(){ document.getElementById('importFileInput').click(); };
  row.appendChild(impBtn);

  card.appendChild(row);

  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.id = 'importFileInput'; fileInput.accept = 'application/json';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', handleImportFile);
  card.appendChild(fileInput);

  main.appendChild(card);
}

function exportBackup() {
  var backup = { notas_diarias: getNotas(), savedAt: getNotasSavedAt() || new Date().toISOString() };
  var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'william-notas-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var incoming;
    try { incoming = JSON.parse(ev.target.result); }
    catch(err){ alert('Arquivo inválido. Escolha um backup exportado por este app.'); e.target.value=''; return; }

    if (!incoming || typeof incoming !== 'object' || !('notas_diarias' in incoming)) {
      alert('Esse arquivo não parece ser um backup do Notas.');
      e.target.value = '';
      return;
    }

    var localSavedAt = getNotasSavedAt();
    var localTime = localSavedAt ? new Date(localSavedAt).getTime() : 0;
    var incomingTime = incoming.savedAt ? new Date(incoming.savedAt).getTime() : 0;

    if (localTime && incomingTime && incomingTime < localTime) {
      var msg = 'Esse backup é de ' + formatDataHora(incoming.savedAt) + ', mas as notas atuais no aparelho são mais recentes (' + formatDataHora(localSavedAt) + ').\n\nImportar mesmo assim vai substituir as notas atuais pelas mais antigas. Continuar?';
      if (!confirm(msg)) { e.target.value = ''; return; }
    }

    // Mescla só a fatia de Notas no estado compartilhado — preserva dados de outros apps
    var s = loadState();
    s.notas_diarias = incoming.notas_diarias || [];
    s.notas_savedAt = incoming.savedAt || new Date().toISOString();
    saveState(s);

    e.target.value = '';
    render();
    alert('✅ Backup importado com sucesso.');
  };
  reader.readAsText(file);
}

// INIT
render();
</script>

<script type="module">
// ══════════════════════════════════════════════════════

import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNKjp7hLNK6mzAX2GK49WEZq-NKgQ9o5Y",
  authDomain: "williamapp-31dff.firebaseapp.com",
  projectId: "williamapp-31dff",
  storageBucket: "williamapp-31dff.firebasestorage.app",
  messagingSenderId: "171912065024",
  appId: "1:171912065024:web:9c47f66f4b8e7fc727a8e5"
};
const ALLOWED_EMAIL = "marcelodossantosfc@gmail.com";

const fbApp = initializeApp(firebaseConfig);

// ALERTA DE DATA CRÍTICA NA BOLINHA DE SYNC — componente
// reutilizável (mesmo padrão em todo app do ecossistema).
// Busca os documentos remotos direto no Firebase (esse app
// não tem nenhuma dessas informações por conta própria).
// ══════════════════════════════════════════════════════
function proximaOcorrenciaDiasGlobal(dia, mes){
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes - 1, dia);
  data.setHours(0, 0, 0, 0);
  if (data < hoje) {
    data = new Date(anoAtual + 1, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
  }
  return Math.round((data - hoje) / 86400000);
}

function loteriaEhDiaSorteioGlobal(date){ var dow=date.getDay(); return dow===0||dow===2||dow===4; }
function loteriaHoraSorteioGlobal(date){ return date.getDay()===0 ? 11 : 21; }
function loteriaContagemGlobal(inicio){
  if(!inicio) return 0;
  var d=new Date(inicio+'T00:00:00');
  var agora=new Date();
  var count=0, safety=0;
  while(d<=agora && count<12 && safety<120){
    if(loteriaEhDiaSorteioGlobal(d)){
      var dtSorteio=new Date(d); dtSorteio.setHours(loteriaHoraSorteioGlobal(d),0,0,0);
      if(dtSorteio<=agora) count++;
    }
    d.setDate(d.getDate()+1); safety++;
  }
  return count;
}

function diasEntreGlobal(dataIni, dataFim){ return Math.floor((new Date(dataFim+'T00:00:00') - new Date(dataIni+'T00:00:00')) / 86400000); }
function gasDiasUsoRemoto(dadosAgenda){
  var g = dadosAgenda.gas || [];
  if (!g.length) return null;
  var x = g[0];
  var data = x.data !== undefined ? x.data : (x.inicio || x.compra);
  var duracao = x.data !== undefined ? x.duracao : (x.acabou ? diasEntreGlobal(data, x.acabou) : null);
  if (duracao !== null && duracao !== undefined) return null;
  return diasEntreGlobal(data, new Date().toISOString().split('T')[0]);
}

var KM_INTERVALO_MOTO = 2800;
var MOTO_PLANTAO_INICIO = new Date(2026,6,2);
var MOTO_FERIAS_INICIO='2026-09-28', MOTO_FERIAS_FIM='2026-10-28', MOTO_FOLGA_ESP='2026-11-19', MOTO_ANIVERSARIO='2026-11-22';
function motoIsWorkDayRemoto(date){
  var diff=Math.floor((date-MOTO_PLANTAO_INICIO)/(1000*60*60*24));
  return diff>=0 && diff%2===0;
}
function motoDiaEhTrabalhoRemoto(ds, dadosAgenda){
  var dt = new Date(ds+'T00:00:00');
  var ferias = dadosAgenda.ferias || []; var isFer = ferias.indexOf(ds)>=0;
  var isFerPer = ds>=MOTO_FERIAS_INICIO && ds<=MOTO_FERIAS_FIM;
  var isFolgaEsp = ds===MOTO_FOLGA_ESP;
  var isAniv = ds===MOTO_ANIVERSARIO;
  var overrides = dadosAgenda.diaOverride || {}; var manual = overrides[ds];
  if(isFer||isFerPer||isFolgaEsp||isAniv) return false;
  if(manual==='trabalho') return true;
  if(manual==='folga') return false;
  return motoIsWorkDayRemoto(dt);
}
var MOTO_TRABALHO_KM_REMOTO = 0.32;
function motoItinerarioMediaRemoto(it){
  if(!it || !it.medicoes || !it.medicoes.length) return null;
  var soma=it.medicoes.reduce(function(a,m){return a+m.diff;},0);
  return soma/it.medicoes.length;
}
function motoKmDoDiaRemoto(ds, dadosAgenda){
  var diario = dadosAgenda.motoDiario||{};
  var e = diario[ds];
  if(!e || e.pendente) return 0;
  var total=0;
  if (motoDiaEhTrabalhoRemoto(ds,dadosAgenda)) total += MOTO_TRABALHO_KM_REMOTO;
  if (e.resposta==='sim' && e.itinerarioId){
    var itins = dadosAgenda.motoItinerarios||{};
    var it = itins[e.itinerarioId];
    var valor = e.kmMedido !== undefined ? e.kmMedido : (it?motoItinerarioMediaRemoto(it):0);
    total += valor || 0;
  }
  return total;
}
function motoKmStatusRemoto(dadosAgenda){
  var atual = dadosAgenda.motoKmAtual;
  var historico = dadosAgenda.moto_oleo || [];
  if (!atual || !historico.length) return null;
  var diario = dadosAgenda.motoDiario || {};
  var estimado = 0;
  Object.keys(diario).forEach(function(ds){ if(ds>atual.atualizadoEm){ estimado += motoKmDoDiaRemoto(ds, dadosAgenda); } });
  return { diff: (atual.km+estimado) - historico[0].km };
}
var DIAS_LEMBRETE_ODOMETRO = 3; // dias sem atualizar o odômetro até o app cobrar (mesmo alerta do Moto)
function motoDiasSemLeituraRemoto(dadosMoto){
  var atual = dadosMoto.motoKmAtual;
  if (!atual) return null;
  return diasEntreGlobal(atual.atualizadoEm, new Date().toISOString().split('T')[0]);
}

function contasVencendoRemoto(dadosAgenda){
  var hoje = new Date();
  var chave = 'contas_' + hoje.getFullYear() + '_' + hoje.getMonth();
  var contas = dadosAgenda[chave] || [];
  var diaHoje = hoje.getDate();
  var resultado = [];
  contas.forEach(function(c){
    if (c.pago || c.diaVenc === undefined) return;
    var dias = c.diaVenc - diaHoje;
    if (dias > 1) return;
    var txt;
    if (dias === 1) txt = '💳 ' + c.nome + ' vence amanhã!';
    else if (dias === 0) txt = '💳 ' + c.nome + ' vence HOJE!';
    else txt = '💳 ' + c.nome + ' venceu há ' + Math.abs(dias) + (Math.abs(dias)===1?' dia':' dias') + '!';
    resultado.push(txt);
  });
  return resultado;
}

var _criticoTextos = [];
var _criticoIdx = 0;
setInterval(function(){
  var dot = document.getElementById('syncDot');
  if (!dot || !dot.classList.contains('dot-critico') || _criticoTextos.length < 2) return;
  _criticoIdx = (_criticoIdx + 1) % _criticoTextos.length;
  dot.textContent = _criticoTextos[_criticoIdx];
}, 3000);

var ALERTA_SNOOZE_KEY = 'william_alerta_critico_snooze_ate';
function getAdiamentoInfo(){
  try{
    var raw = localStorage.getItem(ALERTA_SNOOZE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || Date.now() >= obj.ate) return null;
    return obj;
  }catch(e){ return null; }
}
function alertaEstaAdiadoPara(textosCriticos){
  var info = getAdiamentoInfo();
  if(!info) return false;
  var atual = textosCriticos.slice().sort();
  var adiado = info.textos.slice().sort();
  if(atual.length !== adiado.length) return false;
  for(var i=0;i<atual.length;i++){ if(atual[i]!==adiado[i]) return false; }
  return true;
}
function adiarAlertaCritico(textosCriticos){
  localStorage.setItem(ALERTA_SNOOZE_KEY, JSON.stringify({ ate: Date.now()+30*60*1000, textos: textosCriticos||[] }));
}
function limparAdiamento(){
  localStorage.removeItem(ALERTA_SNOOZE_KEY);
}

async function verificarDataCriticaGlobal(){
  var dot = document.getElementById('syncDot');
  if (!dot) return;
  try {
    var comDias = [];
    try {
      var snap = await getDoc(doc(db, "william", "datas_data"));
      if (snap.exists()) {
        var lista = snap.data().datas_importantes || [];
        comDias = lista.map(function(d){ return { nome: d.nome, ano: d.ano, dias: proximaOcorrenciaDiasGlobal(d.dia, d.mes) }; });
      }
    } catch(e) {}

    var loteriaCount = 0;
    var gasDias = null;
    var motoStatus = null;
    var motoDiasSemLeitura = null;
    var textosContas = [];
    try {
      var snapAg = await getDoc(doc(db, "william", "agenda_data"));
      if (snapAg.exists()) {
        var dadosAg = snapAg.data();
        loteriaCount = loteriaContagemGlobal(dadosAg.loteria_inicio || null);
        gasDias = gasDiasUsoRemoto(dadosAg);
        textosContas = contasVencendoRemoto(dadosAg);
      }
    } catch(e) {}
    try {
      var snapMoto = await getDoc(doc(db, "william", "moto_data"));
      if (snapMoto.exists()) {
        var dadosMoto = snapMoto.data();
        motoStatus = motoKmStatusRemoto(dadosMoto);
        motoDiasSemLeitura = motoDiasSemLeituraRemoto(dadosMoto);
      }
    } catch(e) {}

    dot.classList.remove('dot-critico', 'dot-adiado', 'dot-perto-laranja', 'dot-perto-amarelo');
    dot.textContent = '';

    var criticos = comDias.filter(function(item){ return item.dias <= 1; }).sort(function(a,b){ return a.dias - b.dias; });
    var laranjas = comDias.filter(function(item){ return item.dias > 1 && item.dias <= 3; }).sort(function(a,b){ return a.dias - b.dias; });
    var amarelos = comDias.filter(function(item){ return item.dias > 3 && item.dias <= 10; }).sort(function(a,b){ return a.dias - b.dias; });

    var textosCriticos = criticos.map(function(item){
      var prefixo = item.ano ? '🎂 ' : '📌 ';
      return prefixo + item.nome + (item.dias === 0 ? ' é HOJE!' : ' é amanhã!');
    });
    var textosAmarelos = amarelos.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });

    if (loteriaCount >= 12) {
      textosCriticos.push('🎰 Renovar Megasena!');
    } else if (loteriaCount === 11) {
      textosAmarelos.push('🎰 Megasena: falta 1 concurso, renove em breve');
    }

    if (gasDias !== null) {
      if (gasDias >= 90) {
        textosCriticos.push('🔥 Gás: ' + gasDias + ' dias de uso, hora de trocar!');
      } else if (gasDias >= 80) {
        textosAmarelos.push('🔥 Gás: ' + gasDias + ' dias de uso, perto da troca');
      }
    }

    textosContas.forEach(function(t){ textosCriticos.push(t); });

    if (motoStatus) {
      if (motoStatus.diff >= KM_INTERVALO_MOTO) {
        textosCriticos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, hora de trocar o óleo!');
      } else if (motoStatus.diff >= KM_INTERVALO_MOTO - 200) {
        textosAmarelos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, troca em breve');
      }
    }

    if (motoDiasSemLeitura !== null) {
      if (motoDiasSemLeitura >= DIAS_LEMBRETE_ODOMETRO) {
        textosCriticos.push('🏍️ Moto: ' + motoDiasSemLeitura + ' dias sem bater o odômetro!');
      } else if (motoDiasSemLeitura === DIAS_LEMBRETE_ODOMETRO - 1) {
        textosAmarelos.push('🏍️ Moto: odômetro sem atualizar há ' + motoDiasSemLeitura + ' dia(s)');
      }
    }

    if (textosCriticos.length && !alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-critico');
      dot.title = textosCriticos.join(' • ') + ' (toque para adiar 30min)';
      _criticoTextos = textosCriticos;
      _criticoIdx = 0;
      dot.textContent = textosCriticos[0];
    } else if (textosCriticos.length && alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-adiado');
      dot.title = 'Adiado — ainda ativo: ' + textosCriticos.join(' • ') + ' (toque para reativar agora)';
      _criticoTextos = [];
    } else if (laranjas.length){
      var textosL = laranjas.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });
      dot.classList.add('dot-perto-laranja');
      dot.title = textosL.join(' • ');
      _criticoTextos = [];
    } else if (textosAmarelos.length){
      dot.classList.add('dot-perto-amarelo');
      dot.title = textosAmarelos.join(' • ');
      _criticoTextos = [];
    } else {
      dot.title = 'Sincronizado';
      _criticoTextos = [];
    }
  } catch (e) { /* silencioso — não atrapalha o app se essa checagem falhar */ }
}

function iniciarChecagemDataCritica(){
  var dot = document.getElementById('syncDot');
  if (dot) {
    dot.onclick = function(){
      if (dot.classList.contains('dot-critico')){
        adiarAlertaCritico(_criticoTextos);
        verificarDataCriticaGlobal();
      } else if (dot.classList.contains('dot-adiado')){
        limparAdiamento();
        verificarDataCriticaGlobal();
      }
    };
    dot.style.cursor = 'pointer';
  }
  verificarDataCriticaGlobal();
  setInterval(verificarDataCriticaGlobal, 30000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) verificarDataCriticaGlobal();
  });
}

const docNovo   = doc(db, "william", "notas_data");
const docAntigo = doc(db, "william", "state");

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function abrirRetratoDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('william_retratos', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('retratos'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
async function salvarRetratoLocal(fatia){
  try{
    var db2 = await abrirRetratoDB();
    var hoje = new Date().toISOString().slice(0,10);
    var chave = 'notas_' + hoje;
    var tx = db2.transaction('retratos','readwrite');
    tx.objectStore('retratos').put({ data: hoje, savedAt: new Date().toISOString(), conteudo: fatia }, chave);
    var getAllReq = tx.objectStore('retratos').getAllKeys();
    getAllReq.onsuccess = function(){
      var limite = new Date(); limite.setDate(limite.getDate()-30);
      getAllReq.result.forEach(function(k){
        if(typeof k==='string' && k.indexOf('notas_')===0){
          var dataK = new Date(k.replace('notas_',''));
          if(dataK < limite) tx.objectStore('retratos').delete(k);
        }
      });
    };
  }catch(e){ console.warn('Retrato local falhou (não crítico):', e); }
}

function fatiaNotasAtual(){
  var s = loadState();
  var fatia = {};
  Object.keys(s).forEach(function(k){ if(pertenceAoNotas(k)) fatia[k]=s[k]; });
  return fatia;
}

function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var fatia = fatiaNotasAtual();
      fatia.lastModified = new Date().toISOString();
      await setDoc(docNovo, fatia);
      await salvarRetratoLocal(fatia);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Notas:', e);
      setDot('#c94f4f');
    }
  }, 800);
}

function iniciarEscuta(){
  onSnapshot(docNovo, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    var mudou = false;
    Object.keys(remoto).forEach(function(k){
      if(pertenceAoNotas(k) && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      aplicandoRemoto = true;
      saveState(local);
      salvarRetratoLocal(fatiaNotasAtual());
      if(typeof render === 'function') render();
      aplicandoRemoto = false;
      setDot('#3fae5c');
    }
  }, function(err){
    console.error('Erro de sincronização (Notas):', err);
    setDot('#c94f4f');
  });
}

async function migrarSeNecessario(){
  var snapNovo = await getDoc(docNovo);
  if(snapNovo.exists()) return;
  try{
    var snapAntigo = await getDoc(docAntigo);
    var fatia = {};
    if(snapAntigo.exists()){
      var dadosAntigos = snapAntigo.data();
      Object.keys(dadosAntigos).forEach(function(k){ if(pertenceAoNotas(k)) fatia[k]=dadosAntigos[k]; });
    }
    fatia.lastModified = new Date().toISOString();
    await setDoc(docNovo, fatia);
  }catch(e){ console.error('Erro na migração inicial do Notas:', e); }
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('codigoAcesso').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('codigoAcesso').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });
anexarMicrofone(document.getElementById('codigoAcesso'));

onAuthStateChanged(auth, async function(user){
  if(user && user.email === ALLOWED_EMAIL){
    esconderLogin();
    if(!jaMigrou){
      jaMigrou = true;
      await migrarSeNecessario();
      iniciarEscuta();
      iniciarChecagemDataCritica();
    }
  } else {
    mostrarLogin();
  }
});

var saveStateOriginal = window.saveState;
window.saveState = function(s){
  saveStateOriginal(s);
  agendarPush();
};
</script>
