<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>William · Prefeitura</title>
<style>
  :root{
    --bg:#0c0c0d; --panel:#17171a; --panel2:#1d1d21; --border:#2a2a30;
    --gold:#c9a24b; --gold-dim:#8a7538; --text:#ece7dc; --text-dim:#8a8578;
    --green:#3fae5c; --red:#c94f4f; --blue:#4a7fc9;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; padding-bottom:40px;
  }
  .topbar{
    background:#111114; border-bottom:1px solid var(--border); padding:14px 16px;
    display:flex; align-items:center; justify-content:center; position:sticky; top:0; z-index:50;
  }
  .topbar h1{ margin:0; font-size:17px; letter-spacing:0.5px; }
  .tabs{
    display:flex; background:#111114; border-bottom:1px solid var(--border);
    position:sticky; top:49px; z-index:49;
  }
  .tab-btn{
    flex:1; background:none; border:none; color:var(--text-dim); padding:13px 0;
    font-size:14px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .container{ max-width:460px; margin:0 auto; padding:18px 16px; }

  /* ---- Botão inteligente de ponto ---- */
  .punch-btn{
    width:100%; border:none; border-radius:18px; padding:26px 0; text-align:center;
    font-size:20px; font-weight:800; cursor:pointer; color:#fff; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .punch-btn.entrada{ background:linear-gradient(135deg,#3fae5c,#2c8046); }
  .punch-btn.saida{ background:linear-gradient(135deg,#c94f4f,#992e2e); }
  .punch-btn .sub{ display:block; font-size:12px; font-weight:400; opacity:0.85; margin-top:4px; }

  /* ---- Modal de confirmação ---- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-bg.show{ display:flex; }
  .modal-box{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:26px 22px; width:100%; max-width:360px; text-align:center;
  }
  .modal-box h3{ margin:0 0 4px; font-size:15px; color:var(--text-dim); font-weight:600; }
  .modal-box .modal-date{ font-size:13px; color:var(--text-dim); margin-bottom:16px; }
  .time-display{
    font-size:52px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums;
    letter-spacing:1px; margin:10px 0 18px;
  }
  .time-adjust{ display:flex; gap:12px; justify-content:center; margin-bottom:22px; }
  .time-adjust button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:16px; font-weight:700; border-radius:12px; padding:12px 20px; cursor:pointer;
  }
  .time-adjust button:active{ background:#26262c; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1; border:none; border-radius:12px; padding:14px 0; font-size:15px;
    font-weight:700; cursor:pointer;
  }
  .btn-cancel{ background:var(--panel2); color:var(--text-dim); }
  .btn-confirm{ background:var(--gold); color:#111; }

  /* ---- Tela de sucesso ---- */
  .success-box{
    background:#0f1f13; border:1px solid #2c8046; border-radius:16px; padding:20px;
    text-align:center; margin-bottom:20px; display:none;
  }
  .success-box.show{ display:block; }
  .success-box .check{ font-size:34px; margin-bottom:6px; }
  .success-box .msg{ font-size:15px; font-weight:700; color:#7fd99a; }
  .success-box .sub{ font-size:12px; color:var(--text-dim); margin-top:4px; }

  /* ---- Histórico ---- */
  .section-title{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim);
    margin:22px 0 10px; font-weight:700;
  }
  .plantao-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; position:relative;
  }
  .plantao-row{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .plantao-row .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .plantao-row .dot.in{ background:var(--green); }
  .plantao-row .dot.out{ background:var(--red); }
  .plantao-row .lbl{ color:var(--text-dim); font-size:12px; width:56px; flex-shrink:0; }
  .plantao-row .val{ font-weight:700; }
  .plantao-arrow{ color:var(--text-dim); margin:2px 0 2px 18px; font-size:13px; }
  .pending-tag{
    display:inline-block; background:#2a2010; color:var(--gold); font-size:10px;
    padding:2px 8px; border-radius:20px; margin-left:8px; letter-spacing:0.5px;
  }
  .edit-icon{
    position:absolute; top:12px; right:12px; background:none; border:none;
    color:var(--text-dim); font-size:14px; cursor:pointer; padding:4px;
  }

  /* ---- Documentos ---- */
  .doc-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }
  .doc-title{ font-size:15px; font-weight:700; margin-bottom:2px; }
  .doc-year{ font-size:12px; color:var(--gold-dim); margin-bottom:12px; }
  .doc-select{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:14px; padding:11px 12px; border-radius:10px; margin-bottom:10px; font-family:inherit;
  }
  .doc-badge-row{ margin-bottom:10px; min-height:20px; }
  .drive-tag{
    display:inline-block; background:#0f1f13; color:#7fd99a; font-size:11px;
    padding:4px 10px; border-radius:20px; font-weight:700;
  }
  .doc-link-row{ display:flex; gap:8px; }
  .doc-link-row input{
    flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:13px; padding:10px 12px; border-radius:10px; font-family:inherit;
  }
  .doc-link-row input::placeholder{ color:var(--text-dim); }
  .doc-link-row button{
    background:var(--panel2); border:1px solid var(--gold-dim); color:var(--gold);
    border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer; font-size:13px;
  }
  .doc-status-badge{
    display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700;
  }
  .badge-ok{ background:#0f1f13; color:#7fd99a; }
  .badge-wait{ background:#241a0a; color:#e0b567; }
  .badge-none{ background:#241010; color:#e08a8a; }

  .empty-msg{ text-align:center; color:var(--text-dim); font-size:13px; padding:30px 0; }

  /* SYNC DOT + PULSO (padrão do ecossistema) */
  @keyframes pulsoCriticoGrande {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,34,34,0.85), 0 0 22px 6px rgba(255,34,34,0.9); transform: translate(-50%, -50%) scale(1); }
    50% { box-shadow: 0 0 0 18px rgba(255,34,34,0), 0 0 32px 10px rgba(255,34,34,0.55); transform: translate(-50%, -50%) scale(1.035); }
  }
  #syncDot.dot-critico {
    position: fixed !important; top: 50%; left: 50%; right: auto; bottom: auto;
    transform: translate(-50%, -50%);
    width: auto !important; height: auto !important; min-width: 260px; max-width: calc(100vw - 40px);
    border-radius: 16px; background: #ff2222 !important;
    padding: 18px 26px; z-index: 9999; margin: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #fff; text-align: center;
    line-height: 1.3; white-space: normal; cursor: pointer;
    animation: pulsoCriticoGrande 1s ease-in-out infinite;
  }
  #syncDot.dot-perto-laranja { box-shadow: 0 0 0 4px rgba(255,153,68,0.65); }
  #syncDot.dot-perto-amarelo { box-shadow: 0 0 0 4px rgba(232,197,71,0.6); }
  #syncDot.dot-adiado { box-shadow: 0 0 0 4px rgba(150,150,190,0.55); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🏛️ WILLIAM — PREFEITURA</h1>
</div>

<div class="container">

  <!-- ================= DOCUMENTOS ================= -->
  <div id="view-docs">

    <div class="doc-card">
      <div class="doc-title">📋 Informe de Rendimentos</div>
      <div class="doc-year" id="informeAno"></div>
      <select class="doc-select" id="informeStatus">
        <option value="indisponivel">Ainda não disponibilizado</option>
        <option value="aguardando">Disponível, aguardando declarar</option>
        <option value="concluido">IR já concluído</option>
      </select>
      <div class="doc-badge-row" id="informeBadgeRow"></div>
      <div class="doc-link-row">
        <input type="text" id="informeLink" placeholder="Link da pasta no Drive">
        <button onclick="openDriveLink('informeLink')">Abrir</button>
      </div>
    </div>

    <div class="doc-card">
      <div class="doc-title">🏦 Recadastramento Caixa Previdência</div>
      <div class="doc-year" id="recadAno"></div>
      <select class="doc-select" id="recadStatus">
        <option value="indisponivel">Ainda não liberado</option>
        <option value="disponivel_pendente">Liberado, ainda não recadastrado</option>
        <option value="recadastrado">Recadastrado</option>
      </select>
      <div class="doc-badge-row" id="recadBadgeRow"></div>
      <div class="doc-link-row">
        <input type="text" id="recadLink" placeholder="Link da pasta no Drive">
        <button onclick="openDriveLink('recadLink')">Abrir</button>
      </div>
    </div>

    <div class="doc-card">
      <div class="doc-title">📑 Declaração de Bens</div>
      <div class="doc-year" id="declAno"></div>
      <select class="doc-select" id="declStatus">
        <option value="indisponivel">Não disponível</option>
        <option value="disponivel_pendente">Disponível, ainda não declarado</option>
        <option value="declarado">Já declarado</option>
      </select>
      <div class="doc-badge-row" id="declBadgeRow"></div>
      <div class="doc-link-row">
        <input type="text" id="declLink" placeholder="Link da pasta no Drive">
        <button onclick="openDriveLink('declLink')">Abrir</button>
      </div>
    </div>

    <div class="doc-card">
      <div class="doc-title">💾 Backup</div>
      <div class="doc-year" id="backupInfo">—</div>
      <div class="doc-link-row" style="margin-bottom:0;">
        <button style="flex:1;padding:11px 0;background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;" onclick="exportBackup()">📤 Exportar</button>
        <button style="flex:1;padding:11px 0;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;" onclick="document.getElementById('importFileInput').click()">📥 Importar</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;">
    </div>

  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'williamPrefeituraData';
  const weekdays = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

  // ---------- Armazenamento local (sem login, sem PIN, 100% offline) ----------
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const d = raw ? JSON.parse(raw) : { plantoes: [], docs: {} };
      if(!d.plantoes) d.plantoes = [];
      if(!d.docs) d.docs = {};
      return d;
    }catch(e){ return { plantoes: [], docs: {} }; }
  }
  function saveData(d){
    d.savedAt = new Date().toISOString();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    catch(e){ console.error('Erro ao salvar', e); }
    updateBackupInfo();
    if(window.__prefeituraAoSalvar) window.__prefeituraAoSalvar();
  }

  let data = loadData();

  // ---------- Backup: Exportar / Importar com proteção de timestamp ----------
  function formatDateHora(iso){
    if(!iso) return null;
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }
  function updateBackupInfo(){
    const el = document.getElementById('backupInfo');
    if(!el) return;
    el.textContent = data.savedAt ? ('Última alteração: ' + formatDateHora(data.savedAt)) : 'Ainda sem registro de data';
  }

  window.exportBackup = function(){
    if(!data.savedAt) data.savedAt = new Date().toISOString();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'william-prefeitura-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  document.getElementById('importFileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      let incoming;
      try{ incoming = JSON.parse(ev.target.result); }
      catch(err){ alert('Arquivo inválido. Escolha um backup exportado por este app.'); e.target.value = ''; return; }

      if(!incoming || typeof incoming !== 'object' || !('docs' in incoming)){
        alert('Esse arquivo não parece ser um backup do Prefeitura.');
        e.target.value = '';
        return;
      }

      // ---- Proteção de timestamp: evita sobrescrever dados mais novos com um backup mais antigo ----
      const localTime = data.savedAt ? new Date(data.savedAt).getTime() : 0;
      const incomingTime = incoming.savedAt ? new Date(incoming.savedAt).getTime() : 0;

      if(localTime && incomingTime && incomingTime < localTime){
        const msg = 'Esse backup é de ' + formatDateHora(incoming.savedAt) + ', mas os dados atuais no aparelho são mais recentes (' + formatDateHora(data.savedAt) + ').\n\nImportar mesmo assim vai substituir os dados atuais pelos mais antigos. Continuar?';
        if(!confirm(msg)){ e.target.value = ''; return; }
      }

      if(!incoming.plantoes) incoming.plantoes = [];
      if(!incoming.docs) incoming.docs = {};
      data = incoming;
      saveData(data);
      loadDocs();
      e.target.value = '';
      alert('✅ Backup importado com sucesso.');
    };
    reader.readAsText(file);
  });
  // ---------- Documentos ----------
  // valor de status que representa "já concluído" pra cada documento, junto do rótulo da etiqueta
  const doneStates = {
    informe: 'concluido',
    recad: 'recadastrado',
    decl: 'declarado'
  };

  function updateBadge(key, selectId, badgeRowId){
    const val = document.getElementById(selectId).value;
    const row = document.getElementById(badgeRowId);
    if(val === doneStates[key]){
      row.innerHTML = '<span class="drive-tag">📁 Comprovante no Drive</span>';
    } else {
      row.innerHTML = '';
    }
  }

  function loadDocs(){
    if(!data.docs) data.docs = {};

    // Migração de valores antigos (versão anterior do app) pros novos rótulos
    const migracao = {
      recad: { drive: 'recadastrado', nao_recadastrado: 'disponivel_pendente' },
      decl: { drive: 'declarado', liberada: 'disponivel_pendente' }
    };
    Object.keys(migracao).forEach(function(key){
      if(data.docs[key] && migracao[key][data.docs[key].status]){
        data.docs[key].status = migracao[key][data.docs[key].status];
      }
    });

    const anoAtual = new Date().getFullYear();
    document.getElementById('informeAno').textContent = 'Informe de Rendimentos ' + (anoAtual - 1);
    document.getElementById('recadAno').textContent = 'Recadastramento ' + anoAtual;
    document.getElementById('declAno').textContent = 'Referente a ' + anoAtual;

    const fields = [
      ['informeStatus','informeLink','informe','informeBadgeRow'],
      ['recadStatus','recadLink','recad','recadBadgeRow'],
      ['declStatus','declLink','decl','declBadgeRow']
    ];
    fields.forEach(function(f){
      const key = f[2];
      if(!data.docs[key]) data.docs[key] = { status:'', link:'' };
      document.getElementById(f[0]).value = data.docs[key].status || document.getElementById(f[0]).options[0].value;
      document.getElementById(f[1]).value = data.docs[key].link || '';
      updateBadge(key, f[0], f[3]);

      document.getElementById(f[0]).addEventListener('change', function(){
        data.docs[key].status = this.value;
        saveData(data);
        updateBadge(key, f[0], f[3]);
      });
      document.getElementById(f[1]).addEventListener('input', function(){
        data.docs[key].link = this.value;
        saveData(data);
      });
    });
  }

  window.openDriveLink = function(inputId){
    const url = document.getElementById(inputId).value.trim();
    if(!url){ alert('Cole o link da pasta no Drive primeiro.'); return; }
    window.open(url, '_blank');
  };

  loadDocs();
  updateBackupInfo();

  // Pontes pro módulo de sincronização (fora da IIFE) conseguir ler e aplicar dados
  window.__prefeituraGetData = function(){ return data; };
  window.__prefeituraSetDataRemoto = function(novo){
    data = novo;
    loadDocs();
    updateBackupInfo();
  };

  /* ---------- MICROFONE REUTILIZÁVEL ---------- */
  function anexarMicrofone(inputEl, opts){
    opts = opts || {};
    var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '🎤';
    btn.title = 'Falar';
    btn.style.cssText = 'flex:0 0 40px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:16px;cursor:pointer;';
    inputEl.parentNode.insertBefore(btn, inputEl.nextSibling);
    if(!Rec){ btn.style.display='none'; return btn; }
    var rec = new Rec();
    rec.lang = 'pt-BR'; rec.continuous = false; rec.interimResults = false;
    btn.addEventListener('click', function(){
      btn.style.background = 'var(--gold)'; btn.style.color = '#111'; btn.textContent = '●';
      try{ rec.start(); }catch(e){}
    });
    rec.onresult = function(e){
      inputEl.value = e.results[0][0].transcript;
      inputEl.dispatchEvent(new Event('input', {bubbles:true}));
      inputEl.dispatchEvent(new Event('change', {bubbles:true}));
      if(opts.onDone) opts.onDone();
    };
    rec.onend = function(){ btn.style.background='var(--panel2)'; btn.style.color='var(--text)'; btn.textContent='🎤'; };
    rec.onerror = function(){ btn.style.background='var(--panel2)'; btn.style.color='var(--text)'; btn.textContent='🎤'; };
    return btn;
  }
  window.anexarMicrofone = anexarMicrofone;
  ['informeLink','recadLink','declLink'].forEach(function(id){
    var campo = document.getElementById(id);
    if(campo) anexarMicrofone(campo);
  });
})();
</script>

  <div style="width:100%;max-width:320px;text-align:center;">

<script type="module">
// ══════════════════════════════════════════════════════
// SINCRONIZAÇÃO — Firebase, documento próprio da Prefeitura.
// Nunca teve nuvem antes — a primeira sincronização usa o
// que já está salvo neste aparelho como ponto de partida.
// ══════════════════════════════════════════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNKjp7hLNK6mzAX2GK49WEZq-NKgQ9o5Y",
  authDomain: "williamapp-31dff.firebaseapp.com",
  projectId: "williamapp-31dff",
  storageBucket: "williamapp-31dff.firebasestorage.app",
  messagingSenderId: "171912065024",
  appId: "1:171912065024:web:9c47f66f4b8e7fc727a8e5"
};
const ALLOWED_EMAIL = "marcelodossantosfc@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

// ══════════════════════════════════════════════════════
// ALERTA DE DATA CRÍTICA NA BOLINHA DE SYNC — componente
// reutilizável (mesmo padrão em todo app do ecossistema).
// Busca os documentos remotos direto no Firebase (esse app
// não tem nenhuma dessas informações por conta própria).
// ══════════════════════════════════════════════════════
function proximaOcorrenciaDiasGlobal(dia, mes){
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes - 1, dia);
  data.setHours(0, 0, 0, 0);
  if (data < hoje) {
    data = new Date(anoAtual + 1, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
  }
  return Math.round((data - hoje) / 86400000);
}

function loteriaEhDiaSorteioGlobal(date){ var dow=date.getDay(); return dow===0||dow===2||dow===4; }
function loteriaHoraSorteioGlobal(date){ return date.getDay()===0 ? 11 : 21; }
function loteriaContagemGlobal(inicio){
  if(!inicio) return 0;
  var d=new Date(inicio+'T00:00:00');
  var agora=new Date();
  var count=0, safety=0;
  while(d<=agora && count<12 && safety<120){
    if(loteriaEhDiaSorteioGlobal(d)){
      var dtSorteio=new Date(d); dtSorteio.setHours(loteriaHoraSorteioGlobal(d),0,0,0);
      if(dtSorteio<=agora) count++;
    }
    d.setDate(d.getDate()+1); safety++;
  }
  return count;
}

function diasEntreGlobal(dataIni, dataFim){ return Math.floor((new Date(dataFim+'T00:00:00') - new Date(dataIni+'T00:00:00')) / 86400000); }
function gasDiasUsoRemoto(dadosAgenda){
  var g = dadosAgenda.gas || [];
  if (!g.length) return null;
  var x = g[0];
  var data = x.data !== undefined ? x.data : (x.inicio || x.compra);
  var duracao = x.data !== undefined ? x.duracao : (x.acabou ? diasEntreGlobal(data, x.acabou) : null);
  if (duracao !== null && duracao !== undefined) return null;
  return diasEntreGlobal(data, new Date().toISOString().split('T')[0]);
}

var KM_INTERVALO_MOTO = 2800;
var MOTO_PLANTAO_INICIO = new Date(2026,6,2);
var MOTO_FERIAS_INICIO='2026-09-28', MOTO_FERIAS_FIM='2026-10-28', MOTO_FOLGA_ESP='2026-11-19', MOTO_ANIVERSARIO='2026-11-22';
function motoIsWorkDayRemoto(date){
  var diff=Math.floor((date-MOTO_PLANTAO_INICIO)/(1000*60*60*24));
  return diff>=0 && diff%2===0;
}
function motoDiaEhTrabalhoRemoto(ds, dadosAgenda){
  var dt = new Date(ds+'T00:00:00');
  var ferias = dadosAgenda.ferias || []; var isFer = ferias.indexOf(ds)>=0;
  var isFerPer = ds>=MOTO_FERIAS_INICIO && ds<=MOTO_FERIAS_FIM;
  var isFolgaEsp = ds===MOTO_FOLGA_ESP;
  var isAniv = ds===MOTO_ANIVERSARIO;
  var overrides = dadosAgenda.diaOverride || {}; var manual = overrides[ds];
  if(isFer||isFerPer||isFolgaEsp||isAniv) return false;
  if(manual==='trabalho') return true;
  if(manual==='folga') return false;
  return motoIsWorkDayRemoto(dt);
}
var MOTO_TRABALHO_KM_REMOTO = 0.32;
function motoItinerarioMediaRemoto(it){
  if(!it || !it.medicoes || !it.medicoes.length) return null;
  var soma=it.medicoes.reduce(function(a,m){return a+m.diff;},0);
  return soma/it.medicoes.length;
}
function motoKmDoDiaRemoto(ds, dadosAgenda){
  var diario = dadosAgenda.motoDiario||{};
  var e = diario[ds];
  if(!e || e.pendente) return 0;
  var total=0;
  if (motoDiaEhTrabalhoRemoto(ds,dadosAgenda)) total += MOTO_TRABALHO_KM_REMOTO;
  if (e.resposta==='sim' && e.itinerarioId){
    var itins = dadosAgenda.motoItinerarios||{};
    var it = itins[e.itinerarioId];
    var valor = e.kmMedido !== undefined ? e.kmMedido : (it?motoItinerarioMediaRemoto(it):0);
    total += valor || 0;
  }
  return total;
}
function motoKmStatusRemoto(dadosAgenda){
  var atual = dadosAgenda.motoKmAtual;
  var historico = dadosAgenda.moto_oleo || [];
  if (!atual || !historico.length) return null;
  var diario = dadosAgenda.motoDiario || {};
  var estimado = 0;
  Object.keys(diario).forEach(function(ds){ if(ds>atual.atualizadoEm){ estimado += motoKmDoDiaRemoto(ds, dadosAgenda); } });
  return { diff: (atual.km+estimado) - historico[0].km };
}
var DIAS_LEMBRETE_ODOMETRO = 3; // dias sem atualizar o odômetro até o app cobrar (mesmo alerta do Moto)
function motoDiasSemLeituraRemoto(dadosMoto){
  var atual = dadosMoto.motoKmAtual;
  if (!atual) return null;
  return diasEntreGlobal(atual.atualizadoEm, new Date().toISOString().split('T')[0]);
}

function contasVencendoRemoto(dadosAgenda){
  var hoje = new Date();
  var chave = 'contas_' + hoje.getFullYear() + '_' + hoje.getMonth();
  var contas = dadosAgenda[chave] || [];
  var diaHoje = hoje.getDate();
  var resultado = [];
  contas.forEach(function(c){
    if (c.pago || c.diaVenc === undefined) return;
    var dias = c.diaVenc - diaHoje;
    if (dias > 1) return;
    var txt;
    if (dias === 1) txt = '💳 ' + c.nome + ' vence amanhã!';
    else if (dias === 0) txt = '💳 ' + c.nome + ' vence HOJE!';
    else txt = '💳 ' + c.nome + ' venceu há ' + Math.abs(dias) + (Math.abs(dias)===1?' dia':' dias') + '!';
    resultado.push(txt);
  });
  return resultado;
}

var _criticoTextos = [];
var _criticoIdx = 0;
setInterval(function(){
  var dot = document.getElementById('syncDot');
  if (!dot || !dot.classList.contains('dot-critico') || _criticoTextos.length < 2) return;
  _criticoIdx = (_criticoIdx + 1) % _criticoTextos.length;
  dot.textContent = _criticoTextos[_criticoIdx];
}, 3000);

var ALERTA_SNOOZE_KEY = 'william_alerta_critico_snooze_ate';
function getAdiamentoInfo(){
  try{
    var raw = localStorage.getItem(ALERTA_SNOOZE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || Date.now() >= obj.ate) return null;
    return obj;
  }catch(e){ return null; }
}
function alertaEstaAdiadoPara(textosCriticos){
  var info = getAdiamentoInfo();
  if(!info) return false;
  var atual = textosCriticos.slice().sort();
  var adiado = info.textos.slice().sort();
  if(atual.length !== adiado.length) return false;
  for(var i=0;i<atual.length;i++){ if(atual[i]!==adiado[i]) return false; }
  return true;
}
function adiarAlertaCritico(textosCriticos){
  localStorage.setItem(ALERTA_SNOOZE_KEY, JSON.stringify({ ate: Date.now()+30*60*1000, textos: textosCriticos||[] }));
}
function limparAdiamento(){
  localStorage.removeItem(ALERTA_SNOOZE_KEY);
}

async function verificarDataCriticaGlobal(){
  var dot = document.getElementById('syncDot');
  if (!dot) return;
  try {
    var comDias = [];
    try {
      var snap = await getDoc(doc(db, "william", "datas_data"));
      if (snap.exists()) {
        var lista = snap.data().datas_importantes || [];
        comDias = lista.map(function(d){ return { nome: d.nome, ano: d.ano, dias: proximaOcorrenciaDiasGlobal(d.dia, d.mes) }; });
      }
    } catch(e) {}

    var loteriaCount = 0;
    var gasDias = null;
    var motoStatus = null;
    var motoDiasSemLeitura = null;
    var textosContas = [];
    try {
      var snapAg = await getDoc(doc(db, "william", "agenda_data"));
      if (snapAg.exists()) {
        var dadosAg = snapAg.data();
        loteriaCount = loteriaContagemGlobal(dadosAg.loteria_inicio || null);
        gasDias = gasDiasUsoRemoto(dadosAg);
        textosContas = contasVencendoRemoto(dadosAg);
      }
    } catch(e) {}
    try {
      var snapMoto = await getDoc(doc(db, "william", "moto_data"));
      if (snapMoto.exists()) {
        var dadosMoto = snapMoto.data();
        motoStatus = motoKmStatusRemoto(dadosMoto);
        motoDiasSemLeitura = motoDiasSemLeituraRemoto(dadosMoto);
      }
    } catch(e) {}

    dot.classList.remove('dot-critico', 'dot-adiado', 'dot-perto-laranja', 'dot-perto-amarelo');
    dot.textContent = '';

    var criticos = comDias.filter(function(item){ return item.dias <= 1; }).sort(function(a,b){ return a.dias - b.dias; });
    var laranjas = comDias.filter(function(item){ return item.dias > 1 && item.dias <= 3; }).sort(function(a,b){ return a.dias - b.dias; });
    var amarelos = comDias.filter(function(item){ return item.dias > 3 && item.dias <= 10; }).sort(function(a,b){ return a.dias - b.dias; });

    var textosCriticos = criticos.map(function(item){
      var prefixo = item.ano ? '🎂 ' : '📌 ';
      return prefixo + item.nome + (item.dias === 0 ? ' é HOJE!' : ' é amanhã!');
    });
    var textosAmarelos = amarelos.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });

    if (loteriaCount >= 12) {
      textosCriticos.push('🎰 Renovar Megasena!');
    } else if (loteriaCount === 11) {
      textosAmarelos.push('🎰 Megasena: falta 1 concurso, renove em breve');
    }

    if (gasDias !== null) {
      if (gasDias >= 90) {
        textosCriticos.push('🔥 Gás: ' + gasDias + ' dias de uso, hora de trocar!');
      } else if (gasDias >= 80) {
        textosAmarelos.push('🔥 Gás: ' + gasDias + ' dias de uso, perto da troca');
      }
    }

    textosContas.forEach(function(t){ textosCriticos.push(t); });

    if (motoStatus) {
      if (motoStatus.diff >= KM_INTERVALO_MOTO) {
        textosCriticos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, hora de trocar o óleo!');
      } else if (motoStatus.diff >= KM_INTERVALO_MOTO - 200) {
        textosAmarelos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, troca em breve');
      }
    }

    if (motoDiasSemLeitura !== null) {
      if (motoDiasSemLeitura >= DIAS_LEMBRETE_ODOMETRO) {
        textosCriticos.push('🏍️ Moto: ' + motoDiasSemLeitura + ' dias sem bater o odômetro!');
      } else if (motoDiasSemLeitura === DIAS_LEMBRETE_ODOMETRO - 1) {
        textosAmarelos.push('🏍️ Moto: odômetro sem atualizar há ' + motoDiasSemLeitura + ' dia(s)');
      }
    }

    if (textosCriticos.length && !alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-critico');
      dot.title = textosCriticos.join(' • ') + ' (toque para adiar 30min)';
      _criticoTextos = textosCriticos;
      _criticoIdx = 0;
      dot.textContent = textosCriticos[0];
    } else if (textosCriticos.length && alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-adiado');
      dot.title = 'Adiado — ainda ativo: ' + textosCriticos.join(' • ') + ' (toque para reativar agora)';
      _criticoTextos = [];
    } else if (laranjas.length){
      var textosL = laranjas.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });
      dot.classList.add('dot-perto-laranja');
      dot.title = textosL.join(' • ');
      _criticoTextos = [];
    } else if (textosAmarelos.length){
      dot.classList.add('dot-perto-amarelo');
      dot.title = textosAmarelos.join(' • ');
      _criticoTextos = [];
    } else {
      dot.title = 'Sincronizado';
      _criticoTextos = [];
    }
  } catch (e) { /* silencioso — não atrapalha o app se essa checagem falhar */ }
}

function iniciarChecagemDataCritica(){
  var dot = document.getElementById('syncDot');
  if (dot) {
    dot.onclick = function(){
      if (dot.classList.contains('dot-critico')){
        adiarAlertaCritico(_criticoTextos);
        verificarDataCriticaGlobal();
      } else if (dot.classList.contains('dot-adiado')){
        limparAdiamento();
        verificarDataCriticaGlobal();
      }
    };
    dot.style.cursor = 'pointer';
  }
  verificarDataCriticaGlobal();
  setInterval(verificarDataCriticaGlobal, 30000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) verificarDataCriticaGlobal();
  });
}

const docNovo = doc(db, "william", "prefeitura_data");

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function abrirRetratoDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('william_retratos', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('retratos'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
async function salvarRetratoLocal(conteudo){
  try{
    var db2 = await abrirRetratoDB();
    var hoje = new Date().toISOString().slice(0,10);
    var chave = 'prefeitura_' + hoje;
    var tx = db2.transaction('retratos','readwrite');
    tx.objectStore('retratos').put({ data: hoje, savedAt: new Date().toISOString(), conteudo: conteudo }, chave);
    var getAllReq = tx.objectStore('retratos').getAllKeys();
    getAllReq.onsuccess = function(){
      var limite = new Date(); limite.setDate(limite.getDate()-30);
      getAllReq.result.forEach(function(k){
        if(typeof k==='string' && k.indexOf('prefeitura_')===0){
          var dataK = new Date(k.replace('prefeitura_',''));
          if(dataK < limite) tx.objectStore('retratos').delete(k);
        }
      });
    };
  }catch(e){ console.warn('Retrato local falhou (não crítico):', e); }
}

function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var conteudo = window.__prefeituraGetData ? window.__prefeituraGetData() : null;
      if(!conteudo) return;
      conteudo.savedAt = new Date().toISOString();
      await setDoc(docNovo, conteudo);
      await salvarRetratoLocal(conteudo);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Prefeitura:', e);
      setDot('#c94f4f');
    }
  }, 800);
}
window.__prefeituraAoSalvar = agendarPush;

function iniciarEscuta(){
  onSnapshot(docNovo, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = window.__prefeituraGetData ? window.__prefeituraGetData() : null;
    if(!local) return;
    if(JSON.stringify(local) === JSON.stringify(remoto)) return;
    aplicandoRemoto = true;
    if(window.__prefeituraSetDataRemoto) window.__prefeituraSetDataRemoto(remoto);
    salvarRetratoLocal(remoto);
    aplicandoRemoto = false;
    setDot('#3fae5c');
  }, function(err){
    console.error('Erro de sincronização (Prefeitura):', err);
    setDot('#c94f4f');
  });
}

async function migrarSeNecessario(){
  var snapNovo = await getDoc(docNovo);
  if(snapNovo.exists()) return;
  try{
    var conteudo = window.__prefeituraGetData ? window.__prefeituraGetData() : { plantoes: [], docs: {} };
    conteudo.savedAt = new Date().toISOString();
    await setDoc(docNovo, conteudo);
  }catch(e){ console.error('Erro na configuração inicial da Prefeitura:', e); }
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('codigoAcesso').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('codigoAcesso').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });
if(window.anexarMicrofone) window.anexarMicrofone(document.getElementById('codigoAcesso'));

onAuthStateChanged(auth, async function(user){
  if(user && user.email === ALLOWED_EMAIL){
    esconderLogin();
    if(!jaMigrou){
      jaMigrou = true;
      await migrarSeNecessario();
      iniciarEscuta();
      iniciarChecagemDataCritica();
    }
  } else {
    mostrarLogin();
  }
});
</script>
