<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>William · Onde Está</title>
<style>
  :root{
    --bg:#0c0c0d; --panel:#17171a; --panel2:#1d1d21; --border:#2a2a30;
    --gold:#c9a24b; --gold-dim:#8a7538; --text:#ece7dc; --text-dim:#8a8578; --red:#c94f4f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; padding-bottom:50px;
  }
  .topbar{
    background:#111114; border-bottom:1px solid var(--border); padding:14px 16px;
    display:flex; align-items:center; justify-content:center; position:sticky; top:0; z-index:50;
  }
  .topbar h1{ margin:0; font-size:16px; }
  #lockBtn{ position:absolute; right:14px; background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer; }
  .container{ max-width:460px; margin:0 auto; padding:16px; }

  /* ---- Tela de bloqueio (login + pin) ---- */
  .lock-screen{
    position:fixed; inset:0; background:var(--bg); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lock-box{ width:100%; max-width:340px; text-align:center; }
  .lock-box h2{ margin:0 0 4px; font-size:20px; }
  .lock-box p{ font-size:13px; color:var(--text-dim); margin-bottom:20px; }
  .lock-box input{
    width:100%; text-align:center; letter-spacing:8px; font-size:22px;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:14px; margin-bottom:14px; font-family:inherit;
  }
  .lock-box button.lock-confirm{
    width:100%; background:var(--gold); color:#111; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px;
  }
  .lock-error{ color:var(--red); font-size:12px; min-height:16px; margin-bottom:8px; }
  .lock-forgot{ color:var(--text-dim); font-size:11px; text-decoration:underline; cursor:pointer; }

  /* ---- Busca ---- */
  .search-wrap{ position:sticky; top:57px; z-index:9; background:var(--bg); padding-bottom:10px; }
  .search-box{
    width:100%; background:var(--panel); border:1px solid var(--gold-dim); color:var(--text);
    border-radius:14px; padding:14px 16px; font-size:16px; font-family:inherit;
  }
  .search-box::placeholder{ color:var(--text-dim); }

  .add-btn{
    width:100%; background:var(--panel2); border:1px dashed var(--gold-dim); color:var(--gold);
    border-radius:12px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:14px;
  }

  .results-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .result-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:12px; cursor:pointer;
  }
  .result-thumb{
    background:var(--panel2); border:1px dashed var(--border); border-radius:10px;
    height:44px; display:flex; align-items:center; justify-content:center;
    font-size:22px; margin-bottom:8px;
  }
  .result-title{ font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px; line-height:1.3; }
  .result-chip{
    display:inline-block; font-size:10px; background:#241d0e; color:var(--gold);
    padding:2px 8px; border-radius:20px; margin:2px 3px 0 0; font-weight:700;
  }
  .empty-state{ text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0; }

  /* ---- Detalhe do item ---- */
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{ background:none; border:none; color:var(--gold); font-size:22px; cursor:pointer; padding:4px 8px; }
  .title-input{
    flex:1; background:none; border:none; border-bottom:1px solid var(--border);
    color:var(--gold); font-size:19px; font-weight:800; padding:6px 2px; font-family:inherit;
  }

  .block{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  .block-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold-dim); margin-bottom:6px; font-weight:700; }
  .block textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; min-height:44px; resize:vertical;
  }
  .block-view{
    min-height:22px; font-size:14px; line-height:1.6; color:var(--text);
    padding:10px 12px; background:var(--panel2); border:1px solid var(--border);
    border-radius:10px; cursor:text; white-space:pre-wrap; word-break:break-word;
  }
  .block-view:empty::before{ content: attr(data-placeholder); color:var(--text-dim); }
  .link-inline{
    display:inline-flex; align-items:center; gap:3px; background:#241d0e; color:var(--gold);
    padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700; text-decoration:none;
  }

  .instr-section-title{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:20px 0 8px; font-weight:700; }
  .instr-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; position:relative; }
  .instr-card input.instr-title{
    font-weight:700; color:var(--gold); margin-bottom:8px; background:none; width:calc(100% - 30px);
    border:none; border-bottom:1px solid var(--border); border-radius:0; padding:4px 0; font-size:15px; font-family:inherit;
  }
  .instr-card textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; min-height:44px; resize:vertical;
  }
  .remove-instr{ position:absolute; top:12px; right:12px; background:none; border:none; color:var(--red); font-size:16px; cursor:pointer; }
  .add-instr-btn{
    width:100%; background:var(--panel2); border:1px dashed var(--gold-dim); color:var(--gold);
    border-radius:12px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px;
  }

  .delete-item-btn{
    width:100%; background:none; border:1px solid var(--red); color:var(--red);
    border-radius:12px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; margin-top:22px;
  }

  .fab-search{
    position:fixed; bottom:24px; right:20px; z-index:100;
    background:var(--gold); color:#111; border:none; border-radius:50px;
    padding:14px 20px; font-size:14px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.45); display:flex; align-items:center; gap:6px;
  }
  .fab-search:active{ transform:scale(0.95); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🔎 WILLIAM — ONDE ESTÁ</h1>
  <button id="lockBtn" title="Bloquear">🔒</button>
</div>

<div class="lock-screen" id="loginScreen">
  <div class="lock-box">
    <h2>🔎 WILLIAM</h2>
    <p>Acesso restrito — entre com sua senha (só uma vez neste aparelho)</p>
    <input type="text" id="campoAcesso1" placeholder="Senha" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc;">
    <div class="lock-error" id="loginError"></div>
    <button class="lock-confirm" id="loginConfirmBtn">Entrar</button>
  </div>
</div>

<div class="lock-screen" id="lockScreen" style="display:none;">
  <div class="lock-box">
    <h2>🔎 WILLIAM</h2>
    <p id="lockLabel">Crie um PIN de acesso (4 a 6 dígitos)</p>
    <input type="text" id="campoAcesso2" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-align:center;letter-spacing:8px;font-size:22px;-webkit-text-security:disc;">
    <div class="lock-error" id="lockError"></div>
    <button class="lock-confirm" id="lockConfirmBtn">Confirmar</button>
    <div class="lock-forgot" id="lockForgotLink">Esqueci o PIN</div>
  </div>
</div>

<div id="appWrap" style="display:none;">
<div class="container">

  <div id="viewList">
    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="Digite qualquer coisa: pilha, quando, como...">
    </div>
    <button class="add-btn" id="addItemBtn">+ Novo item</button>
    <div id="results"></div>
  </div>

  <div id="viewDetail" style="display:none;">
    <div class="back-row">
      <button class="back-btn" id="backBtn">‹</button>
      <input type="text" class="title-input" id="detailTitulo" placeholder="Título do item (ex: Ar-condicionado da sala)">
    </div>

    <div class="block">
      <div class="block-label">📍 Onde</div>
      <div class="block-view" data-bloco-view="onde" data-placeholder="Onde está guardado / localizado..."></div>
      <textarea data-bloco="onde" style="display:none;" placeholder="Onde está guardado / localizado..."></textarea>
    </div>
    <div class="block">
      <div class="block-label">📅 Quando</div>
      <div class="block-view" data-bloco-view="quando" data-placeholder="Datas importantes: compra, instalação, validade..."></div>
      <textarea data-bloco="quando" style="display:none;" placeholder="Datas importantes: compra, instalação, validade..."></textarea>
    </div>
    <div class="block">
      <div class="block-label">🧾 Compra</div>
      <div class="block-view" data-bloco-view="compra" data-placeholder="Loja, preço, nota fiscal, garantia..."></div>
      <textarea data-bloco="compra" style="display:none;" placeholder="Loja, preço, nota fiscal, garantia..."></textarea>
    </div>
    <div class="block">
      <div class="block-label">👤 Contato</div>
      <div class="block-view" data-bloco-view="contato" data-placeholder="Técnico, vendedor, suporte..."></div>
      <textarea data-bloco="contato" style="display:none;" placeholder="Técnico, vendedor, suporte..."></textarea>
    </div>
    <div class="block">
      <div class="block-label">🔑 Acesso</div>
      <div class="block-view" data-bloco-view="acesso" data-placeholder="Senha/login do próprio equipamento..."></div>
      <textarea data-bloco="acesso" style="display:none;" placeholder="Senha/login do próprio equipamento..."></textarea>
    </div>

    <div class="instr-section-title">📝 Instruções (adicione quantas quiser)</div>
    <div id="instrList"></div>
    <button class="add-instr-btn" id="addInstrBtn">+ Adicionar instrução</button>

    <button class="delete-item-btn" id="deleteItemBtn">🗑️ Excluir este item</button>
  </div>

  <button class="fab-search" id="fabSearchBtn" style="display:none;">🔍 Voltar à busca</button>

</div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'williamOndeEstaData';

  // ---------- PIN LOCAL ----------
  const LS_PIN = 'oe_pinHash';
  const SS_UNLOCKED = 'oe_unlocked';
  let pinSetupStage = 0, firstPin = '';

  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function hasPin(){ return !!localStorage.getItem(LS_PIN); }

  function showAppContent(){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    sessionStorage.setItem(SS_UNLOCKED, '1');
    renderList();
  }
  function showLockScreen(){
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('lockScreen').style.display = 'flex';
    pinSetupStage = 0; firstPin = '';
    document.getElementById('lockLabel').textContent = hasPin() ? 'Digite seu PIN' : 'Crie um PIN de acesso (4 a 6 dígitos)';
    document.getElementById('lockForgotLink').style.display = hasPin() ? 'block' : 'none';
    document.getElementById('lockError').textContent = '';
    document.getElementById('campoAcesso2').value = '';
    document.getElementById('campoAcesso2').focus();
  }
  async function handleLockConfirm(){
    const val = document.getElementById('campoAcesso2').value.trim();
    const errEl = document.getElementById('lockError');
    errEl.textContent = '';
    if(val.length < 4){ errEl.textContent = 'PIN deve ter ao menos 4 dígitos.'; return; }
    if(!hasPin()){
      if(pinSetupStage === 0){
        firstPin = val; pinSetupStage = 1;
        document.getElementById('lockLabel').textContent = 'Confirme o PIN';
        document.getElementById('campoAcesso2').value = ''; document.getElementById('campoAcesso2').focus();
        return;
      } else {
        if(val !== firstPin){
          errEl.textContent = 'PINs não coincidem. Tente novamente.';
          pinSetupStage = 0; firstPin = '';
          document.getElementById('lockLabel').textContent = 'Crie um PIN de acesso (4 a 6 dígitos)';
          document.getElementById('campoAcesso2').value = ''; return;
        }
        localStorage.setItem(LS_PIN, await sha256(val));
        showAppContent();
        return;
      }
    } else {
      if(await sha256(val) === localStorage.getItem(LS_PIN)){ showAppContent(); }
      else { errEl.textContent = 'PIN incorreto.'; document.getElementById('campoAcesso2').value = ''; }
    }
  }
  document.getElementById('lockConfirmBtn').addEventListener('click', handleLockConfirm);
  document.getElementById('campoAcesso2').addEventListener('keydown', function(e){ if(e.key==='Enter') handleLockConfirm(); });
  document.getElementById('lockForgotLink').addEventListener('click', function(){
    if(confirm('Isso apaga o PIN atual e permite criar um novo. Seus itens salvos não são apagados. Continuar?')){
      localStorage.removeItem(LS_PIN);
      sessionStorage.removeItem(SS_UNLOCKED);
      showLockScreen();
    }
  });
  document.getElementById('lockBtn').addEventListener('click', function(){
    sessionStorage.removeItem(SS_UNLOCKED);
    showLockScreen();
  });

  // ---------- Dados ----------
  function loadData(){
    try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : { itens: [] }; }
    catch(e){ return { itens: [] }; }
  }
  function saveLocalOnly(d){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    catch(e){ console.error('Erro ao salvar', e); }
  }
  function saveData(d){
    saveLocalOnly(d);
    if(window._oeSetDoc && window._oeDocRef && !applyingRemote){
      window._oeSetDoc(window._oeDocRef, d).catch(function(e){ console.error('Erro ao sincronizar:', e); });
    }
  }
  let data = loadData();
  let currentItemId = null;

  function novoId(){ return 'it_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

  // ---------- Motor de busca (tolerante) ----------
  const MIN_QUERY_LEN = 2;
  function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function ehSubsequencia(termo, alvo){
    let i = 0;
    for(let c of alvo){ if(i < termo.length && c === termo[i]) i++; }
    return i === termo.length;
  }
  function bate(query, texto){
    query = normalizar(query); texto = normalizar(texto||'');
    if(!query || query.length < MIN_QUERY_LEN) return false;
    if(texto.includes(query)) return true;
    return query.length >= 3 && ehSubsequencia(query, texto);
  }
  const blocoNomes = { onde:'📍 Onde', quando:'📅 Quando', compra:'🧾 Compra', contato:'👤 Contato', acesso:'🔑 Acesso' };

  function buscar(query){
    const resultados = [];
    if(!query.trim() || query.trim().length < MIN_QUERY_LEN) return resultados;
    data.itens.forEach(function(item){
      let chips = [], matched = false;
      if(bate(query, item.titulo)) matched = true;
      Object.keys(item.blocos || {}).forEach(function(key){
        if(bate(query, blocoNomes[key]) || bate(query, item.blocos[key])){ matched = true; chips.push(blocoNomes[key]); }
      });
      (item.instrucoes || []).forEach(function(instr){
        if(bate(query, instr.titulo) || bate(query, instr.texto)){ matched = true; chips.push('📝 ' + instr.titulo); }
      });
      if(matched) resultados.push({ item: item, chips: chips.slice(0,3) });
    });
    return resultados;
  }

  function renderList(){
    const query = document.getElementById('searchBox').value;
    const wrap = document.getElementById('results');
    const resultados = buscar(query);

    if(!query.trim()){
      wrap.innerHTML = '';
      return;
    }
    if(query.trim().length < 2){
      wrap.innerHTML = '<div class="empty-state">Digite mais uma letrinha...</div>';
      return;
    }
    if(resultados.length === 0){
      wrap.innerHTML = '<div class="empty-state">Nada encontrado pra "'+query+'"</div>';
      return;
    }
    let html = '<div class="results-grid">';
    resultados.forEach(function(r){
      html += '<div class="result-card" onclick="window._oeOpenItem(\''+r.item.id+'\')">' +
        '<div class="result-thumb">' + (r.item.emoji || '📦') + '</div>' +
        '<div class="result-title">' + (r.item.titulo || '(sem título)') + '</div>' +
        r.chips.map(function(c){ return '<span class="result-chip">'+c+'</span>'; }).join('') +
        '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
  }
  document.getElementById('searchBox').addEventListener('input', renderList);

  // ---------- Links automáticos (renderização limpa, com link inline) ----------
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderTextoComLinks(texto){
    const escapado = escapeHtml(texto);
    return escapado.replace(urlRegex, function(url){
      return '<a class="link-inline" href="'+url+'" target="_blank" onclick="event.stopPropagation();">🔗 Abrir</a>';
    });
  }

  function setupBlocoToggle(bloco){
    const view = document.querySelector('[data-bloco-view="'+bloco+'"]');
    const ta = document.querySelector('textarea[data-bloco="'+bloco+'"]');

    view.addEventListener('click', function(){
      view.style.display = 'none';
      ta.style.display = 'block';
      ta.focus();
    });
    ta.addEventListener('blur', function(){
      ta.style.display = 'none';
      view.style.display = 'block';
      view.innerHTML = renderTextoComLinks(ta.value);
    });
    ta.addEventListener('input', function(){
      const item = getItem(currentItemId);
      if(!item) return;
      if(!item.blocos) item.blocos = {};
      item.blocos[bloco] = this.value;
      saveData(data);
    });
  }
  ['onde','quando','compra','contato','acesso'].forEach(setupBlocoToggle);

  // ---------- Detalhe do item ----------
  function getItem(id){ return data.itens.find(function(i){ return i.id === id; }); }

  window._oeOpenItem = function(id){
    currentItemId = id;
    const item = getItem(id);
    document.getElementById('viewList').style.display = 'none';
    document.getElementById('viewDetail').style.display = 'block';
    document.getElementById('fabSearchBtn').style.display = 'flex';
    document.getElementById('detailTitulo').value = item.titulo || '';

    ['onde','quando','compra','contato','acesso'].forEach(function(b){
      const valor = (item.blocos && item.blocos[b]) || '';
      document.querySelector('textarea[data-bloco="'+b+'"]').value = valor;
      const view = document.querySelector('[data-bloco-view="'+b+'"]');
      view.innerHTML = renderTextoComLinks(valor);
      view.style.display = 'block';
      document.querySelector('textarea[data-bloco="'+b+'"]').style.display = 'none';
    });

    renderInstrucoes(item);
  };

  function voltarParaBusca(){
    document.getElementById('viewDetail').style.display = 'none';
    document.getElementById('viewList').style.display = 'block';
    document.getElementById('fabSearchBtn').style.display = 'none';
    currentItemId = null;
    renderList();
  }
  document.getElementById('fabSearchBtn').addEventListener('click', voltarParaBusca);

  document.getElementById('backBtn').addEventListener('click', function(){
    document.getElementById('viewDetail').style.display = 'none';
    document.getElementById('viewList').style.display = 'block';
    document.getElementById('fabSearchBtn').style.display = 'none';
    currentItemId = null;
    renderList();
  });

  document.getElementById('detailTitulo').addEventListener('input', function(){
    const item = getItem(currentItemId);
    if(!item) return;
    item.titulo = this.value;
    saveData(data);
  });

  document.getElementById('addItemBtn').addEventListener('click', function(){
    const titulo = prompt('Título do novo item:');
    if(!titulo || !titulo.trim()) return;
    const novo = { id: novoId(), titulo: titulo.trim(), emoji: '📦', blocos: {}, instrucoes: [] };
    data.itens.push(novo);
    saveData(data);
    window._oeOpenItem(novo.id);
  });

  document.getElementById('deleteItemBtn').addEventListener('click', function(){
    if(!confirm('Excluir este item de vez? Não tem como desfazer.')) return;
    data.itens = data.itens.filter(function(i){ return i.id !== currentItemId; });
    saveData(data);
    document.getElementById('viewDetail').style.display = 'none';
    document.getElementById('viewList').style.display = 'block';
    document.getElementById('fabSearchBtn').style.display = 'none';
    currentItemId = null;
    renderList();
  });

  // ---------- Instruções repetíveis ----------
  function renderInstrucoes(item){
    const wrap = document.getElementById('instrList');
    wrap.innerHTML = '';
    (item.instrucoes || []).forEach(function(instr){
      const card = document.createElement('div');
      card.className = 'instr-card';
      card.innerHTML =
        '<button class="remove-instr">✕</button>' +
        '<input type="text" class="instr-title" placeholder="Título (ex: Como limpar)" value="'+(instr.titulo||'').replace(/"/g,'&quot;')+'">' +
        '<div class="block-view" data-placeholder="Passo a passo..." style="display:block;"></div>' +
        '<textarea placeholder="Passo a passo..." style="display:none;">'+(instr.texto||'')+'</textarea>';

      const titleInput = card.querySelector('.instr-title');
      const textArea = card.querySelector('textarea');
      const view = card.querySelector('.block-view');

      view.innerHTML = renderTextoComLinks(instr.texto || '');
      view.addEventListener('click', function(){
        view.style.display = 'none';
        textArea.style.display = 'block';
        textArea.focus();
      });
      textArea.addEventListener('blur', function(){
        textArea.style.display = 'none';
        view.style.display = 'block';
        view.innerHTML = renderTextoComLinks(textArea.value);
      });

      titleInput.addEventListener('input', function(){ instr.titulo = this.value; saveData(data); });
      textArea.addEventListener('input', function(){ instr.texto = this.value; saveData(data); });
      card.querySelector('.remove-instr').addEventListener('click', function(){
        item.instrucoes = item.instrucoes.filter(function(x){ return x !== instr; });
        saveData(data);
        renderInstrucoes(item);
      });

      wrap.appendChild(card);
    });
  }

  document.getElementById('addInstrBtn').addEventListener('click', function(){
    const item = getItem(currentItemId);
    if(!item) return;
    if(!item.instrucoes) item.instrucoes = [];
    item.instrucoes.push({ titulo: '', texto: '' });
    saveData(data);
    renderInstrucoes(item);
  });

  // ---------- Firebase (sincronização + login por senha) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBNKjp7hLNK6mzAX2GK49WEZq-NKgQ9o5Y",
    authDomain: "williamapp-31dff.firebaseapp.com",
    projectId: "williamapp-31dff",
    storageBucket: "williamapp-31dff.firebasestorage.app",
    messagingSenderId: "171912065024",
    appId: "1:171912065024:web:9c47f66f4b8e7fc727a8e5"
  };
  const ALLOWED_EMAIL = "marcelodossantosfc@gmail.com";
  let auth = null, applyingRemote = false, unsubscribeSnapshot = null;

  function showLoginScreen(){
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  async function initFirebase(){
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js");

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    auth = authMod.getAuth(fbApp);
    const docRef = doc(db, "william", "ondeesta");

    async function tryLogin(){
      const senha = document.getElementById('campoAcesso1').value;
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginConfirmBtn');
      if(!senha){ errEl.textContent = 'Preencha a senha.'; return; }
      errEl.textContent = '';
      btn.disabled = true; btn.textContent = 'Entrando...';
      try{
        await authMod.setPersistence(auth, authMod.browserLocalPersistence);
        await authMod.signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
      }catch(e){ errEl.textContent = 'Senha incorreta.'; }
      btn.disabled = false; btn.textContent = 'Entrar';
    }
    document.getElementById('loginConfirmBtn').addEventListener('click', tryLogin);
    document.getElementById('campoAcesso1').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

    authMod.onAuthStateChanged(auth, function(user){
      if(user && user.email === ALLOWED_EMAIL){
        document.getElementById('loginScreen').style.display = 'none';

        if(!unsubscribeSnapshot){
          unsubscribeSnapshot = onSnapshot(docRef, function(snap){
            if(!snap.exists()){ setDoc(docRef, data); return; }
            const remoteStr = JSON.stringify(snap.data());
            const localStr = JSON.stringify(data);
            if(remoteStr === localStr) return;
            applyingRemote = true;
            data = snap.data();
            if(!data.itens) data.itens = [];
            saveLocalOnly(data);
            if(currentItemId && getItem(currentItemId)){
              window._oeOpenItem(currentItemId);
            } else {
              document.getElementById('viewDetail').style.display = 'none';
              document.getElementById('viewList').style.display = 'block';
              document.getElementById('fabSearchBtn').style.display = 'none';
              currentItemId = null;
            }
            renderList();
            applyingRemote = false;
          }, function(err){ console.error('Erro de sincronização (Onde Está):', err); });
        }

        if(sessionStorage.getItem(SS_UNLOCKED) === '1' && hasPin()){ showAppContent(); }
        else { showLockScreen(); }
      } else if(user && user.email !== ALLOWED_EMAIL){
        authMod.signOut(auth);
        showLoginScreen();
        document.getElementById('loginError').textContent = 'Conta não autorizada.';
      } else {
        showLoginScreen();
      }
    });

    window._oeSetDoc = setDoc;
    window._oeDocRef = docRef;
  }
  initFirebase();
})();
</script>
