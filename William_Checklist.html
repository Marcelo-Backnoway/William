<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 William Checklist</title>
<link rel="manifest" href="manifest-checklist.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }
  .topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 12px; color: #c8a96e; letter-spacing: 1px; font-weight: 700; }
  .container { padding: 10px; max-width: 480px; margin: 0 auto; }
  .card { background: #141424; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card-title { font-size: 11px; font-weight: 700; color: #c8a96e; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }

  /* SYNC DOT + PULSO (padrão do ecossistema) */
  #syncDot { position: fixed; bottom: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: #555; z-index: 998; transition: background 0.3s; cursor: pointer; }
  @keyframes pulsoCriticoGrande {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,34,34,0.85), 0 0 22px 6px rgba(255,34,34,0.9); transform: translate(-50%, -50%) scale(1); }
    50% { box-shadow: 0 0 0 18px rgba(255,34,34,0), 0 0 32px 10px rgba(255,34,34,0.55); transform: translate(-50%, -50%) scale(1.035); }
  }
  #syncDot.dot-critico {
    position: fixed !important; top: 50%; left: 50%; right: auto; bottom: auto;
    transform: translate(-50%, -50%);
    width: auto !important; height: auto !important; min-width: 260px; max-width: calc(100vw - 40px);
    border-radius: 16px; background: #ff2222 !important;
    padding: 18px 26px; z-index: 9999; margin: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #fff; text-align: center;
    line-height: 1.3; white-space: normal; cursor: pointer;
    animation: pulsoCriticoGrande 1s ease-in-out infinite;
  }
  #syncDot.dot-perto-laranja { box-shadow: 0 0 0 4px rgba(255,153,68,0.65); }
  #syncDot.dot-perto-amarelo { box-shadow: 0 0 0 4px rgba(232,197,71,0.6); }
  #syncDot.dot-adiado { box-shadow: 0 0 0 4px rgba(150,150,190,0.55); }

  /* LOGIN */
  #loginOverlay { position: fixed; inset: 0; background: #0a0a14; z-index: 2000; display: flex; align-items: center; justify-content: center; }
  #loginBox { background: #141424; border: 1px solid #2a2a3a; border-radius: 16px; padding: 28px 24px; width: 90%; max-width: 320px; text-align: center; }
  #loginBox h2 { font-size: 14px; color: #c8a96e; margin-bottom: 16px; letter-spacing: 1px; }
  #loginBox input { width: 100%; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 12px; font-size: 15px; color: #e8e8e8; outline: none; margin-bottom: 10px; font-family: inherit; }
  #loginBox button { width: 100%; background: #c8a96e; color: #111; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #loginErro { color: #ff5555; font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* PERGUNTA DIÁRIA */
  .moto-pergunta { background: linear-gradient(135deg,#1a1a3a,#141428); border: 1px solid #4a4a8a; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .moto-pergunta-titulo { font-size: 16px; font-weight: 700; color: #b7a6ff; margin-bottom: 14px; text-align: center; }
  .moto-pergunta-btns { display: flex; gap: 10px; }
  .moto-pergunta-btns button { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .moto-btn-sim { background: #2d6a4f; color: #b7e6c9; }
  .moto-btn-nao { background: #2a2a3a; color: #ccc; }
  .moto-respondido { background: #0f1a14; border: 1px solid #2d6a4f; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .moto-respondido-txt { font-size: 13px; color: #b7e6c9; }
  .moto-refazer { background: none; border: none; color: #888; font-size: 12px; text-decoration: underline; cursor: pointer; font-family: inherit; }

  .moto-percurso-label { font-size: 12px; color: #888; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .moto-percurso-row { display: flex; gap: 8px; }
  .moto-percurso-row input { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 13px; font-size: 15px; color: #e8e8e8; outline: none; font-family: inherit; }

  .moto-sugestao { background: #241d10; border: 1px solid #c8a96e; border-radius: 12px; padding: 14px; margin-top: 14px; }
  .moto-sugestao-txt { font-size: 14px; color: #e8c96e; margin-bottom: 12px; line-height: 1.4; }

  .moto-km-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  @media (max-width: 380px) { .moto-km-grid { grid-template-columns: 1fr; } }
  .moto-km-box { background: #0f0f1e; border: 2px solid #333; border-radius: 14px; padding: 14px; text-align: center; }
  .moto-km-box.inicio { border-color: #74c69d; }
  .moto-km-box.fim { border-color: #ff9944; }
  .moto-km-box label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }
  .moto-km-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 26px; font-weight: 800; text-align: center; outline: none; font-family: inherit; }
  .moto-km-box input::placeholder { color: #444; font-size: 18px; }

  .moto-btn-registrar { width: 100%; background: #c8a96e; color: #111; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .moto-btn-cancelar { width: 100%; background: none; border: none; color: #888; font-size: 13px; padding: 10px; cursor: pointer; font-family: inherit; }

  /* ODÔMETRO */
  .odo-card { background: linear-gradient(135deg,#151530,#0f0f1e); border: 1px solid #2a2a3a; border-radius: 14px; padding: 16px 14px; margin-bottom: 14px; text-align: center; }
  .odo-emoji { font-size: 30px; margin-bottom: 4px; }
  .odo-input-row { display: flex; gap: 8px; margin: 10px 0; }
  .odo-input-row input { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 12px 10px; font-size: 18px; font-weight: 700; color: #e8e8e8; outline: none; font-family: inherit; text-align: center; }
  .odo-btn { width: 100%; background: #2a2a55; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; color: #b7a6ff; cursor: pointer; font-family: inherit; }
  .odo-status { font-size: 12px; color: #888; margin-top: 10px; }
  .odo-gauge-track { width: 100%; height: 10px; border-radius: 6px; background: #1a1a2e; margin-top: 10px; overflow: hidden; }
  .odo-gauge-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
  .odo-gauge-fill.verde { background: #74c69d; }
  .odo-gauge-fill.amarelo { background: #e8c547; }
  .odo-gauge-fill.vermelho { background: #ff5555; }
  .odo-msg { font-size: 13px; font-weight: 700; margin-top: 8px; }
  .odo-msg.verde { color: #74c69d; }
  .odo-msg.amarelo { color: #e8c547; }
  .odo-msg.vermelho { color: #ff5555; }

  /* MICROFONE */
  button.mic-btn { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #333; background: #1a1a2e; color: #e8e8e8; font-size: 17px; cursor: pointer; }

  /* TROCA DE ÓLEO */
  .moto-item { padding: 10px 12px; background: #0f0f1e; border-radius: 10px; margin-bottom: 7px; border: 1px solid #2a2a3a; }
  .moto-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .moto-numero { font-size: 13px; font-weight: 700; color: #87CEFA; }
  .moto-del { color: #444; font-size: 16px; cursor: pointer; padding: 2px 4px; }
  .moto-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .moto-field { flex: 1; }
  .moto-field label { font-size: 9px; color: #666; display: block; margin-bottom: 2px; text-transform: uppercase; }
  .moto-field input { width: 100%; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 7px 8px; font-size: 12px; color: #e8e8e8; outline: none; font-family: inherit; }
  .moto-field input:focus { border-color: #c8a96e; }
  .moto-proxima { font-size: 11px; color: #74c69d; font-weight: 700; margin-top: 2px; }
  .moto-btn-add { width: 100%; background: #c8a96e; color: #111; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }

  /* CONFERÊNCIAS */
  .conf-linha { display: flex; justify-content: space-between; padding: 8px 10px; background: #0f0f1e; border-radius: 8px; margin-bottom: 6px; border: 1px solid #2a2a3a; }
  .conf-data { font-size: 11px; color: #888; }
  .conf-dif { font-size: 12px; font-weight: 700; }

  /* ITINERÁRIOS APRENDIDOS — sempre visíveis */
  .itin-card { background: #0f0f1e; border: 1px solid #2a2a3a; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .itin-desc { font-size: 13px; color: #e8e8e8; margin-bottom: 4px; }
  .itin-meta { display: flex; justify-content: space-between; align-items: center; }
  .itin-nivel { font-size: 11px; color: #888; }
  .itin-media { font-size: 15px; font-weight: 800; color: #74c69d; }
  .itin-acoes { display: flex; gap: 10px; margin-top: 8px; }
  .itin-acoes button { background: none; border: none; font-size: 12px; color: #888; cursor: pointer; font-family: inherit; padding: 0; }
  .itin-vazio { text-align: center; color: #555; font-size: 13px; padding: 20px 0; }

  /* LISTA DE ITINERÁRIOS NA TELA "VOU SAIR AGORA" */
  .moto-lista-item { background: #0f0f1e; border: 2px solid #2a2a3a; border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .moto-lista-item.selecionado { border-color: #c8a96e; background: #1e1a10; }
  .moto-lista-seg { font-size: 14px; color: #e8e8e8; margin-bottom: 4px; }
  .moto-lista-meta { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
  .moto-lista-km { font-weight: 700; color: #74c69d; }

  .toggle-secao { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; color: #c8a96e; font-weight: 700; text-align: center; }

  /* CHECKLIST */
  .chk-item { background: #0f0f1e; border: 2px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .chk-item.chk-ok { border-color: #2d6a4f; background: #0f1a14; }
  .chk-item.chk-alerta { border-color: #ff5555; background: #1a0f0f; }
  .chk-item.chk-sem-foto { border-style: dashed; border-color: #c8a96e; }
  .chk-selo-verificado { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; color: #7fd4a0; background: #10241e; border: 1px solid #2a6a4a; border-radius: 6px; padding: 2px 7px; }
  .chk-selo-sem-foto { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; color: #e8c96e; background: #241d10; border: 1px solid #c8a96e; border-radius: 6px; padding: 2px 7px; }
  .chk-item-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chk-item-nome { font-size: 16px; font-weight: 700; color: #e8e8e8; }
  .chk-item-hora { font-size: 12px; color: #888; }
  .chk-btns-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .chk-btns-row button { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #1a1a2e; color: #888; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .chk-btn-ok.ativo { background: #2d6a4f; border-color: #2d6a4f; color: #b7e6c9; }
  .chk-btn-alerta.ativo { background: #6a2a2a; border-color: #ff5555; color: #ffb7b7; }
  .chk-obs-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .chk-obs-row input { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 11px; font-size: 13px; color: #e8e8e8; outline: none; font-family: inherit; }
  .chk-foto-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chk-btn-foto { flex: 1; background: #2a2a55; border: none; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 700; color: #b7a6ff; cursor: pointer; font-family: inherit; }
  .chk-foto-tag { background: #241d10; border: 1px solid #c8a96e; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; color: #e8c96e; }
  .chk-btn-foto-mini { background: none; border: none; color: #888; font-size: 11px; text-decoration: underline; cursor: pointer; font-family: inherit; }
  .chk-obs-leitura { font-size: 13px; color: #ccc; margin-bottom: 6px; }
  .chk-edit-linha { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .chk-edit-linha input { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 9px; font-size: 13px; color: #e8e8e8; outline: none; font-family: inherit; }
  .chk-edit-del { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px 8px; }
  .chk-select-data { width: 100%; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 11px; font-size: 13px; color: #e8e8e8; outline: none; font-family: inherit; margin-bottom: 12px; }
  .chk-foto-dica { font-size: 12px; color: #666; font-style: italic; }
.chk-link-drive{display:inline-block;margin-top:6px;color:#7fd4a0;font-size:13px;text-decoration:none;border:1px solid #2a6a4a;border-radius:8px;padding:6px 10px}
.chk-link-drive:active{background:#10241e}
.chk-overlay-escolha{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.chk-caixa-escolha{background:#141428;border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.chk-escolha-titulo{font-size:16px;font-weight:600;margin-bottom:14px;color:#fff}
.chk-escolha-lista{display:flex;flex-direction:column;gap:8px}
.chk-escolha-item{background:#1e2140;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;text-align:left;font-size:15px}
.chk-escolha-item:active{background:#2a2d55}
.chk-escolha-cancelar{width:100%;margin-top:14px;background:transparent;color:#999;border:1px solid #333;border-radius:10px;padding:10px}
</style>
</head>
<body>

<div class="topbar"><h1>📋 WILLIAM — CHECKLIST</h1></div>
<div id="syncDot" title="Sincronizado"></div>

<div id="loginOverlay">
  <div id="loginBox">
    <h2>🔒 ACESSO RESTRITO</h2>
    <input type="text" id="loginPass" placeholder="Senha" style="-webkit-text-security: disc;">
    <button id="loginBtn">Entrar</button>
    <div id="loginErro"></div>
  </div>
</div>

<div class="container" id="main"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw-checklist.js').catch(function(e){ console.error('Erro ao registrar service worker:', e); });
  });
}

var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — dados ficam sincronizados
var server = null; // sem conceito de servidor aqui — Moto é vida real, não jogo

// ══════════════════════════════════════════════════════
// UPLOAD AUTOMÁTICO DE FOTOS PARA O DRIVE (via Apps Script)
// ══════════════════════════════════════════════════════
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzYoTJ5K1Kfo3eWaMomQR-lI5PctlT_rVAg4SF8-z6K7D-JjbGBuxd-jndh0Zk67q-/exec';
var uploadStatus = {}; // { itemId: {enviando:true, progresso:'2/5'} } — não persiste, só controla a tela

// Nome exato da pasta no Drive pra cada item do checklist (bate com o que já existe em Checklist_BAHIA)
var PASTA_POR_ITEM = {
  portao: 'Cadeado',
  sala1: 'Sala_1',
  sala2: 'Sala_2',
  sala3: 'Sala_3',
  sala4: 'Sala_4',
  sala5: 'Sala_5',
  artes: 'Sala_Artes',
  deficientes: 'Sala_R_Multif_',
  refeitorio: 'Refeitorio',
  banheiro_adapt: 'Banheiro_Adaptado',
  portao_areia: 'Parque_Areia',
  quadra_chaves: 'Quadra_de_Chaves' // ainda não existe no Drive — o Apps Script cria sozinho na primeira foto
};
function nomePastaDoItem(it){
  return PASTA_POR_ITEM[it.id] || removerAcentos(it.nome).replace(/\s+/g,'_');
}

var MESES_PASTA = ['01_Janeiro','02_Fevereiro','03_Março','04_Abril','05_Maio','06_Junho','07_Julho','08_Agosto','09_Setembro','10_Outubro','11_Novembro','12_Dezembro'];
function caminhoPastaPorData(dsISO, it){
  var partes = dsISO.split('-'); // ['2026','08','24']
  var mesIdx = parseInt(partes[1], 10) - 1;
  var dia = partes[2];
  return [ MESES_PASTA[mesIdx], dia, nomePastaDoItem(it) ];
}

function linkBuscaDrivePasta(it){
  // fallback só usado em registros antigos que não têm pastaLink salvo
  return 'https://drive.google.com/drive/search?q=' + encodeURIComponent(nomePastaDoItem(it));
}

function removerAcentos(str){
  return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function letraDaSequencia(idx){
  // 0 -> A, 1 -> B ... 25 -> Z, 26 -> AA, 27 -> AB ...
  var letras = ''; var n = idx + 1;
  while (n > 0) {
    var resto = (n - 1) % 26;
    letras = String.fromCharCode(65 + resto) + letras;
    n = Math.floor((n - 1) / 26);
  }
  return letras;
}
function arquivoParaBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function subirFotoParaWilliam(pastaCaminho, nomeArquivo, base64Data, mimeType){
  // Content-Type text/plain evita o preflight CORS que o Apps Script não trata bem
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ pastaCaminho: pastaCaminho, fileName: nomeArquivo, base64Data: base64Data, mimeType: mimeType })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (!res.sucesso) throw new Error(res.erro || 'erro desconhecido');
    return res;
  });
}
function abrirCameraParaItem(ds, it){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment'; input.multiple = true;
  input.style.display = 'none';
  input.addEventListener('change', function(){
    enviarFotosItem(ds, it, input.files);
    document.body.removeChild(input);
  });
  document.body.appendChild(input);
  input.click();
}

// ══════════════════════════════════════════════════════
// RECEBER FOTOS COMPARTILHADAS DA GALERIA (Web Share Target)
// ══════════════════════════════════════════════════════
function verificarFotosCompartilhadas(){
  var params = new URLSearchParams(window.location.search);
  if (params.get('compartilhado') !== '1') return;

  // limpa o parâmetro da URL pra não repetir se a pessoa atualizar a página
  window.history.replaceState({}, '', window.location.pathname);

  if (!('caches' in window)) return;

  caches.open('checklist-compartilhado').then(function(cache){
    return cache.keys().then(function(chaves){
      var chavesFotos = chaves.filter(function(req){ return req.url.indexOf('__compartilhado-foto-') !== -1; });
      if (chavesFotos.length === 0) return;

      Promise.all(chavesFotos.map(function(req){
        return cache.match(req).then(function(resp){ return resp.blob(); });
      })).then(function(blobs){
        chavesFotos.forEach(function(req){ cache.delete(req); });
        mostrarEscolhaDeAmbiente(blobs);
      });
    });
  });
}

function mostrarEscolhaDeAmbiente(blobs){
  var itens = getChecklistItens();
  var ds = checklistHojeStr();

  var overlay = document.createElement('div');
  overlay.className = 'chk-overlay-escolha';

  var caixa = document.createElement('div');
  caixa.className = 'chk-caixa-escolha';
  caixa.appendChild(el('div','chk-escolha-titulo', '📷 '+blobs.length+' foto(s) recebida(s) — de qual ambiente?'));

  var lista = document.createElement('div');
  lista.className = 'chk-escolha-lista';
  itens.forEach(function(it){
    var btn = document.createElement('button');
    btn.className = 'chk-escolha-item';
    btn.textContent = it.nome;
    btn.onclick = function(){
      document.body.removeChild(overlay);
      enviarFotosItem(ds, it, blobs);
    };
    lista.appendChild(btn);
  });
  caixa.appendChild(lista);

function esperar(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}
async function subirComRetentativa(pastaCaminho, nomeArquivo, base64, mimeType, tentativas){
  var ultimoErro;
  for (var t = 1; t <= tentativas; t++) {
    try {
      return await subirFotoParaWilliam(pastaCaminho, nomeArquivo, base64, mimeType);
    } catch(e) {
      ultimoErro = e;
      if (t < tentativas) await esperar(Math.min(1500 * t, 6000)); // espera mais a cada nova tentativa, até um teto de 6s
    }
  }
  throw ultimoErro;
}
async function enviarFotosItem(ds, it, files){
  if (!files || files.length === 0) return;
  var d = getChecklistDia(ds)[it.id] || { ok:null, obs:'', fotoNumero:null, fotosEnviadas:0, hora:null, pastaLink:null };
  var numero = d.fotoNumero;
  if (!numero) { numero = reservarNumeroFoto(); setChecklistItemDia(ds, it.id, {fotoNumero:numero}); }
  var jaEnviadas = d.fotosEnviadas || 0;
  var nomeAmbiente = nomePastaDoItem(it);
  var caminho = caminhoPastaPorData(ds, it);

  uploadStatus[it.id] = { enviando:true, progresso: '0/'+files.length };
  render();

  var sucesso = 0;
  var linkPasta = d.pastaLink || null;
  for (var i = 0; i < files.length; i++) {
    uploadStatus[it.id].progresso = (i+1)+'/'+files.length;
    render();
    try {
      var letra = letraDaSequencia(jaEnviadas + sucesso);
      var nomeArquivo = numero + letra + '_' + nomeAmbiente.replace(/\s+/g,'') + '.jpg';
      var base64 = await arquivoParaBase64(files[i]);
      var resposta = await subirComRetentativa(caminho, nomeArquivo, base64, files[i].type || 'image/jpeg', 5);
      linkPasta = resposta.pastaLink || linkPasta;
      sucesso++;
    } catch(e) {
      console.error('Falha ao enviar foto (após tentativas automáticas):', e);
      alert('Não consegui enviar uma foto de "'+it.nome+'" mesmo após tentar 5 vezes — parece ser instabilidade de conexão. As demais fotos continuam sendo enviadas; essa aqui você pode reenviar depois compartilhando de novo pra esse ambiente.');
    }
  }

  delete uploadStatus[it.id];
  setChecklistItemDia(ds, it.id, { fotoNumero:numero, fotosEnviadas: jaEnviadas + sucesso, pastaLink: linkPasta });
  vibe([30]);
  render();
}

/* ---------- MICROFONE REUTILIZÁVEL ---------- */
function anexarMicrofone(inputEl, opts){
  opts = opts || {};
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mic-btn';
  btn.textContent = '🎤'; btn.title = 'Falar';
  inputEl.parentNode.appendChild(btn);
  if(!Rec){ btn.style.display='none'; return btn; }
  var rec = new Rec();
  rec.lang = 'pt-BR'; rec.continuous = false; rec.interimResults = false;
  btn.addEventListener('click', function(){
    btn.style.background = '#c8a96e'; btn.style.color = '#111'; btn.textContent = '●';
    try{ rec.start(); }catch(e){}
  });
  rec.onresult = function(e){
    inputEl.value = e.results[0][0].transcript;
    inputEl.dispatchEvent(new Event('input', {bubbles:true}));
    inputEl.dispatchEvent(new Event('change', {bubbles:true}));
    if(opts.onDone) opts.onDone();
  };
  rec.onend = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  rec.onerror = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  return btn;
}

var CHECKLIST_ITENS_DEFAULT = [
  {id:'portao', nome:'Portão'},
  {id:'sala1', nome:'Sala 1'},
  {id:'sala2', nome:'Sala 2'},
  {id:'sala3', nome:'Sala 3'},
  {id:'sala4', nome:'Sala 4'},
  {id:'sala5', nome:'Sala 5'},
  {id:'artes', nome:'Sala de Artes'},
  {id:'deficientes', nome:'Sala Recursos Multif.'},
  {id:'refeitorio', nome:'Refeitório'},
  {id:'banheiro_adapt', nome:'Banheiro Adaptado'},
  {id:'portao_areia', nome:'Portão Parque de Areia'},
  {id:'quadra_chaves', nome:'Quadra de Chaves'}
];
function getChecklistItens(){
  var s = loadState();
  if (!s.checklistItens) { s.checklistItens = CHECKLIST_ITENS_DEFAULT.slice(); saveState(s); }
  var mudou = false;
  s.checklistItens.forEach(function(it){
    if (it.id === 'deficientes' && it.nome !== 'Sala Recursos Multif.') { it.nome = 'Sala Recursos Multif.'; mudou = true; }
    if (it.id === 'sala2' && it.nome !== 'Sala 2') { it.nome = 'Sala 2'; mudou = true; }
  });
  var ids = s.checklistItens.map(function(it){ return it.id; });
  [
    {id:'sala1', nome:'Sala 1'},
    {id:'refeitorio', nome:'Refeitório'},
    {id:'banheiro_adapt', nome:'Banheiro Adaptado'},
    {id:'portao_areia', nome:'Portão Parque de Areia'},
    {id:'quadra_chaves', nome:'Quadra de Chaves'}
  ].forEach(function(novo){
    if (ids.indexOf(novo.id)===-1) { s.checklistItens.push(novo); ids.push(novo.id); mudou = true; }
  });

  // Reordena em ordem cronológica (Sala 1, 2, 3...) seguindo a ordem de referência abaixo
  var ordemReferencia = ['portao','sala1','sala2','sala3','sala4','sala5','artes','deficientes','refeitorio','banheiro_adapt','portao_areia','quadra_chaves'];
  var ordemAtual = s.checklistItens.map(function(it){ return it.id; }).join('|');
  s.checklistItens.sort(function(a,b){
    var ia = ordemReferencia.indexOf(a.id); if(ia===-1) ia=999;
    var ib = ordemReferencia.indexOf(b.id); if(ib===-1) ib=999;
    return ia - ib;
  });
  if (s.checklistItens.map(function(it){ return it.id; }).join('|') !== ordemAtual) mudou = true;

  if (mudou) saveState(s);
  return s.checklistItens;
}
function setChecklistItens(itens){ var s=loadState(); s.checklistItens=itens; saveState(s); }

function getChecklistDias(){ var s=loadState(); return s.checklistDias || {}; }
function getChecklistDia(ds){
  var s = loadState();
  if (!s.checklistDias) s.checklistDias = {};
  if (!s.checklistDias[ds]) {
    s.checklistDias[ds] = {};
    saveState(s);
  }
  // garante que itens novos (cadastrados depois) apareçam também em dias já existentes
  var itens = getChecklistItens();
  var mudou = false;
  itens.forEach(function(it){
    if (!s.checklistDias[ds][it.id]) {
      s.checklistDias[ds][it.id] = { ok: null, obs: '', fotoNumero: null, hora: null };
      mudou = true;
    }
  });
  if (mudou) saveState(s);
  return s.checklistDias[ds];
}
function setChecklistItemDia(ds, itemId, dados){
  var s = loadState();
  if (!s.checklistDias) s.checklistDias = {};
  if (!s.checklistDias[ds]) s.checklistDias[ds] = {};
  var atual = s.checklistDias[ds][itemId] || { ok: null, obs: '', fotoNumero: null, fotosEnviadas: 0, hora: null, pastaLink: null };
  var novo = Object.assign({}, atual, dados, { hora: new Date().toISOString() });
  s.checklistDias[ds][itemId] = novo;
  saveState(s);
}

function proximaOcorrenciaDiasGlobal(dia, mes){
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes - 1, dia);
  data.setHours(0, 0, 0, 0);
  if (data < hoje) {
    data = new Date(anoAtual + 1, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
  }
  return Math.round((data - hoje) / 86400000);
}

// ---------- Mega-Sena / Loterias da Caixa — mesma lógica de contagem do Agenda ----------
function loteriaEhDiaSorteioGlobal(date){ var dow=date.getDay(); return dow===0||dow===2||dow===4; } // Dom, Ter, Qui
function loteriaHoraSorteioGlobal(date){ return date.getDay()===0 ? 11 : 21; }
function loteriaContagemGlobal(inicio){
  if(!inicio) return 0;
  var d=new Date(inicio+'T00:00:00');
  var agora=new Date();
  var count=0, safety=0;
  while(d<=agora && count<12 && safety<120){
    if(loteriaEhDiaSorteioGlobal(d)){
      var dtSorteio=new Date(d); dtSorteio.setHours(loteriaHoraSorteioGlobal(d),0,0,0);
      if(dtSorteio<=agora) count++;
    }
    d.setDate(d.getDate()+1); safety++;
  }
  return count;
}

function diasEntreGlobal(dataIni, dataFim){ return Math.floor((new Date(dataFim+'T00:00:00') - new Date(dataIni+'T00:00:00')) / 86400000); }
function gasDiasUsoRemoto(dadosAgenda){
  var g = dadosAgenda.gas || [];
  if (!g.length) return null;
  var x = g[0];
  var data = x.data !== undefined ? x.data : (x.inicio || x.compra);
  var duracao = x.data !== undefined ? x.duracao : (x.acabou ? diasEntreGlobal(data, x.acabou) : null);
  if (duracao !== null && duracao !== undefined) return null;
  return diasEntreGlobal(data, new Date().toISOString().split('T')[0]);
}

// ---------- Moto — km rodados desde a última troca, registrados manualmente no odômetro ----------
var KM_INTERVALO_MOTO = 2800;
var MOTO_PLANTAO_INICIO = new Date(2026,6,2);
var MOTO_FERIAS_INICIO='2026-09-28', MOTO_FERIAS_FIM='2026-10-28', MOTO_FOLGA_ESP='2026-11-19', MOTO_ANIVERSARIO='2026-11-22';
function motoIsWorkDayRemoto(date){
  var diff=Math.floor((date-MOTO_PLANTAO_INICIO)/(1000*60*60*24));
  return diff>=0 && diff%2===0;
}
function motoDiaEhTrabalhoRemoto(ds, dadosAgenda){
  var dt = new Date(ds+'T00:00:00');
  var ferias = dadosAgenda.ferias || []; var isFer = ferias.indexOf(ds)>=0;
  var isFerPer = ds>=MOTO_FERIAS_INICIO && ds<=MOTO_FERIAS_FIM;
  var isFolgaEsp = ds===MOTO_FOLGA_ESP;
  var isAniv = ds===MOTO_ANIVERSARIO;
  var overrides = dadosAgenda.diaOverride || {}; var manual = overrides[ds];
  if(isFer||isFerPer||isFolgaEsp||isAniv) return false;
  if(manual==='trabalho') return true;
  if(manual==='folga') return false;
  return motoIsWorkDayRemoto(dt);
}
var MOTO_TRABALHO_KM_REMOTO = 0.32; // 160m ida + 160m volta
function motoItinerarioMediaRemoto(it){
  if(!it || !it.medicoes || !it.medicoes.length) return null;
  var soma=it.medicoes.reduce(function(a,m){return a+m.diff;},0);
  return soma/it.medicoes.length;
}
function motoKmDoDiaRemoto(ds, dadosAgenda){
  var diario = dadosAgenda.motoDiario||{};
  var e = diario[ds];
  if(!e || e.pendente) return 0;
  var total=0;
  if (motoDiaEhTrabalhoRemoto(ds,dadosAgenda)) total += MOTO_TRABALHO_KM_REMOTO;
  if (e.resposta==='sim' && e.itinerarioId){
    var itins = dadosAgenda.motoItinerarios||{};
    var it = itins[e.itinerarioId];
    var valor = e.kmMedido !== undefined ? e.kmMedido : (it?motoItinerarioMediaRemoto(it):0);
    total += valor || 0;
  }
  return total;
}
function motoKmStatusRemoto(dadosAgenda){
  var atual = dadosAgenda.motoKmAtual;
  var historico = dadosAgenda.moto_oleo || [];
  if (!atual || !historico.length) return null;
  var diario = dadosAgenda.motoDiario || {};
  var estimado = 0;
  Object.keys(diario).forEach(function(ds){ if(ds>atual.atualizadoEm){ estimado += motoKmDoDiaRemoto(ds, dadosAgenda); } });
  return { diff: (atual.km+estimado) - historico[0].km };
}
var DIAS_LEMBRETE_ODOMETRO = 3; // dias sem atualizar o odômetro até o app cobrar (mesmo alerta do Moto)
function motoDiasSemLeituraRemoto(dadosMoto){
  var atual = dadosMoto.motoKmAtual;
  if (!atual) return null;
  return diasEntreGlobal(atual.atualizadoEm, new Date().toISOString().split('T')[0]);
}

// ---------- Contas — checa vencimento do mês real de hoje, comparando com o campo "pago" ----------
function contasVencendoRemoto(dadosAgenda){
  var hoje = new Date();
  var chave = 'contas_' + hoje.getFullYear() + '_' + hoje.getMonth();
  var contas = dadosAgenda[chave] || [];
  var diaHoje = hoje.getDate();
  var resultado = [];
  contas.forEach(function(c){
    if (c.pago || c.diaVenc === undefined) return;
    var dias = c.diaVenc - diaHoje;
    if (dias > 1) return;
    var txt;
    if (dias === 1) txt = '💳 ' + c.nome + ' vence amanhã!';
    else if (dias === 0) txt = '💳 ' + c.nome + ' vence HOJE!';
    else txt = '💳 ' + c.nome + ' venceu há ' + Math.abs(dias) + (Math.abs(dias)===1?' dia':' dias') + '!';
    resultado.push(txt);
  });
  return resultado;
}

// ---------- Ciclo de textos na barra crítica (alterna quando há mais de um alerta) ----------
var _criticoTextos = [];
var _criticoIdx = 0;
setInterval(function(){
  var dot = document.getElementById('syncDot');
  if (!dot || !dot.classList.contains('dot-critico') || _criticoTextos.length < 2) return;
  _criticoIdx = (_criticoIdx + 1) % _criticoTextos.length;
  dot.textContent = _criticoTextos[_criticoIdx];
}, 3000);

// ---------- Adiar alerta crítico (toque na barra vermelha soneca por 30min, só neste aparelho) ----------
var ALERTA_SNOOZE_KEY = 'william_alerta_critico_snooze_ate';
function getAdiamentoInfo(){
  try{
    var raw = localStorage.getItem(ALERTA_SNOOZE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || Date.now() >= obj.ate) return null;
    return obj;
  }catch(e){ return null; }
}
function alertaEstaAdiadoPara(textosCriticos){
  var info = getAdiamentoInfo();
  if(!info) return false;
  var atual = textosCriticos.slice().sort();
  var adiado = info.textos.slice().sort();
  if(atual.length !== adiado.length) return false;
  for(var i=0;i<atual.length;i++){ if(atual[i]!==adiado[i]) return false; }
  return true;
}
function adiarAlertaCritico(textosCriticos){
  localStorage.setItem(ALERTA_SNOOZE_KEY, JSON.stringify({ ate: Date.now()+30*60*1000, textos: textosCriticos||[] }));
}
function limparAdiamento(){
  localStorage.removeItem(ALERTA_SNOOZE_KEY);
}

async function verificarDataCriticaGlobal(){
  var dot = document.getElementById('syncDot');
  if (!dot) return;
  try {
    var comDias = [];
    try {
      var snap = await getDoc(doc(db, "william", "datas_data"));
      if (snap.exists()) {
        var lista = snap.data().datas_importantes || [];
        comDias = lista.map(function(d){ return { nome: d.nome, ano: d.ano, dias: proximaOcorrenciaDiasGlobal(d.dia, d.mes) }; });
      }
    } catch(e) {}

    var loteriaCount = 0;
    var gasDias = null;
    var motoStatus = null;
    var textosContas = [];
    try {
      var snapAg = await getDoc(doc(db, "william", "agenda_data"));
      if (snapAg.exists()) {
        var dadosAg = snapAg.data();
        loteriaCount = loteriaContagemGlobal(dadosAg.loteria_inicio || null);
        gasDias = gasDiasUsoRemoto(dadosAg);
        textosContas = contasVencendoRemoto(dadosAg);
      }
    } catch(e) {}
    try {
      var snapMoto = await getDoc(doc(db, "william", "moto_data"));
      if (snapMoto.exists()) {
        var dadosMoto = snapMoto.data();
        motoStatus = motoKmStatusRemoto(dadosMoto);
        var motoDiasSemLeitura = motoDiasSemLeituraRemoto(dadosMoto);
      }
    } catch(e) {}

    dot.classList.remove('dot-critico', 'dot-adiado', 'dot-perto-laranja', 'dot-perto-amarelo');
    dot.textContent = '';

    var criticos = comDias.filter(function(item){ return item.dias <= 1; }).sort(function(a,b){ return a.dias - b.dias; });
    var laranjas = comDias.filter(function(item){ return item.dias > 1 && item.dias <= 3; }).sort(function(a,b){ return a.dias - b.dias; });
    var amarelos = comDias.filter(function(item){ return item.dias > 3 && item.dias <= 10; }).sort(function(a,b){ return a.dias - b.dias; });

    var textosCriticos = criticos.map(function(item){
      var prefixo = item.ano ? '🎂 ' : '📌 ';
      return prefixo + item.nome + (item.dias === 0 ? ' é HOJE!' : ' é amanhã!');
    });
    var textosAmarelos = amarelos.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });

    if (loteriaCount >= 12) {
      textosCriticos.push('🎰 Renovar Megasena!');
    } else if (loteriaCount === 11) {
      textosAmarelos.push('🎰 Megasena: falta 1 concurso, renove em breve');
    }

    if (gasDias !== null) {
      if (gasDias >= 90) {
        textosCriticos.push('🔥 Gás: ' + gasDias + ' dias de uso, hora de trocar!');
      } else if (gasDias >= 80) {
        textosAmarelos.push('🔥 Gás: ' + gasDias + ' dias de uso, perto da troca');
      }
    }

    textosContas.forEach(function(t){ textosCriticos.push(t); });

    if (motoStatus) {
      if (motoStatus.diff >= KM_INTERVALO_MOTO) {
        textosCriticos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, hora de trocar o óleo!');
      } else if (motoStatus.diff >= KM_INTERVALO_MOTO - 200) {
        textosAmarelos.push('🏍️ Moto: ' + motoStatus.diff.toFixed(1) + ' km rodados, troca em breve');
      }
    }

    // Moto: lembrete de odômetro — mesmo alerta que aparece no próprio Moto
    if (motoDiasSemLeitura !== null && motoDiasSemLeitura !== undefined) {
      if (motoDiasSemLeitura >= DIAS_LEMBRETE_ODOMETRO) {
        textosCriticos.push('🏍️ Moto: ' + motoDiasSemLeitura + ' dias sem bater o odômetro!');
      } else if (motoDiasSemLeitura === DIAS_LEMBRETE_ODOMETRO - 1) {
        textosAmarelos.push('🏍️ Moto: odômetro sem atualizar há ' + motoDiasSemLeitura + ' dia(s)');
      }
    }

    if (textosCriticos.length && !alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-critico');
      dot.title = textosCriticos.join(' • ') + ' (toque para adiar 30min)';
      _criticoTextos = textosCriticos;
      _criticoIdx = 0;
      dot.textContent = textosCriticos[0];
    } else if (textosCriticos.length && alertaEstaAdiadoPara(textosCriticos)){
      dot.classList.add('dot-adiado');
      dot.title = 'Adiado — ainda ativo: ' + textosCriticos.join(' • ') + ' (toque para reativar agora)';
      _criticoTextos = [];
    } else if (laranjas.length){
      var textosL = laranjas.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });
      dot.classList.add('dot-perto-laranja');
      dot.title = textosL.join(' • ');
      _criticoTextos = [];
    } else if (textosAmarelos.length){
      dot.classList.add('dot-perto-amarelo');
      dot.title = textosAmarelos.join(' • ');
      _criticoTextos = [];
    } else {
      dot.title = 'Sincronizado';
      _criticoTextos = [];
    }
  } catch (e) { /* silencioso — não atrapalha o app se essa checagem falhar */ }
}

function iniciarChecagemDataCritica(){
  var dot = document.getElementById('syncDot');
  if (dot) {
    dot.onclick = function(){
      if (dot.classList.contains('dot-critico')){
        adiarAlertaCritico(_criticoTextos);
        verificarDataCriticaGlobal();
      } else if (dot.classList.contains('dot-adiado')){
        limparAdiamento();
        verificarDataCriticaGlobal();
      }
    };
    dot.style.cursor = 'pointer';
  }
  verificarDataCriticaGlobal();
  setInterval(verificarDataCriticaGlobal, 30000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) verificarDataCriticaGlobal();
  });
}

const docChecklist = doc(db, "william", "checklist_data");

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function fatiaMotoAtual(){
  var s = loadState(); var fatia = {};
  Object.keys(s).forEach(function(k){ if(pertenceAoChecklist(k)) fatia[k]=s[k]; });
  return fatia;
}
function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var fatia = fatiaMotoAtual();
      fatia.lastModified = new Date().toISOString();
      await setDoc(docChecklist, fatia);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Checklist:', e);
      setDot('#c94f4f');
    }
  }, 800);
}
function iniciarEscuta(){
  onSnapshot(docChecklist, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    // Trava de segurança: se a versão da nuvem for mais velha que a que já
    // está neste aparelho, ela é ignorada — evita que uma sincronização
    // atrasada apague marcações recentes ainda não enviadas.
    if(local.lastModified && remoto.lastModified && remoto.lastModified <= local.lastModified){
      return;
    }
    var mudou = false;
    Object.keys(remoto).forEach(function(k){
      if(pertenceAoChecklist(k) && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      aplicandoRemoto = true;
      saveState(local);
      if(typeof render === 'function') render();
      aplicandoRemoto = false;
      setDot('#3fae5c');
    }
  }, function(err){
    console.error('Erro de sincronização (Checklist):', err);
    setDot('#c94f4f');
  });
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('loginPass').value;
  var errEl = document.getElementById('loginErro');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });

onAuthStateChanged(auth, async function(user){
  if(user && user.email === ALLOWED_EMAIL){
    esconderLogin();
    if(!jaMigrou){
      jaMigrou = true;
      render();
      iniciarEscuta();
      iniciarChecagemDataCritica();
      verificarFotosCompartilhadas();
    }
  } else {
    mostrarLogin();
  }
});

var saveStateOriginal = window.saveState;
window.saveState = function(s){
  saveStateOriginal(s);
  agendarPush();
};
