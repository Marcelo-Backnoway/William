<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👤 William Personagens</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }

.topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 12px; color: #c8a96e; letter-spacing: 1px; font-weight: 700; }

.server-bar { display: flex; background: #0d0d1a; border-bottom: 1px solid #2a2a3a; position: sticky; top: 37px; z-index: 99; }
.srv-btn { flex: 1; padding: 8px 4px; text-align: center; font-size: 11px; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; color: #555; transition: all 0.2s; }
.srv-btn.active-eu       { color: #90EE90; border-color: #90EE90; background: #0f1a0f; }
.srv-btn.active-america  { color: #87CEFA; border-color: #87CEFA; background: #0f141a; }
.srv-btn.active-murica   { color: #ff9944; border-color: #ff9944; background: #1a120a; }

.container { padding: 10px; max-width: 480px; margin: 0 auto; }

/* PERSONAGENS */
.char-nav-card { background: #141424; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.char-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.char-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; background: #1a1a2e; border: 2px solid #c8a96e; color: #c8a96e; }
.char-title { flex: 1; }
.char-title .nome { font-size: 17px; font-weight: 700; color: #e8e8e8; }
.char-title .cat  { font-size: 10px; color: #888; margin-top: 2px; }
.char-counter { font-size: 11px; color: #555; }

.char-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.char-field { display: flex; align-items: center; gap: 8px; background: #0f0f1e; border-radius: 10px; padding: 10px 12px; border: 1px solid #2a2a3a; }
.char-field-label { font-size: 12px; font-weight: 700; min-width: 60px; }
.char-field-label.lv  { color: #c8a96e; }
.char-field-label.lg  { color: #87CEFA; }
.char-field-label.bk  { color: #74c69d; }
.char-field-input { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #e8e8e8; outline: none; font-family: inherit; }
.char-field-input:focus { border-color: #c8a96e; }

.char-nav-row { display: flex; gap: 6px; }
.btn-nav-char { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
.btn-nav-char:active { transform: scale(0.93); }
.btn-prev-char { background: #2a2a3a; color: #aaa; }
.btn-next-char { background: #c8a96e; color: #111; }

.add-char-card { background: #141424; border: 1px dashed #333; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.add-char-title { font-size: 12px; color: #c8a96e; font-weight: 700; margin-bottom: 10px; }
.add-field { margin-bottom: 8px; }
.add-field label { font-size: 10px; color: #666; display: block; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.add-field input, .add-field select { width: 100%; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 9px 10px; font-size: 13px; color: #e8e8e8; outline: none; font-family: inherit; }
.add-field input:focus, .add-field select:focus { border-color: #c8a96e; }
.btn-add-char { width: 100%; padding: 12px; background: #c8a96e; color: #111; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }

.btn-reset { display: block; width: 100%; padding: 10px; background: #1a1a2a; border: 1px solid #333; border-radius: 10px; color: #555; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 8px; }
.backup-row{ display:flex; gap:8px; padding:10px 10px 4px; max-width:480px; margin:0 auto; }
.backup-btn{ flex:1; border:none; border-radius:10px; padding:11px 0; font-size:12px; font-weight:700; cursor:pointer; background:#141424; color:#e8e8e8; border:1px solid #2a2a3a; }
.backup-btn:active{ background:#1a1a2e; }
.backup-hint{ text-align:center; font-size:10px; color:#666; padding:0 10px 6px; max-width:480px; margin:0 auto; }
.search-wrap{ position:relative; padding:10px 10px 4px; max-width:480px; margin:0 auto; }
.search-input{ width:100%; background:#1a1a2e; border:1px solid #333; border-radius:10px; padding:11px 12px; font-size:14px; color:#e8e8e8; outline:none; font-family:inherit; }
.search-input:focus{ border-color:#c8a96e; }
.search-results{ position:absolute; left:10px; right:10px; top:100%; background:#141424; border:1px solid #2a2a3a; border-radius:10px; margin-top:4px; max-height:260px; overflow-y:auto; z-index:150; display:none; }
.search-results.show{ display:block; }
.search-item{ padding:10px 12px; font-size:13px; border-bottom:1px solid #1e1e2c; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.search-item:last-child{ border-bottom:none; }
.search-item:active{ background:#1a1a2e; }
.search-item .snome{ font-weight:700; color:#e8e8e8; }
.search-item .scat{ font-size:10px; color:#888; }
.search-empty{ padding:12px; font-size:12px; color:#666; text-align:center; }
#syncDot{
  position: fixed; bottom: 14px; right: 14px; z-index: 998;
  width: 10px; height: 10px; border-radius: 50%; background: #555;
  transition: all 0.25s ease;
}
@keyframes pulsoCriticoGrande {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,34,34,0.85), 0 0 22px 6px rgba(255,34,34,0.9); transform: translate(-50%, -50%) scale(1); }
  50% { box-shadow: 0 0 0 18px rgba(255,34,34,0), 0 0 32px 10px rgba(255,34,34,0.55); transform: translate(-50%, -50%) scale(1.035); }
}
#syncDot.dot-critico {
  position: fixed; top: 50%; left: 50%; right: auto; bottom: auto;
  transform: translate(-50%, -50%);
  width: auto; height: auto; min-width: 260px; max-width: calc(100vw - 40px);
  border-radius: 16px; background: #ff2222 !important;
  padding: 18px 26px; z-index: 9999;

  line-height: 1.3; white-space: normal;
  animation: pulsoCriticoGrande 1s ease-in-out infinite;
}
#syncDot.dot-perto-laranja {
  box-shadow: 0 0 0 4px rgba(255,153,68,0.65);
}
#syncDot.dot-perto-amarelo {
  box-shadow: 0 0 0 4px rgba(232,197,71,0.6);
}
</style>

<script>
// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════

  {nome:'Supertramp',   cat:'Armazém',          nivel:94,  login:'', banco:''},
  {nome:'Tronelis',     cat:'Armazém',          nivel:112, login:'', banco:''},

  {nome:'Warith',       cat:'Armazém',          nivel:null,login:'', banco:''},
  {nome:'Wormhole',     cat:'Armazém',          nivel:null,login:'', banco:''},
  {nome:'Zerion',       cat:'Armazém',          nivel:null,login:'', banco:''},
];

var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — dados ficam sincronizados
var server = 'eu';
var charIdx = 0;

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function saveState(s) { try { s.lastModified = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }
function pertenceAoPersonagens(k){ return /_chars$/.test(k) || k === 'personagens_dic_voz'; }

function getChars() {
  var s = loadState(), k = server+'_chars';
  if (!s[k]) { s[k] = server==='eu' ? JSON.parse(JSON.stringify(EU_CHARS_DEFAULT)) : []; saveState(s); }
  return s[k];
}
function setChars(data) { var s=loadState(); s[server+'_chars']=data; saveState(s); }

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function el(tag,cls,txt){var e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function btn(txt,cls,fn){var b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b;}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- CORREÇÃO POR LISTA CONHECIDA ----------
   Compara o que a voz entendeu com os nomes que já existem cadastrados,
   e troca pelo mais parecido — em vez de aceitar de cara um nome errado. */
function normalizaTexto(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function diceCoefficient(a, b){
  a = normalizaTexto(a); b = normalizaTexto(b);
  if(a === b) return 1;
  function bigramas(s){ var r=[]; for(var i=0;i<s.length-1;i++) r.push(s.substring(i,i+2)); return r; }
  var bgA = bigramas(a), bgB = bigramas(b);
  if(bgA.length===0 || bgB.length===0) return 0;
  var bgBrestante = bgB.slice(), inter = 0;
  for(var i=0;i<bgA.length;i++){
    var idx = bgBrestante.indexOf(bgA[i]);
    if(idx !== -1){ inter++; bgBrestante.splice(idx,1); }
  }
  return (2*inter) / (bgA.length + bgB.length);
}
function corrigirPorLista(texto, lista){
  if(!lista || !lista.length) return texto;
  var melhor = null, melhorScore = 0;
  lista.forEach(function(candidato){
    var score = diceCoefficient(texto, candidato);
    if(score > melhorScore){ melhorScore = score; melhor = candidato; }
  });
  return (melhor && melhorScore >= 0.4) ? melhor : texto;
}

/* ---------- DICIONÁRIO DE CORREÇÕES APRENDIDAS ----------
   Toda vez que você corrige manualmente algo que o microfone escreveu
   errado, o app grava a lição ("o que a voz disse" → "o que você quis
   dizer"). Da próxima vez que a voz errar parecido, ele já corrige sozinho. */
function getDicionarioVoz(){
  var s = loadState();
  return s.personagens_dic_voz || {};
}
function setDicionarioVoz(d){
  var s = loadState();
  s.personagens_dic_voz = d;
  saveState(s);
}
function corrigirComDicionario(texto){
  var dic = getDicionarioVoz();
  var chaves = Object.keys(dic);
  if(!chaves.length) return texto;
  var melhor = null, melhorScore = 0;
  chaves.forEach(function(chave){
    var score = diceCoefficient(texto, chave);
    if(score > melhorScore){ melhorScore = score; melhor = chave; }
  });
  return (melhor && melhorScore >= 0.55) ? dic[melhor] : texto;
}
function aprenderCorrecao(ouvido, corrigido){
  ouvido = normalizaTexto(ouvido);
  corrigido = String(corrigido||'').trim();
  if(!ouvido || !corrigido || ouvido === normalizaTexto(corrigido)) return;
  var dic = getDicionarioVoz();
  dic[ouvido] = corrigido;
  setDicionarioVoz(dic);
}

/* ---------- MICROFONE REUTILIZÁVEL ---------- */
function anexarMicrofone(inputEl, opts){
  opts = opts || {};
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '🎤';
  btn.title = 'Falar';
  btn.style.cssText = 'flex:0 0 40px;width:40px;height:40px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#e8e8e8;font-size:16px;cursor:pointer;';
  inputEl.parentNode.appendChild(btn);
  if(!Rec){ btn.style.display='none'; return btn; }
  var rec = new Rec();
  rec.lang = 'pt-BR'; rec.continuous = false; rec.interimResults = false;
  btn.addEventListener('click', function(){
    btn.style.background = '#c8a96e'; btn.style.color = '#111'; btn.textContent = '●';
    try{ rec.start(); }catch(e){}
  });
  rec.onresult = function(e){
    var textoOriginal = e.results[0][0].transcript;
    var texto = corrigirComDicionario(textoOriginal);
    if(opts.candidatos){
      var lista = typeof opts.candidatos === 'function' ? opts.candidatos() : opts.candidatos;
      texto = corrigirPorLista(texto, lista);
    }
    inputEl.value = texto;
    inputEl.dataset.vozOriginal = textoOriginal;
    inputEl.dispatchEvent(new Event('input', {bubbles:true}));
    inputEl.dispatchEvent(new Event('change', {bubbles:true}));
    if(opts.onDone) opts.onDone();
  };
  if(opts.aprenderCorrecoes){
    inputEl.addEventListener('blur', function(){
      var ouvido = inputEl.dataset.vozOriginal;
      if(ouvido && inputEl.value && normalizaTexto(inputEl.value) !== normalizaTexto(ouvido)){
        aprenderCorrecao(ouvido, inputEl.value);
      }
      delete inputEl.dataset.vozOriginal;
    });
  }
  rec.onend = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  rec.onerror = function(){ btn.style.background='#1a1a2e'; btn.style.color='#e8e8e8'; btn.textContent='🎤'; };
  return btn;
}

function setServer(sv) {
  server = sv; charIdx = 0;
  document.querySelectorAll('.srv-btn').forEach(function(b){ b.className='srv-btn'; });
  document.getElementById('srv-'+sv).className='srv-btn active-'+sv;
  render();
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  var main = document.getElementById('main');
  main.innerHTML = '';
  renderChars(main);
}

function renderChars(main) {
  var chars = getChars();
  if (chars.length === 0) {
    renderAddChar(main, true); return;
  }
  if (charIdx >= chars.length) charIdx = chars.length-1;
  var c = chars[charIdx];

  var navCard = document.createElement('div'); navCard.className='char-nav-card';

  // Header
  var hdr = document.createElement('div'); hdr.className='char-header';
  var av = document.createElement('div'); av.className='char-avatar';
  av.textContent = (c.nome||'?').substring(0,2).toUpperCase();
  var ti = document.createElement('div'); ti.className='char-title';
  ti.innerHTML='<div class="nome">'+c.nome+'</div><div class="cat">'+c.cat+'</div>';
  var ct = el('div','char-counter',(charIdx+1)+'/'+chars.length);
  hdr.appendChild(av); hdr.appendChild(ti); hdr.appendChild(ct);
  navCard.appendChild(hdr);

  // Fields
  var fields = document.createElement('div'); fields.className='char-fields';

  var lvRow = document.createElement('div'); lvRow.className='char-field';
  lvRow.appendChild(el('div','char-field-label lv','⚡ Level'));
  var lvIn = document.createElement('input'); lvIn.className='char-field-input'; lvIn.type='number';
  lvIn.value=c.nivel||''; lvIn.placeholder='—';
  lvIn.onchange=function(){ var ch=getChars(); ch[charIdx].nivel=this.value?Number(this.value):null; setChars(ch); renderCharCounter(); };
  lvRow.appendChild(lvIn); anexarMicrofone(lvIn); fields.appendChild(lvRow);

  var lgRow = document.createElement('div'); lgRow.className='char-field';
  lgRow.appendChild(el('div','char-field-label lg','🔑 Login'));
  var lgIn = document.createElement('input'); lgIn.className='char-field-input'; lgIn.type='text';
  lgIn.value=c.login||''; lgIn.placeholder='usuário/senha';
  lgIn.onchange=function(){ var ch=getChars(); ch[charIdx].login=this.value; setChars(ch); };
  lgRow.appendChild(lgIn); anexarMicrofone(lgIn); fields.appendChild(lgRow);

  var fnRow = document.createElement('div'); fnRow.className='char-field';
  fnRow.appendChild(el('div','char-field-label','🏷️ Função'));
  var fnSel = document.createElement('select'); fnSel.className='char-field-input';
  ['Principal','Intermediário','Suporte/Diárias','Armazém','Mula / Trade'].forEach(function(catOpt){
    var op = document.createElement('option'); op.value=catOpt; op.textContent=catOpt;
    if(catOpt === c.cat) op.selected = true;
    fnSel.appendChild(op);
  });
  fnSel.onchange=function(){ var ch=getChars(); ch[charIdx].cat=this.value; setChars(ch); render(); };
  fnRow.appendChild(fnSel); fields.appendChild(fnRow);

  var tlRow = document.createElement('div'); tlRow.className='char-field';
  tlRow.appendChild(el('div','char-field-label','📝 Título'));
  var tlIn = document.createElement('input'); tlIn.className='char-field-input'; tlIn.type='text';
  tlIn.value=c.titulo||''; tlIn.placeholder='Ex: Guarda Roupas de Archer';
  tlIn.onchange=function(){ var ch=getChars(); ch[charIdx].titulo=this.value; setChars(ch); };
  tlRow.appendChild(tlIn); anexarMicrofone(tlIn); fields.appendChild(tlRow);

  var bkRow = document.createElement('div'); bkRow.className='char-field';
  bkRow.appendChild(el('div','char-field-label bk','💰 Banco'));
  var bkIn = document.createElement('input'); bkIn.className='char-field-input'; bkIn.type='text';
  bkIn.value=c.banco||''; bkIn.placeholder='—';
  bkIn.onchange=function(){ var ch=getChars(); ch[charIdx].banco=this.value; setChars(ch); };
  bkRow.appendChild(bkIn); anexarMicrofone(bkIn); fields.appendChild(bkRow);

  navCard.appendChild(fields);

  // Nav buttons
  var nr = document.createElement('div'); nr.className='char-nav-row';
  var prev=btn('◀ Anterior','btn-nav-char btn-prev-char',function(){ if(charIdx>0){charIdx--;render();} });
  prev.disabled = charIdx===0;
  var next=btn('Próximo ▶','btn-nav-char btn-next-char',function(){ if(charIdx<chars.length-1){charIdx++;render();} });
  next.disabled = charIdx===chars.length-1;
  nr.appendChild(prev); nr.appendChild(next);
  navCard.appendChild(nr);

  // Del button
  var del = document.createElement('button'); del.className='btn-reset'; del.style.marginTop='8px';
  del.textContent='🗑️ Remover este personagem';
  del.onclick = function(){ if(confirm('Remover '+c.nome+'?')){ var ch=getChars(); ch.splice(charIdx,1); setChars(ch); if(charIdx>=ch.length) charIdx=Math.max(0,ch.length-1); render(); } };
  navCard.appendChild(del);
  main.appendChild(navCard);

  renderAddChar(main, false);
}

function renderCharCounter() {
  var ct = document.querySelector('.char-counter');
  if (ct) ct.textContent = (charIdx+1)+'/'+getChars().length;
}

// BUSCA — estilo "sob demanda" (aparece enquanto digita)
// ══════════════════════════════════════════════════════
(function(){
  var input = document.getElementById('charSearch');
  var results = document.getElementById('searchResults');

  function normaliza(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function buscar(q){
    var termo = normaliza(q).trim();
    var chars = getChars();
    if(termo.length < 2) return [];
    return chars
      .map(function(c, idx){ return {c:c, idx:idx}; })
      .filter(function(item){
        var nomeNorm = normaliza(item.c.nome);
        var catNorm = normaliza(item.c.cat);
        var palavrasNome = nomeNorm.split(/\s+/);
        var palavrasCat = catNorm.split(/[\s\/]+/);
        return palavrasNome.some(function(p){ return p.indexOf(termo) === 0; }) ||
               nomeNorm.indexOf(termo) === 0 ||
               palavrasCat.some(function(p){ return p.indexOf(termo) === 0; }) ||
               catNorm.indexOf(termo) === 0;
      });
  }

  function renderResultados(lista){
    results.innerHTML = '';
    if(lista.length === 0){
      results.innerHTML = '<div class="search-empty">Nenhum personagem encontrado.</div>';
      results.classList.add('show');
      return;
    }
    lista.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'search-item';
      row.innerHTML = '<span class="snome">'+item.c.nome+'</span><span class="scat">'+item.c.cat+'</span>';
      row.onclick = function(){
        charIdx = item.idx;
        render();
        results.classList.remove('show');
        input.value = '';
      };
      results.appendChild(row);
    });
    results.classList.add('show');
  }

  input.addEventListener('input', function(){
    var q = input.value;
    if(normaliza(q).trim().length < 2){ results.classList.remove('show'); return; }
    renderResultados(buscar(q));
  });

  anexarMicrofone(input, {
    candidatos: function(){ return getChars().map(function(c){ return c.nome; }); },
    aprenderCorrecoes: true,
    onDone: function(){ input.dispatchEvent(new Event('input', {bubbles:true})); }
  });

  document.addEventListener('click', function(e){
    if(!results.contains(e.target) && e.target !== input){
      results.classList.remove('show');
    }
  });
})();
</script>

<script type="module">
// ══════════════════════════════════════════════════════

// ALERTA DE DATA CRÍTICA NA BOLINHA DE SYNC — componente
// reutilizável (mesmo padrão em todo app do ecossistema).
// Busca o documento "william/datas_data" direto no Firebase
// (esse app não tem essa informação por conta própria). Se
// alguma data importante estiver a 0 ou 1 dia, a bolinha de
// sincronização vira uma barra vermelha grande, centralizada
// na tela, pulsando, com o texto escrito dentro — sem
// precisar passar o mouse. Aniversário (tem "ano") usa 🎂;
// data comum usa 📌.
// ══════════════════════════════════════════════════════
function proximaOcorrenciaDiasGlobal(dia, mes){
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes - 1, dia);
  data.setHours(0, 0, 0, 0);
  if (data < hoje) {
    data = new Date(anoAtual + 1, mes - 1, dia);
    data.setHours(0, 0, 0, 0);
  }
  return Math.round((data - hoje) / 86400000);
}

// ---------- Mega-Sena / Loterias da Caixa — mesma lógica de contagem do Agenda ----------
function loteriaEhDiaSorteioGlobal(date){ var dow=date.getDay(); return dow===0||dow===2||dow===4; }
function loteriaHoraSorteioGlobal(date){ return date.getDay()===0 ? 11 : 21; }
function loteriaContagemGlobal(inicio){
  if(!inicio) return 0;
  var d=new Date(inicio+'T00:00:00');
  var agora=new Date();
  var count=0, safety=0;
  while(d<=agora && count<12 && safety<120){
    if(loteriaEhDiaSorteioGlobal(d)){
      var dtSorteio=new Date(d); dtSorteio.setHours(loteriaHoraSorteioGlobal(d),0,0,0);
      if(dtSorteio<=agora) count++;
    }
    d.setDate(d.getDate()+1); safety++;
  }
  return count;
}

// ---------- Gás — lê o campo único (sem separação por servidor) do doc remoto do Agenda ----------
function diasEntreGlobal(dataIni, dataFim){ return Math.floor((new Date(dataFim+'T00:00:00') - new Date(dataIni+'T00:00:00')) / 86400000); }
function gasDiasUsoRemoto(dadosAgenda){
  var g = dadosAgenda.gas || [];
  if (!g.length) return null;
  var x = g[0];
  var data = x.data !== undefined ? x.data : (x.inicio || x.compra);
  var duracao = x.data !== undefined ? x.duracao : (x.acabou ? diasEntreGlobal(data, x.acabou) : null);
  if (duracao !== null && duracao !== undefined) return null;
  return diasEntreGlobal(data, new Date().toISOString().split('T')[0]);
}

// ---------- Ciclo de textos na barra crítica (alterna quando há mais de um alerta) ----------
var _criticoTextos = [];
var _criticoIdx = 0;
setInterval(function(){
  var dot = document.getElementById('syncDot');
  if (!dot || !dot.classList.contains('dot-critico') || _criticoTextos.length < 2) return;
  _criticoIdx = (_criticoIdx + 1) % _criticoTextos.length;
  dot.textContent = _criticoTextos[_criticoIdx];
}, 3000);

// ---------- Adiar alerta crítico (toque na barra vermelha soneca por 30min, só neste aparelho) ----------
var ALERTA_SNOOZE_KEY = 'william_alerta_critico_snooze_ate';
function alertaEstaAdiado(){
  var t = localStorage.getItem(ALERTA_SNOOZE_KEY);
  return !!t && Date.now() < parseInt(t, 10);
}
function adiarAlertaCritico(){
  localStorage.setItem(ALERTA_SNOOZE_KEY, String(Date.now() + 30*60*1000));
}

async function verificarDataCriticaGlobal(){
  var dot = document.getElementById('syncDot');
  if (!dot) return;
  try {
    var comDias = [];
    try {
      var snap = await getDoc(doc(db, "william", "datas_data"));
      if (snap.exists()) {
        var lista = snap.data().datas_importantes || [];
        comDias = lista.map(function(d){ return { nome: d.nome, ano: d.ano, dias: proximaOcorrenciaDiasGlobal(d.dia, d.mes) }; });
      }
    } catch(e) {}

    var loteriaCount = 0;
    var gasDias = null;
    try {
      var snapAg = await getDoc(doc(db, "william", "agenda_data"));
      if (snapAg.exists()) {
        var dadosAg = snapAg.data();
        loteriaCount = loteriaContagemGlobal(dadosAg.loteria_inicio || null);
        gasDias = gasDiasUsoRemoto(dadosAg);
      }
    } catch(e) {}

    dot.classList.remove('dot-critico', 'dot-perto-laranja', 'dot-perto-amarelo');
    dot.textContent = '';

    var criticos = comDias.filter(function(item){ return item.dias <= 1; }).sort(function(a,b){ return a.dias - b.dias; });
    var laranjas = comDias.filter(function(item){ return item.dias > 1 && item.dias <= 3; }).sort(function(a,b){ return a.dias - b.dias; });
    var amarelos = comDias.filter(function(item){ return item.dias > 3 && item.dias <= 10; }).sort(function(a,b){ return a.dias - b.dias; });

    var textosCriticos = criticos.map(function(item){
      var prefixo = item.ano ? '🎂 ' : '📌 ';
      return prefixo + item.nome + (item.dias === 0 ? ' é HOJE!' : ' é amanhã!');
    });
    var textosAmarelos = amarelos.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });

    // Mega-Sena: 12/12 é crítico (barra vermelha), 11/12 é aviso fraco (bolinha amarela)
    if (loteriaCount >= 12) {
      textosCriticos.push('🎰 Renovar Megasena!');
    } else if (loteriaCount === 11) {
      textosAmarelos.push('🎰 Megasena: falta 1 concurso, renove em breve');
    }

    // Gás: 90 dias de uso é crítico, 80 dias é aviso fraco
    if (gasDias !== null) {
      if (gasDias >= 90) {
        textosCriticos.push('🔥 Gás: ' + gasDias + ' dias de uso, hora de trocar!');
      } else if (gasDias >= 80) {
        textosAmarelos.push('🔥 Gás: ' + gasDias + ' dias de uso, perto da troca');
      }
    }

    if (textosCriticos.length && !alertaEstaAdiado()){
      dot.classList.add('dot-critico');
      dot.title = textosCriticos.join(' • ') + ' (toque para adiar 30min)';
      _criticoTextos = textosCriticos;
      _criticoIdx = 0;
      dot.textContent = textosCriticos[0];
    } else if (laranjas.length){
      var textosL = laranjas.map(function(item){ return (item.ano ? '🎂 ' : '📌 ') + item.nome + ' em ' + item.dias + ' dias'; });
      dot.classList.add('dot-perto-laranja');
      dot.title = textosL.join(' • ');
      _criticoTextos = [];
    } else if (textosAmarelos.length){
      dot.classList.add('dot-perto-amarelo');
      dot.title = textosAmarelos.join(' • ');
      _criticoTextos = [];
    } else {
      dot.title = 'Sincronizado';
      _criticoTextos = [];
    }
  } catch (e) { /* silencioso — não atrapalha o app se essa checagem falhar */ }
}

function iniciarChecagemDataCritica(){
  var dot = document.getElementById('syncDot');
  if (dot) {
    dot.addEventListener('click', function(){
      if (dot.classList.contains('dot-critico')){
        adiarAlertaCritico();
        verificarDataCriticaGlobal();
      }
    });
  }
  verificarDataCriticaGlobal();
  setInterval(verificarDataCriticaGlobal, 30000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) verificarDataCriticaGlobal();
  });
}

const docNovo   = doc(db, "william", "personagens_data");  // documento próprio (novo)
const docAntigo = doc(db, "william", "state");               // documento compartilhado antigo (só leitura, pra migração)

let aplicandoRemoto = false;
let pushTimer = null;
let jaMigrou = false;

function setDot(cor){ var d=document.getElementById('syncDot'); if(d) d.style.background=cor; }

function abrirRetratoDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('william_retratos', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('retratos'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
async function salvarRetratoLocal(fatia){
  try{
    var db2 = await abrirRetratoDB();
    var hoje = new Date().toISOString().slice(0,10);
    var chave = 'personagens_' + hoje;
    var tx = db2.transaction('retratos','readwrite');
    tx.objectStore('retratos').put({ data: hoje, savedAt: new Date().toISOString(), conteudo: fatia }, chave);
    var getAllReq = tx.objectStore('retratos').getAllKeys();
    getAllReq.onsuccess = function(){
      var limite = new Date(); limite.setDate(limite.getDate()-30);
      getAllReq.result.forEach(function(k){
        if(typeof k==='string' && k.indexOf('personagens_')===0){
          var dataK = new Date(k.replace('personagens_',''));
          if(dataK < limite) tx.objectStore('retratos').delete(k);
        }
      });
    };
  }catch(e){ console.warn('Retrato local falhou (não crítico):', e); }
}

function fatiaPersonagensAtual(){
  var s = loadState();
  var fatia = {};
  Object.keys(s).forEach(function(k){ if(pertenceAoPersonagens(k)) fatia[k]=s[k]; });
  return fatia;
}

function agendarPush(){
  if(aplicandoRemoto) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      setDot('#d6a24a');
      var fatia = fatiaPersonagensAtual();
      fatia.lastModified = new Date().toISOString();
      await setDoc(docNovo, fatia);
      await salvarRetratoLocal(fatia);
      setDot('#3fae5c');
    }catch(e){
      console.error('Erro ao sincronizar Personagens:', e);
      setDot('#c94f4f');
    }
  }, 800);
}

function iniciarEscuta(){
  onSnapshot(docNovo, function(snap){
    if(!snap.exists()) return;
    var remoto = snap.data();
    var local = loadState();
    var mudou = false;
    Object.keys(remoto).forEach(function(k){
      if(pertenceAoPersonagens(k) && JSON.stringify(local[k]) !== JSON.stringify(remoto[k])){
        local[k] = remoto[k]; mudou = true;
      }
    });
    if(mudou){
      aplicandoRemoto = true;
      saveState(local);
      salvarRetratoLocal(fatiaPersonagensAtual());
      if(typeof render === 'function') render();
      aplicandoRemoto = false;
      setDot('#3fae5c');
    }
  }, function(err){
    console.error('Erro de sincronização (Personagens):', err);
    setDot('#c94f4f');
  });
}

async function migrarSeNecessario(){
  var snapNovo = await getDoc(docNovo);
  if(snapNovo.exists()) return;
  try{
    var snapAntigo = await getDoc(docAntigo);
    var fatia = {};
    if(snapAntigo.exists()){
      var dadosAntigos = snapAntigo.data();
      Object.keys(dadosAntigos).forEach(function(k){ if(pertenceAoPersonagens(k)) fatia[k]=dadosAntigos[k]; });
    }
    fatia.lastModified = new Date().toISOString();
    await setDoc(docNovo, fatia);
  }catch(e){ console.error('Erro na migração inicial do Personagens:', e); }
}

function mostrarLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; }
function esconderLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

async function tentarLogin(){
  var senha = document.getElementById('codigoAcesso').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!senha){ errEl.textContent = 'Digite a senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }catch(e){
    errEl.textContent = 'Senha incorreta.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('codigoAcesso').addEventListener('keydown', function(e){ if(e.key==='Enter') tentarLogin(); });
anexarMicrofone(document.getElementById('codigoAcesso'));

onAuthStateChanged(auth, async function(user){
  if(user && user.email === ALLOWED_EMAIL){
    esconderLogin();
    if(!jaMigrou){
      jaMigrou = true;
      await migrarSeNecessario();
      iniciarEscuta();
      iniciarChecagemDataCritica();
    }
  } else {
    mostrarLogin();
  }
});

var saveStateOriginal = window.saveState;
window.saveState = function(s){
  saveStateOriginal(s);
  agendarPush();
};
</script>

<!-- 💾 BACKUP LOCAL (Exportar / Importar) -->
<script>
(function(){
  function exportar(){
    var s = loadState();
    var payload = JSON.stringify(s, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Personagens_backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importar(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var novo;
      try{ novo = JSON.parse(e.target.result); }
      catch(err){ alert('Arquivo inválido.'); return; }

      if(!novo || typeof novo !== 'object'){
        alert('Arquivo não parece ser um backup válido.');
        return;
      }

      var atual = loadState();
      var atualTs = atual.lastModified ? new Date(atual.lastModified).getTime() : 0;
      var novoTs = novo.lastModified ? new Date(novo.lastModified).getTime() : 0;

      if(atualTs && novoTs && novoTs < atualTs){
        if(!confirm('Este backup é MAIS ANTIGO que os dados atuais deste aparelho.\n\nImportar mesmo assim vai sobrescrever o que está aqui. Tem certeza?')) return;
      } else {
        if(!confirm('Importar este backup e substituir os dados atuais?')) return;
      }

      // Mescla só as chaves do Personagens (<servidor>_chars) — preserva Ilhas, Agenda,
      // Gold, Nomes, Notas e Datas que moram na mesma gaveta.
      var mesclado = Object.assign({}, atual);
      Object.keys(novo).forEach(function(k){
        if(pertenceAoPersonagens(k)) mesclado[k] = novo[k];
      });
      saveState(mesclado);
      render();
      alert('Backup importado com sucesso!');
    };
    reader.readAsText(file);
  }

  document.getElementById('btnExport').addEventListener('click', exportar);
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileImport').click();
  });
  document.getElementById('fileImport').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      importar(e.target.files[0]);
      e.target.value = '';
    }
  });
})();
</script>
