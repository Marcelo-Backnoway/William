<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>William · Guia de Masmorra</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#17171a; --panel2:#1d1d21; --border:#2a2a30;
    --gold:#c9a24b; --gold-dim:#8a7538; --text:#ece7dc; --text-dim:#8a8578; --red:#c94f4f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; flex-direction:column;
  }

  /* ---------- Lista / busca ---------- */
  #viewList{ display:flex; flex-direction:column; height:100%; overflow:auto; }
  .topbar{ background:#111114; border-bottom:1px solid var(--border); padding:14px 16px; text-align:center; }
  .topbar h1{ margin:0; font-size:16px; }
  .list-container{ max-width:460px; margin:0 auto; padding:16px; width:100%; }
  .search-box{
    width:100%; background:var(--panel); border:1px solid var(--gold-dim); color:var(--text);
    border-radius:14px; padding:14px 16px; font-size:16px; font-family:inherit; margin-bottom:12px;
  }
  .add-btn{
    width:100%; background:var(--panel2); border:1px dashed var(--gold-dim); color:var(--gold);
    border-radius:12px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:14px;
  }
  .guide-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px;
  }
  .guide-thumb{
    width:52px; height:52px; border-radius:10px; background:var(--panel2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden;
  }
  .guide-thumb img{ width:100%; height:100%; object-fit:cover; }
  .guide-title{ font-weight:700; font-size:14px; }
  .guide-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .empty-state{ text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0; }

  /* ---------- Visualizador ---------- */
  #viewGuia{ display:none; flex-direction:column; height:100%; }
  .viewer-topbar{
    background:#111114; border-bottom:1px solid var(--border); padding:10px 12px;
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .viewer-topbar button{ background:none; border:none; color:var(--gold); font-size:20px; cursor:pointer; padding:4px 6px; }
  .viewer-title{ flex:1; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-indicator{ font-size:12px; color:var(--text-dim); white-space:nowrap; }
  .mode-btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text); font-size:12px;
    padding:6px 10px; border-radius:10px; cursor:pointer; white-space:nowrap;
  }
  .mode-btn.active{ background:var(--gold); color:#111; border-color:var(--gold); }

  .photo-stage{
    position:relative; flex:1; background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center; touch-action:none;
  }
  .zoom-layer{
    position:relative; width:100%; height:100%; display:flex; align-items:center;
    justify-content:center; transform-origin:0 0; will-change:transform;
  }
  .photo-stage img{ max-width:100%; max-height:100%; display:block; pointer-events:none; }
  .photo-empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:20px; }

  .zoom-reset-btn{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:12px; padding:7px 14px; border-radius:20px; cursor:pointer;
  }

  .nav-zone{
    position:absolute; top:0; bottom:0; width:18%; display:flex; align-items:center;
    font-size:34px; color:rgba(255,255,255,0.35); cursor:pointer; z-index:5;
  }
  .nav-zone:active{ color:rgba(255,255,255,0.6); }
  .nav-left{ left:0; justify-content:flex-start; padding-left:8px; }
  .nav-right{ right:0; justify-content:flex-end; padding-right:8px; }

  .arrow-mark{
    position:absolute; z-index:10; transform:translate(-50%,-50%); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; touch-action:none;
  }
  .arrow-mark .num-badge{
    background:var(--gold); color:#111; font-weight:800; border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin-top:-4px;
    border:2px solid #111;
  }

  .notes-bar{
    flex-shrink:0; background:var(--panel); border-top:1px solid var(--border);
    padding:8px 12px; display:flex; flex-direction:column; gap:6px;
  }
  .notes-bar textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; resize:none; min-height:40px; max-height:80px;
  }
  .notes-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .notes-actions button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text-dim); font-size:11px;
    padding:6px 10px; border-radius:10px; cursor:pointer;
  }
  .notes-actions button.danger{ color:var(--red); border-color:var(--red); }

  /* ---------- Modo paisagem (celular deitado): foto ganha prioridade ---------- */
  @media (orientation: landscape) and (max-height: 550px){
    .viewer-topbar{ padding:6px 10px; }
    .viewer-topbar button{ font-size:17px; }
    .viewer-title{ font-size:12px; }
    .page-indicator{ font-size:11px; }
    .mode-btn{ font-size:11px; padding:5px 8px; }

    .notes-bar{ padding:5px 10px; gap:4px; }
    .notes-bar textarea{ min-height:26px; max-height:34px; font-size:12px; padding:5px 8px; }
    .notes-actions{ gap:5px; }
    .notes-actions button{ font-size:10px; padding:4px 7px; }

    .nav-zone{ font-size:26px; }
  }

  @media (orientation: landscape){
    .photo-stage img{ width:100%; height:100%; max-width:none; max-height:none; object-fit:cover; object-position:center; }
  }

  /* ---------- Painel de edição de seta ---------- */
  .arrow-panel-bg{
    position:fixed; inset:0; background:transparent; display:none;
    align-items:flex-end; justify-content:center; z-index:200; pointer-events:none;
  }
  .arrow-panel-bg.show{ display:flex; }
  .arrow-panel{
    width:100%; max-width:460px; background:#141420; border-top:1px solid #333;
    border-radius:18px 18px 0 0; padding:10px 18px 26px; pointer-events:auto;
    box-shadow:0 -4px 20px rgba(0,0,0,0.5);
  }
  .panel-resize-handle{
    width:100%; height:28px; display:flex; align-items:center; justify-content:center;
    cursor:ns-resize; touch-action:none; margin:-8px 0 4px;
  }
  .panel-resize-handle::before{
    content:''; width:44px; height:5px; background:#555; border-radius:3px;
  }
  .panel-resize-handle:active::before{ background:var(--gold); }
  .arrow-panel-scroll{ overflow-y:auto; }
  .arrow-panel h4{ margin:0 0 12px; font-size:14px; text-align:center; color:var(--gold); }
  .compass{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  .compass button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text); font-size:20px;
    padding:10px 0; border-radius:10px; cursor:pointer;
  }
  .compass button.sel{ background:var(--gold); color:#111; border-color:var(--gold); }

  .color-palette{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .color-swatch{
    width:32px; height:32px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .color-swatch.sel{ border-color:#fff; transform:scale(1.15); }

  .notes-wrap{ position:relative; }
  .notes-badge{
    position:absolute; top:-6px; left:8px; width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
    color:#111; border:2px solid var(--bg); z-index:2;
  }
  .panel-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .panel-row label{ font-size:12px; color:var(--text-dim); width:70px; flex-shrink:0; }
  .panel-row input[type="range"]{ flex:1; }
  .panel-row input[type="number"]{
    width:60px; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px; font-size:14px; text-align:center; font-family:inherit;
  }
  .panel-btns{ display:flex; gap:10px; margin-top:16px; }
  .panel-btns button{
    flex:1; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-ok{ background:var(--gold); color:#111; }
  .btn-del{ background:none; border:1px solid var(--red); color:var(--red); }
</style>
</head>
<body>

<!-- ================= LISTA ================= -->
<div id="viewList">
  <div class="topbar"><h1>🗺️ WILLIAM — GUIA DE MASMORRA</h1></div>
  <div class="list-container">
    <input type="text" class="search-box" id="searchBox" placeholder="Buscar masmorra (ex: caverna ululante)">
    <button class="add-btn" id="addGuiaBtn">+ Nova masmorra</button>
    <div id="guiaResults"></div>
  </div>
</div>

<!-- ================= VISUALIZADOR ================= -->
<div id="viewGuia">
  <div class="viewer-topbar">
    <button id="backToListBtn">‹</button>
    <div class="viewer-title" id="viewerTitle">—</div>
    <div class="page-indicator" id="pageIndicator">0/0</div>
    <button class="mode-btn" id="fullscreenBtn">⛶</button>
    <button class="mode-btn" id="modeBtn">✏️ Anotar</button>
  </div>

  <div class="photo-stage" id="photoStage">
    <div class="zoom-layer" id="zoomLayer">
      <img id="photoImg" style="display:none;">
    </div>
    <div class="photo-empty" id="photoEmptyMsg">Nenhuma foto ainda.<br>Toque em "+ Importar fotos" abaixo.</div>
    <div class="nav-zone nav-left" id="navLeft">‹</div>
    <div class="nav-zone nav-right" id="navRight">›</div>
    <button class="zoom-reset-btn" id="zoomResetBtn" style="display:none;">🔍 Resetar zoom</button>
  </div>

  <div class="notes-bar" id="notesBar">
    <div class="notes-wrap">
      <textarea id="notesArea" placeholder="Anotações desta página (estratégia, o que fazer aqui...)"></textarea>
      <div class="notes-badge" id="notesBadge" style="display:none;"></div>
    </div>
    <div class="notes-actions">
      <button id="importPhotosBtn">📷 Importar fotos</button>
      <button id="deletePageBtn" class="danger">🗑️ Excluir esta foto</button>
      <button id="deleteGuiaBtn" class="danger">🗑️ Excluir masmorra</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
</div>

<!-- ================= PAINEL DE SETA ================= -->
<div class="arrow-panel-bg" id="arrowPanelBg">
  <div class="arrow-panel">
    <div class="panel-resize-handle" id="panelResizeHandle"></div>
    <div class="arrow-panel-scroll" id="arrowPanelScroll">
      <h4>🏹 Configurar seta</h4>
      <div class="compass" id="compassGrid"></div>
      <div class="panel-row">
        <label>Ângulo fino</label>
        <input type="range" id="angleSlider" min="0" max="359" value="0">
      </div>
      <div class="panel-row">
        <label>Número</label>
        <input type="number" id="numeroInput" min="1" value="1">
      </div>
      <div class="panel-row">
        <label>Tamanho</label>
        <input type="range" id="sizeSlider" min="20" max="70" value="36">
      </div>
      <div class="color-palette" id="colorPalette"></div>
      <textarea id="setaTextoInput" placeholder="Instrução desta seta (ex: ataca aqui primeiro)" style="width:100%;min-height:50px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;margin-bottom:4px;"></textarea>
      <div class="panel-btns">
        <button class="btn-del" id="arrowDeleteBtn">🗑️ Excluir seta</button>
        <button class="btn-ok" id="arrowOkBtn">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- Zoom e arraste próprios do app (independente do navegador) ----------
  let zoomEscala = 1, zoomTX = 0, zoomTY = 0;
  const ZOOM_MIN = 1, ZOOM_MAX = 4;
  const ativos = new Map(); // pointerId -> {x,y}
  let pinchDistInicial = 0, pinchEscalaInicial = 1;
  let panInicial = null; // {x,y,tx,ty} pro arraste com 1 dedo quando ampliado

  function aplicarZoomTransform(){
    const layer = document.getElementById('zoomLayer');
    layer.style.transform = 'translate('+zoomTX+'px,'+zoomTY+'px) scale('+zoomEscala+')';
    document.getElementById('zoomResetBtn').style.display = zoomEscala > 1.01 ? 'block' : 'none';
  }
  function limitarPan(){
    const stage = document.getElementById('photoStage');
    const rect = stage.getBoundingClientRect();
    const maxX = Math.max(0, (rect.width * zoomEscala - rect.width));
    const maxY = Math.max(0, (rect.height * zoomEscala - rect.height));
    zoomTX = Math.max(-maxX, Math.min(0, zoomTX));
    zoomTY = Math.max(-maxY, Math.min(0, zoomTY));
  }
  function resetarZoom(){
    zoomEscala = 1; zoomTX = 0; zoomTY = 0;
    aplicarZoomTransform();
  }
  window.addEventListener('orientationchange', function(){ setTimeout(resetarZoom, 60); });
  if(window.screen && window.screen.orientation){
    window.screen.orientation.addEventListener('change', function(){ setTimeout(resetarZoom, 60); });
  }
  document.getElementById('zoomResetBtn').addEventListener('click', resetarZoom);

  // Converte coordenada de tela (clientX/Y) pra % dentro da foto, considerando o zoom atual
  function pontoParaPercentual(clientX, clientY){
    const stage = document.getElementById('photoStage');
    const rect = stage.getBoundingClientRect();
    const xUnzoom = ((clientX - rect.left) - zoomTX) / zoomEscala;
    const yUnzoom = ((clientY - rect.top) - zoomTY) / zoomEscala;
    return {
      xp: Math.max(0, Math.min(100, (xUnzoom / rect.width) * 100)),
      yp: Math.max(0, Math.min(100, (yUnzoom / rect.height) * 100))
    };
  }

  function distanciaEntre(p1, p2){
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }
  function pontoMedio(p1, p2){
    return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  }

  const stageEl = document.getElementById('photoStage');
  stageEl.addEventListener('pointerdown', function(e){
    if(e.target.closest('.nav-zone') || e.target.closest('.zoom-reset-btn')) return;
    ativos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(ativos.size === 2){
      const pts = Array.from(ativos.values());
      pinchDistInicial = distanciaEntre(pts[0], pts[1]);
      pinchEscalaInicial = zoomEscala;
    } else if(ativos.size === 1 && zoomEscala > 1.01 && !e.target.closest('.arrow-mark')){
      panInicial = { x: e.clientX, y: e.clientY, tx: zoomTX, ty: zoomTY };
    }
  });
  stageEl.addEventListener('pointermove', function(e){
    if(!ativos.has(e.pointerId)) return;
    ativos.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(ativos.size === 2){
      const pts = Array.from(ativos.values());
      const distAtual = distanciaEntre(pts[0], pts[1]);
      const novaEscala = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchEscalaInicial * (distAtual / pinchDistInicial)));
      zoomEscala = novaEscala;
      limitarPan();
      aplicarZoomTransform();
    } else if(ativos.size === 1 && panInicial){
      const p = Array.from(ativos.values())[0];
      zoomTX = panInicial.tx + (p.x - panInicial.x);
      zoomTY = panInicial.ty + (p.y - panInicial.y);
      limitarPan();
      aplicarZoomTransform();
    }
  });
  function soltarPointer(e){
    ativos.delete(e.pointerId);
    if(ativos.size < 2) pinchDistInicial = 0;
    if(ativos.size === 0) panInicial = null;
  }
  stageEl.addEventListener('pointerup', soltarPointer);
  stageEl.addEventListener('pointercancel', soltarPointer);

  // ---------- IndexedDB ----------
  const DB_NAME = 'williamMasmorraDB';
  const STORE = 'guias';
  let db = null;

  function openDB(){
    return new Promise(function(resolve, reject){
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){
        const _db = e.target.result;
        if(!_db.objectStoreNames.contains(STORE)){
          _db.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e); };
    });
  }
  function getAllGuias(){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(e){ reject(e); };
    });
  }
  function saveGuia(guia){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(guia);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(e){ reject(e); };
    });
  }
  function deleteGuiaDB(id){
    return new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(e){ reject(e); };
    });
  }

  let guias = [];
  let guiaAtual = null;
  let paginaAtualIdx = 0;
  let modoAnotar = false;
  let setaEditando = null; // { seta }

  function novoId(){ return 'g_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

  // ---------- Compressão de imagem ----------
  function comprimirImagem(file){
    return new Promise(function(resolve){
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function(e){
        img.onload = function(){
          const MAX = 1600;
          let w = img.width, h = img.height;
          if(w > h && w > MAX){ h = h * (MAX/w); w = MAX; }
          else if(h > MAX){ w = w * (MAX/h); h = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob){ resolve(blob); }, 'image/jpeg', 0.82);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Busca (mesmo motor do Onde Está) ----------
  function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function ehSubsequencia(termo, alvo){
    let i = 0;
    for(let c of alvo){ if(i < termo.length && c === termo[i]) i++; }
    return i === termo.length;
  }
  function bate(query, texto){
    query = normalizar(query); texto = normalizar(texto||'');
    if(!query || query.length < 2) return false;
    const palavras = texto.split(/[^a-z0-9]+/).filter(Boolean);
    for(let i=0;i<palavras.length;i++){
      if(palavras[i].startsWith(query)) return true;
      if(query.length>=4 && ehSubsequencia(query, palavras[i])) return true;
    }
    return false;
  }

  function renderLista(){
    const query = document.getElementById('searchBox').value;
    const wrap = document.getElementById('guiaResults');

    let lista = guias;
    if(query.trim()){
      lista = guias.filter(function(g){ return bate(query, g.titulo); });
    }

    if(guias.length === 0){
      wrap.innerHTML = '<div class="empty-state">Nenhuma masmorra cadastrada ainda.<br>Toque em "+ Nova masmorra".</div>';
      return;
    }
    if(query.trim() && lista.length === 0){
      wrap.innerHTML = '<div class="empty-state">Nada encontrado pra "'+query+'"</div>';
      return;
    }
    if(!query.trim()){
      wrap.innerHTML = '';
      return;
    }

    let html = '';
    lista.forEach(function(g){
      const thumb = (g.paginas && g.paginas[0]) ? '<img src="'+URL.createObjectURL(g.paginas[0].foto)+'">' : '🗺️';
      html += '<div class="guide-card" onclick="window._mgAbrir(\''+g.id+'\')">' +
        '<div class="guide-thumb">'+thumb+'</div>' +
        '<div><div class="guide-title">'+g.titulo+'</div><div class="guide-sub">'+(g.paginas?g.paginas.length:0)+' foto(s)</div></div>' +
        '</div>';
    });
    wrap.innerHTML = html;
  }
  document.getElementById('searchBox').addEventListener('input', renderLista);

  document.getElementById('addGuiaBtn').addEventListener('click', async function(){
    const titulo = prompt('Nome da masmorra (ex: Masmorra Caverna Ululante):');
    if(!titulo || !titulo.trim()) return;
    const novaGuia = { id: novoId(), titulo: titulo.trim(), paginas: [] };
    guias.push(novaGuia);
    await saveGuia(novaGuia);
    abrirGuia(novaGuia.id);
  });

  // ---------- Visualizador ----------
  window._mgAbrir = function(id){ abrirGuia(id); };

  function abrirGuia(id){
    guiaAtual = guias.find(function(g){ return g.id === id; });
    if(!guiaAtual) return;
    paginaAtualIdx = 0;
    document.getElementById('viewList').style.display = 'none';
    document.getElementById('viewGuia').style.display = 'flex';
    document.getElementById('viewerTitle').textContent = guiaAtual.titulo;
    renderPagina();
  }

  document.getElementById('backToListBtn').addEventListener('click', function(){
    guiaAtual = null;
    document.getElementById('viewGuia').style.display = 'none';
    document.getElementById('viewList').style.display = 'flex';
    renderLista();
  });

  function renderPagina(){
    const paginas = guiaAtual.paginas || [];
    const total = paginas.length;
    document.getElementById('pageIndicator').textContent = total ? (paginaAtualIdx+1)+'/'+total : '0/0';

    const img = document.getElementById('photoImg');
    const emptyMsg = document.getElementById('photoEmptyMsg');
    const stage = document.getElementById('photoStage');

    resetarZoom();
    stage.querySelectorAll('.arrow-mark').forEach(function(el){ el.remove(); });
    setaSelecionadaAtual = null;
    document.getElementById('notesBadge').style.display = 'none';
    document.getElementById('notesBar').style.borderTop = '1px solid var(--border)';

    if(total === 0){
      img.style.display = 'none';
      emptyMsg.style.display = 'block';
      document.getElementById('notesArea').value = '';
      return;
    }
    emptyMsg.style.display = 'none';
    img.style.display = 'block';
    const pagina = paginas[paginaAtualIdx];
    img.src = URL.createObjectURL(pagina.foto);
    document.getElementById('notesArea').value = pagina.notas || '';
    document.getElementById('notesArea').placeholder = 'Anotações desta página (estratégia, o que fazer aqui...)';

    (pagina.setas || []).forEach(function(seta){ criarElementoSeta(seta); });
  }

  function irPagina(delta){
    if(!guiaAtual) return;
    const total = (guiaAtual.paginas||[]).length;
    if(total === 0) return;
    paginaAtualIdx = (paginaAtualIdx + delta + total) % total;
    renderPagina();
  }
  document.getElementById('navLeft').addEventListener('click', function(){ irPagina(-1); });
  document.getElementById('navRight').addEventListener('click', function(){ irPagina(1); });

  // ---------- Tela cheia (esconde a barra do navegador de verdade) ----------
  function estaEmTelaCheia(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function atualizarBotaoFullscreen(){
    const btn = document.getElementById('fullscreenBtn');
    btn.textContent = estaEmTelaCheia() ? '⤡' : '⛶';
  }
  document.getElementById('fullscreenBtn').addEventListener('click', function(){
    const el = document.documentElement;
    if(!estaEmTelaCheia()){
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req) req.call(el).catch(function(){});
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document).catch(function(){});
    }
  });
  document.addEventListener('fullscreenchange', atualizarBotaoFullscreen);
  document.addEventListener('webkitfullscreenchange', atualizarBotaoFullscreen);

  document.getElementById('modeBtn').addEventListener('click', function(){
    modoAnotar = !modoAnotar;
    this.className = 'mode-btn' + (modoAnotar ? ' active' : '');
    this.textContent = modoAnotar ? '👁️ Ver' : '✏️ Anotar';
  });

  document.getElementById('notesArea').addEventListener('input', function(){
    if(!guiaAtual || !guiaAtual.paginas[paginaAtualIdx]) return;
    if(setaSelecionadaAtual){
      setaSelecionadaAtual.texto = this.value;
      saveGuia(guiaAtual);
      return;
    }
    guiaAtual.paginas[paginaAtualIdx].notas = this.value;
    saveGuia(guiaAtual);
  });

  // ---------- Importar fotos ----------
  document.getElementById('importPhotosBtn').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', async function(){
    const files = Array.from(this.files || []);
    for(const file of files){
      const blob = await comprimirImagem(file);
      guiaAtual.paginas.push({ id: novoId(), foto: blob, notas: '', setas: [] });
    }
    this.value = '';
    await saveGuia(guiaAtual);
    paginaAtualIdx = guiaAtual.paginas.length - files.length;
    renderPagina();
  });

  document.getElementById('deletePageBtn').addEventListener('click', async function(){
    if(!guiaAtual || guiaAtual.paginas.length === 0) return;
    if(!confirm('Excluir esta foto e suas setas? Não tem como desfazer.')) return;
    guiaAtual.paginas.splice(paginaAtualIdx, 1);
    if(paginaAtualIdx >= guiaAtual.paginas.length) paginaAtualIdx = Math.max(0, guiaAtual.paginas.length-1);
    await saveGuia(guiaAtual);
    renderPagina();
  });

  document.getElementById('deleteGuiaBtn').addEventListener('click', async function(){
    if(!guiaAtual) return;
    if(!confirm('Excluir a masmorra inteira "'+guiaAtual.titulo+'"? Não tem como desfazer.')) return;
    await deleteGuiaDB(guiaAtual.id);
    guias = guias.filter(function(g){ return g.id !== guiaAtual.id; });
    guiaAtual = null;
    document.getElementById('viewGuia').style.display = 'none';
    document.getElementById('viewList').style.display = 'flex';
    renderLista();
  });

  // ---------- Setas ----------
  const CORES = ['#c9a24b','#e53e3e','#3182ce','#38a169','#805ad5','#dd6b20','#0bc5ea','#d53f8c'];

  function criarElementoSeta(seta){
    const layer = document.getElementById('zoomLayer');
    const el = document.createElement('div');
    el.className = 'arrow-mark';
    el.style.left = seta.x + '%';
    el.style.top = seta.y + '%';
    el.dataset.setaId = seta.id;

    const tamanho = seta.tamanho || 36;
    const cor = seta.cor || CORES[0];
    el.innerHTML =
      '<svg width="'+tamanho+'" height="'+tamanho+'" viewBox="0 0 24 24" style="transform:rotate('+seta.angulo+'deg);filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8));">'+
        '<path d="M12 2 L19 21 L12 17 L5 21 Z" fill="'+cor+'" stroke="#111" stroke-width="1"/>'+
      '</svg>'+
      '<div class="num-badge" style="background:'+cor+';width:'+Math.round(tamanho*0.55)+'px;height:'+Math.round(tamanho*0.55)+'px;font-size:'+Math.round(tamanho*0.32)+'px;">'+seta.numero+'</div>';

    let moveu = false, startX=0, startY=0;
    el.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      moveu = false; startX = e.clientX; startY = e.clientY;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', function(e){
      if(!modoAnotar) return;
      if(Math.abs(e.clientX-startX) > 4 || Math.abs(e.clientY-startY) > 4) moveu = true;
      if(!moveu) return;
      const p = pontoParaPercentual(e.clientX, e.clientY);
      el.style.left = p.xp + '%';
      el.style.top = p.yp + '%';
      seta.x = p.xp; seta.y = p.yp;
    });
    el.addEventListener('pointerup', function(e){
      e.stopPropagation();
      if(moveu){ saveGuia(guiaAtual); return; }
      selecionarSeta(seta);
      if(modoAnotar) abrirPainelSeta(seta);
    });
    el.addEventListener('mouseenter', function(){
      if(!modoAnotar) selecionarSeta(seta);
    });

    layer.appendChild(el);
  }

  // ---------- Seleção de seta (troca o rodapé, sem linha extra) ----------
  let setaSelecionadaAtual = null;

  function selecionarSeta(seta){
    setaSelecionadaAtual = seta;
    const cor = seta.cor || CORES[0];
    const notesBar = document.getElementById('notesBar');
    const textarea = document.getElementById('notesArea');
    const badge = document.getElementById('notesBadge');

    notesBar.style.borderTop = '3px solid ' + cor;
    badge.style.display = 'flex';
    badge.style.background = cor;
    badge.textContent = seta.numero;
    textarea.value = seta.texto || '';
    textarea.placeholder = 'Instrução da seta ' + seta.numero + '...';
  }

  function voltarNotasGerais(){
    setaSelecionadaAtual = null;
    document.getElementById('notesBadge').style.display = 'none';
    document.getElementById('notesBar').style.borderTop = '1px solid var(--border)';
    const pagina = guiaAtual.paginas[paginaAtualIdx];
    document.getElementById('notesArea').value = pagina ? (pagina.notas || '') : '';
    document.getElementById('notesArea').placeholder = 'Anotações desta página (estratégia, o que fazer aqui...)';
  }

  document.getElementById('photoStage').addEventListener('click', function(e){
    if(e.target.closest('.arrow-mark')) return;
    if(e.target.closest('.nav-zone')) return;
    if(!modoAnotar){
      if(setaSelecionadaAtual) voltarNotasGerais();
      return;
    }
    if(!guiaAtual) return;
    const pagina = guiaAtual.paginas[paginaAtualIdx];
    if(!pagina) return;
    const p = pontoParaPercentual(e.clientX, e.clientY);
    const xp = p.xp, yp = p.yp;
    const maxNum = (pagina.setas||[]).reduce(function(m,s){ return Math.max(m, s.numero||0); }, 0);
    const novaSeta = { id: novoId(), x: xp, y: yp, angulo: 0, numero: maxNum+1, tamanho: 36, cor: CORES[maxNum % CORES.length], texto: '' };
    if(!pagina.setas) pagina.setas = [];
    pagina.setas.push(novaSeta);
    criarElementoSeta(novaSeta);
    selecionarSeta(novaSeta);
    abrirPainelSeta(novaSeta);
  });

  // ---------- Painel de edição da seta ----------
  const direcoes = [0,45,90,135,180,225,270,315];
  function montarCompass(){
    const grid = document.getElementById('compassGrid');
    grid.innerHTML = '';
    direcoes.forEach(function(ang){
      const btn = document.createElement('button');
      btn.innerHTML = '<span style="display:inline-block;transform:rotate('+ang+'deg);">↑</span>';
      btn.dataset.ang = ang;
      btn.addEventListener('click', function(){
        setaEditando.seta.angulo = ang;
        document.getElementById('angleSlider').value = ang;
        atualizarCompassSel(ang);
        redesenharSetaAtual();
      });
      grid.appendChild(btn);
    });
  }
  function atualizarCompassSel(ang){
    document.querySelectorAll('#compassGrid button').forEach(function(b){
      b.className = (parseInt(b.dataset.ang) === ang) ? 'sel' : '';
    });
  }
  montarCompass();

  function montarPaleta(){
    const wrap = document.getElementById('colorPalette');
    wrap.innerHTML = '';
    CORES.forEach(function(cor){
      const btn = document.createElement('div');
      btn.className = 'color-swatch';
      btn.style.background = cor;
      btn.dataset.cor = cor;
      btn.addEventListener('click', function(){
        setaEditando.seta.cor = cor;
        atualizarPaletaSel(cor);
        redesenharSetaAtual();
        if(setaSelecionadaAtual && setaSelecionadaAtual.id === setaEditando.seta.id) selecionarSeta(setaEditando.seta);
      });
      wrap.appendChild(btn);
    });
  }
  function atualizarPaletaSel(cor){
    document.querySelectorAll('#colorPalette .color-swatch').forEach(function(b){
      b.className = 'color-swatch' + (b.dataset.cor === cor ? ' sel' : '');
    });
  }
  montarPaleta();

  function abrirPainelSeta(seta){
    setaEditando = { seta: seta };
    document.getElementById('angleSlider').value = seta.angulo;
    document.getElementById('numeroInput').value = seta.numero;
    document.getElementById('sizeSlider').value = seta.tamanho || 36;
    document.getElementById('setaTextoInput').value = seta.texto || '';
    atualizarCompassSel(seta.angulo);
    atualizarPaletaSel(seta.cor || CORES[0]);
    aplicarAlturaPainelSalva();
    document.getElementById('arrowPanelBg').classList.add('show');
  }

  // ---------- Alça pra diminuir o painel manualmente (fica salvo só neste aparelho) ----------
  const LS_ALTURA_PAINEL = 'mg_painelAltura';
  function aplicarAlturaPainelSalva(){
    const scroll = document.getElementById('arrowPanelScroll');
    const salva = localStorage.getItem(LS_ALTURA_PAINEL);
    if(salva){
      scroll.style.maxHeight = salva + 'px';
    } else {
      // primeira vez: já começa mais compacto, deixando a foto visível acima
      scroll.style.maxHeight = Math.round(window.innerHeight * 0.42) + 'px';
    }
  }
  (function initResizeHandle(){
    const handle = document.getElementById('panelResizeHandle');
    const scroll = document.getElementById('arrowPanelScroll');
    let arrastando = false, startY = 0, startHeight = 0;

    handle.addEventListener('pointerdown', function(e){
      arrastando = true; startY = e.clientY;
      startHeight = scroll.getBoundingClientRect().height;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function(e){
      if(!arrastando) return;
      const delta = e.clientY - startY;
      let novaAltura = startHeight - delta; // arrastar pra baixo diminui, pra cima aumenta
      const maxPermitido = Math.round(window.innerHeight * 0.85);
      novaAltura = Math.max(120, Math.min(maxPermitido, novaAltura));
      scroll.style.maxHeight = novaAltura + 'px';
    });
    handle.addEventListener('pointerup', function(){
      if(!arrastando) return;
      arrastando = false;
      localStorage.setItem(LS_ALTURA_PAINEL, Math.round(scroll.getBoundingClientRect().height));
    });
  })();

  function fecharPainelSeta(){
    document.getElementById('arrowPanelBg').classList.remove('show');
    setaEditando = null;
    saveGuia(guiaAtual);
  }

  function redesenharSetaAtual(){
    if(!setaEditando) return;
    const stage = document.getElementById('photoStage');
    const el = stage.querySelector('[data-seta-id="'+setaEditando.seta.id+'"]');
    if(el) el.remove();
    criarElementoSeta(setaEditando.seta);
  }

  document.getElementById('angleSlider').addEventListener('input', function(){
    if(!setaEditando) return;
    setaEditando.seta.angulo = parseInt(this.value);
    atualizarCompassSel(-1);
    redesenharSetaAtual();
  });
  document.getElementById('numeroInput').addEventListener('input', function(){
    if(!setaEditando) return;
    setaEditando.seta.numero = parseInt(this.value) || 1;
    redesenharSetaAtual();
    if(setaSelecionadaAtual && setaSelecionadaAtual.id === setaEditando.seta.id) selecionarSeta(setaEditando.seta);
  });
  document.getElementById('sizeSlider').addEventListener('input', function(){
    if(!setaEditando) return;
    setaEditando.seta.tamanho = parseInt(this.value);
    redesenharSetaAtual();
  });
  document.getElementById('setaTextoInput').addEventListener('input', function(){
    if(!setaEditando) return;
    setaEditando.seta.texto = this.value;
    if(setaSelecionadaAtual && setaSelecionadaAtual.id === setaEditando.seta.id){
      document.getElementById('notesArea').value = this.value;
    }
  });
  document.getElementById('arrowOkBtn').addEventListener('click', fecharPainelSeta);
  document.getElementById('arrowDeleteBtn').addEventListener('click', function(){
    if(!setaEditando) return;
    const pagina = guiaAtual.paginas[paginaAtualIdx];
    const idExcluida = setaEditando.seta.id;
    pagina.setas = (pagina.setas||[]).filter(function(s){ return s.id !== idExcluida; });
    const stage = document.getElementById('photoStage');
    const el = stage.querySelector('[data-seta-id="'+idExcluida+'"]');
    if(el) el.remove();
    if(setaSelecionadaAtual && setaSelecionadaAtual.id === idExcluida) voltarNotasGerais();
    fecharPainelSeta();
  });

  // ---------- Init ----------
  (async function init(){
    db = await openDB();
    guias = await getAllGuias();
    renderLista();
  })();
})();
</script>

</body>
</html>
