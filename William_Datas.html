<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 William Datas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a14; color: #e8e8e8; min-height: 100vh; }

.topbar { background: #111122; border-bottom: 1px solid #2a2a3a; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 12px; color: #c8a96e; letter-spacing: 1px; font-weight: 700; }

.container { padding: 10px; max-width: 480px; margin: 0 auto; }

.card { background: #141424; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.card-title { font-size: 11px; font-weight: 700; color: #c8a96e; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.login-overlay { position: fixed; inset: 0; background: #0a0a14; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-box { background: #141424; border: 1px solid #2a2a3a; border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 320px; text-align: center; }
.login-box h2 { font-size: 15px; color: #c8a96e; letter-spacing: 1px; margin-bottom: 4px; }
.login-box p { font-size: 11px; color: #666; margin-bottom: 18px; }
.login-box input { width: 100%; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 11px 12px; font-size: 14px; color: #e8e8e8; outline: none; font-family: inherit; margin-bottom: 10px; }
.login-box input:focus { border-color: #c8a96e; }
.login-box button { width: 100%; background: #c8a96e; color: #111; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.login-box button:disabled { opacity: 0.6; }
.login-error { font-size: 11px; color: #ff6666; margin-top: 10px; min-height: 14px; }

.form-row { display: flex; gap: 8px; margin-bottom: 10px; }
.form-row input, .form-row select { flex: 1; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 14px; color: #e8e8e8; outline: none; font-family: inherit; }
.form-row input:focus, .form-row select:focus { border-color: #c8a96e; }
.btn { background: #c8a96e; color: #111; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn.full { width: 100%; }
.btn.secondary { background: transparent; color: #c8a96e; border: 1px solid #6a5a2a; }

.item { display: flex; align-items: center; gap: 10px; background: #1a1a2e; border-left: 4px solid #333; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.item.cor-amarelo { border-left-color: #e8c547; }
.item.cor-laranja { border-left-color: #ff9944; }
.item.cor-vermelho { border-left-color: #ff5555; }
.item .info { flex: 1; }
.item .nome { font-weight: 700; font-size: 14px; }
.item .detalhe { font-size: 11px; color: #999; margin-top: 2px; }
.item .faltam { font-size: 11px; font-weight: 700; margin-top: 2px; }
.item.cor-amarelo .faltam { color: #e8c547; }
.item.cor-laranja .faltam { color: #ff9944; }
.item.cor-vermelho .faltam { color: #ff5555; }
.item .acoes { display: flex; gap: 6px; }
.item .acoes button { background: none; border: none; color: #999; font-size: 16px; cursor: pointer; padding: 4px 6px; }
.item .acoes button:hover { color: #c8a96e; }
.vazio { text-align: center; color: #666; padding: 30px 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>⚔ WILLIAM</h2>
    <p>Acesso restrito — entre com sua senha (só uma vez neste aparelho)</p>
    <input type="text" id="loginSenha" placeholder="Senha" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc;">
    <button id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="login-overlay" id="pinOverlay" style="display:none;">
  <div class="login-box">
    <h2>⚔ WILLIAM</h2>
    <p id="pinLabel">Digite seu PIN</p>
    <input type="text" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-align:center;letter-spacing:8px;font-size:20px;-webkit-text-security:disc;">
    <button id="pinConfirmBtn">Confirmar</button>
    <div class="login-error" id="pinError"></div>
    <p style="margin-top:14px;"><a href="#" id="forgotPinLink" style="color:#666;font-size:11px;text-decoration:underline;">Esqueci o PIN — sair da conta</a></p>
  </div>
</div>

<div class="topbar">
  <h1>🎂 WILLIAM — DATAS IMPORTANTES</h1>
  <button id="lockBtn" title="Bloquear" style="background:none;border:none;color:#666;font-size:16px;cursor:pointer;">🔒</button>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">Nova data</div>
    <div class="form-row">
      <input type="text" id="novoNome" placeholder="Nome / o que é (ex: Aniversário da Verônica)">
    </div>
    <div class="form-row">
      <select id="novoDia"></select>
      <select id="novoMes"></select>
      <input type="number" id="novoAno" placeholder="Ano (opcional)" style="max-width:100px;">
    </div>
    <div class="form-row">
      <input type="text" id="novaObs" placeholder="Observação (opcional)">
    </div>
    <button class="btn full" onclick="adicionarData()">+ Adicionar</button>
  </div>

  <div class="card">
    <div class="card-title">Datas cadastradas</div>
    <div id="listaDatas"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ESTADO / SINCRONIZAÇÃO (mesmo padrão dos outros apps)
// ══════════════════════════════════════════════════════
var KEY = 'william_superapp_v1'; // mesma chave do SuperApp — dados ficam sincronizados

function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }

function getDatas() {
  var s = loadState();
  return s.datas_importantes || [];
}
function setDatas(lista) {
  var s = loadState();
  s.datas_importantes = lista;
  saveState(s);
  window.saveState(s);
}

var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function montarSeletores() {
  var diaSel = document.getElementById('novoDia');
  var mesSel = document.getElementById('novoMes');
  for (var d=1; d<=31; d++) {
    var op = document.createElement('option'); op.value=d; op.textContent = 'Dia '+d;
    diaSel.appendChild(op);
  }
  MESES.forEach(function(m,i){
    var op = document.createElement('option'); op.value=i+1; op.textContent=m;
    mesSel.appendChild(op);
  });
}
montarSeletores();

function proximaOcorrencia(dia, mes) {
  var hoje = new Date();
  hoje.setHours(0,0,0,0);
  var anoAtual = hoje.getFullYear();
  var data = new Date(anoAtual, mes-1, dia);
  data.setHours(0,0,0,0);
  var anoOcorrencia = anoAtual;
  if (data < hoje) {
    anoOcorrencia = anoAtual+1;
    data = new Date(anoOcorrencia, mes-1, dia);
    data.setHours(0,0,0,0);
  }
  var diffMs = data - hoje;
  var diasFaltando = Math.round(diffMs / 86400000);
  return { dias: diasFaltando, ano: anoOcorrencia };
}

function corPorDias(dias) {
  if (dias <= 1) return 'cor-vermelho';
  if (dias <= 3) return 'cor-laranja';
  if (dias <= 10) return 'cor-amarelo';
  return '';
}

function adicionarData() {
  var nome = document.getElementById('novoNome').value.trim();
  var dia = parseInt(document.getElementById('novoDia').value, 10);
  var mes = parseInt(document.getElementById('novoMes').value, 10);
  var ano = document.getElementById('novoAno').value ? parseInt(document.getElementById('novoAno').value, 10) : null;
  var obs = document.getElementById('novaObs').value.trim();
  if (!nome) { alert('Digite um nome pra essa data.'); return; }

  var lista = getDatas();
  lista.push({ id: Date.now()+'-'+Math.random().toString(16).slice(2), nome: nome, dia: dia, mes: mes, ano: ano, obs: obs });
  setDatas(lista);

  document.getElementById('novoNome').value = '';
  document.getElementById('novaObs').value = '';
  document.getElementById('novoAno').value = '';
  render();
}

function excluirData(id) {
  if (!confirm('Excluir essa data?')) return;
  var lista = getDatas().filter(function(d){ return d.id !== id; });
  setDatas(lista);
  render();
}

function render() {
  var lista = getDatas();
  var cont = document.getElementById('listaDatas');
  if (!lista.length) {
    cont.innerHTML = '<div class="vazio">Nenhuma data cadastrada ainda.</div>';
    return;
  }
  var comDias = lista.map(function(d){
    var r = proximaOcorrencia(d.dia, d.mes);
    return { d: d, dias: r.dias, anoOcorrencia: r.ano };
  });
  comDias.sort(function(a,b){ return a.dias - b.dias; });

  cont.innerHTML = '';
  comDias.forEach(function(item){
    var d = item.d, dias = item.dias;
    var cor = corPorDias(dias);
    var el = document.createElement('div');
    el.className = 'item ' + cor;
    var faltamTexto = dias === 0 ? 'É HOJE! 🎉' : (dias === 1 ? 'Falta 1 dia' : 'Faltam ' + dias + ' dias');
    var idade = d.ano ? ' (completa ' + (item.anoOcorrencia - d.ano) + ' anos)' : '';
    el.innerHTML =
      '<div class="info">' +
        '<div class="nome">' + escapeHtml(d.nome) + '</div>' +
        '<div class="detalhe">' + d.dia + ' de ' + MESES[d.mes-1] + (d.ano ? ' (nascido em '+d.ano+')' : '') + (d.obs ? ' — ' + escapeHtml(d.obs) : '') + '</div>' +
        '<div class="faltam">' + faltamTexto + idade + '</div>' +
      '</div>' +
      '<div class="acoes"><button onclick="excluirData(\'' + d.id + '\')">✕</button></div>';
    cont.appendChild(el);
  });
}
function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

render();
</script>

<!-- 🔄 SINCRONIZAÇÃO EM NUVEM (Firebase) + LOGIN -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNKjp7hLNK6mzAX2GK49WEZq-NKgQ9o5Y",
  authDomain: "williamapp-31dff.firebaseapp.com",
  projectId: "williamapp-31dff",
  storageBucket: "williamapp-31dff.firebasestorage.app",
  messagingSenderId: "171912065024",
  appId: "1:171912065024:web:9c47f66f4b8e7fc727a8e5"
};

const ALLOWED_EMAIL = "marcelodossantosfc@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const docRef = doc(db, "william", "state");

var overlay = document.getElementById('loginOverlay');
var senhaIn = document.getElementById('loginSenha');
var loginBtn = document.getElementById('loginBtn');
var errEl = document.getElementById('loginError');

function showError(msg){ errEl.textContent = msg; }

function tryLogin(){
  var senha = senhaIn.value;
  if(!senha){ showError('Preencha a senha.'); return; }
  loginBtn.disabled = true; loginBtn.textContent = 'Entrando...';
  showError('');
  setPersistence(auth, browserLocalPersistence).then(function(){
    return signInWithEmailAndPassword(auth, ALLOWED_EMAIL, senha);
  }).catch(function(e){
    loginBtn.disabled = false; loginBtn.textContent = 'Entrar';
    showError('Senha incorreta.');
  });
}
loginBtn.onclick = tryLogin;
senhaIn.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

// ---------- PIN LOCAL (trava rápida, funciona sem internet) ----------
var LS_PIN = 'da_pinHash';
var SS_UNLOCKED = 'da_unlocked';
var pinOverlay = document.getElementById('pinOverlay');
var pinInput = document.getElementById('pinInput');
var pinLabel = document.getElementById('pinLabel');
var pinError = document.getElementById('pinError');
var pinSetupStage = 0;
var firstPin = '';

async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function hasPin(){ return !!localStorage.getItem(LS_PIN); }

function initLock(){
  pinSetupStage = 0; firstPin = '';
  pinLabel.textContent = hasPin() ? 'Digite seu PIN' : 'Crie um PIN de acesso (4 a 6 dígitos)';
  pinError.textContent = '';
  pinInput.value = '';
  pinInput.focus();
}

async function handlePinConfirm(){
  var val = pinInput.value.trim();
  pinError.textContent = '';
  if(val.length < 4){ pinError.textContent = 'PIN deve ter ao menos 4 dígitos.'; return; }

  if(!hasPin()){
    if(pinSetupStage === 0){
      firstPin = val; pinSetupStage = 1;
      pinLabel.textContent = 'Confirme o PIN';
      pinInput.value = ''; pinInput.focus();
      return;
    } else {
      if(val !== firstPin){
        pinError.textContent = 'PINs não coincidem. Tente novamente.';
        pinSetupStage = 0; firstPin = '';
        pinLabel.textContent = 'Crie um PIN de acesso (4 a 6 dígitos)';
        pinInput.value = ''; return;
      }
      var hash = await sha256(val);
      localStorage.setItem(LS_PIN, hash);
      showApp();
      return;
    }
  } else {
    var hash2 = await sha256(val);
    if(hash2 === localStorage.getItem(LS_PIN)){ showApp(); }
    else { pinError.textContent = 'PIN incorreto.'; pinInput.value = ''; }
  }
}
document.getElementById('pinConfirmBtn').addEventListener('click', handlePinConfirm);
pinInput.addEventListener('keydown', function(e){ if(e.key==='Enter') handlePinConfirm(); });

function showApp(){
  sessionStorage.setItem(SS_UNLOCKED, '1');
  pinOverlay.style.display = 'none';
}
function showLock(){
  overlay.style.display = 'none';
  pinOverlay.style.display = 'flex';
  initLock();
}
document.getElementById('lockBtn').addEventListener('click', function(){
  sessionStorage.removeItem(SS_UNLOCKED);
  showLock();
});
document.getElementById('forgotPinLink').addEventListener('click', function(e){
  e.preventDefault();
  if(confirm('Isso vai apagar o PIN e sair da conta neste aparelho. Você vai precisar da senha (com internet) pra entrar de novo. Continuar?')){
    localStorage.removeItem(LS_PIN);
    sessionStorage.removeItem(SS_UNLOCKED);
    signOut(auth);
  }
});

window._applyingRemote = false;
var _pendingRemote = null;
var _saveTimeout = null;

function isTypingNow(){
  var ae = document.activeElement;
  return ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT');
}

function applyRemote(remoteStr){
  if (isTypingNow()) { _pendingRemote = remoteStr; return; }
  window._applyingRemote = true;
  localStorage.setItem(window.KEY || 'william_superapp_v1', remoteStr);
  window._applyingRemote = false;
  if (typeof window.render === 'function') window.render();
}

document.addEventListener('focusout', function(){
  if (_pendingRemote) {
    var p = _pendingRemote; _pendingRemote = null;
    setTimeout(function(){ applyRemote(p); }, 200);
  }
});

window.saveState = function(s) {
  if (!window._applyingRemote && auth.currentUser && auth.currentUser.email === ALLOWED_EMAIL) {
    clearTimeout(_saveTimeout);
    _saveTimeout = setTimeout(function(){
      setDoc(docRef, s).catch(function(e){ console.error('Erro ao sincronizar:', e); });
    }, 600);
  }
};

var unsubscribe = null;

onAuthStateChanged(auth, function(user){
  if (user && user.email === ALLOWED_EMAIL) {
    overlay.style.display = 'none';
    loginBtn.disabled = false; loginBtn.textContent = 'Entrar';

    if (!unsubscribe) {
      unsubscribe = onSnapshot(docRef, function(snap){
        if (!snap.exists()) { setDoc(docRef, JSON.parse(localStorage.getItem('william_superapp_v1')||'{}')); return; }
        var remoteStr = JSON.stringify(snap.data());
        var localStr = localStorage.getItem('william_superapp_v1') || '{}';
        if (JSON.stringify(JSON.parse(localStr)) === remoteStr) return;
        applyRemote(remoteStr);
      }, function(err){ console.error('Erro de sincronização:', err); });
    }

    if (sessionStorage.getItem(SS_UNLOCKED) === '1' && hasPin()) {
      showApp();
    } else {
      showLock();
    }
  } else if (user && user.email !== ALLOWED_EMAIL) {
    signOut(auth);
    pinOverlay.style.display = 'none';
    overlay.style.display = 'flex';
    showError('Conta não autorizada.');
  } else {
    pinOverlay.style.display = 'none';
    overlay.style.display = 'flex';
  }
});
</script>
</body>
</html>
